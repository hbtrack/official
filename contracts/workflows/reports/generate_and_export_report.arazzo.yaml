workflows:
  generate_and_export_report:
    summary: Gerar relatório e exportar (pendente desenvolvimento OpenAPI).
    # PLACEHOLDER — operationIds não existem ainda
    steps:
      - stepId: requestReportGeneration
        description: >
          Solicita geração do relatório com tipo, período e filtros.
          Retorna reportJobId para polling de status.
          operationId: requestReport (a definir)
        operationId: PLACEHOLDER_requestReport

      - stepId: pollReportStatus
        description: >
          Verifica status do job de geração. Repetir até status=READY ou FAILED.
          PENDING → aguardar e repetir. READY → prosseguir. FAILED → retornar erro.
          operationId: getReportStatus (a definir)
        operationId: PLACEHOLDER_getReportStatus

      - stepId: downloadReport
        description: >
          Obtém a URL de download do relatório gerado.
          URL temporária (24h). Registra acesso no audit log automaticamente.
          operationId: getReportDownloadUrl (a definir)
        operationId: PLACEHOLDER_getReportDownloadUrl
