arazzo: "1.0.0"

info:
  title: Video — Criar Clip Semântico
  version: "0.1.0"
  summary: Orquestra criação de clip semântico a partir de evento scout ou marcação manual.
  description: >
    Workflow para Technical Analyst ou Scout/Video Analyst:
    1) Obtém segmentos de vídeo disponíveis para o range temporal desejado;
    2) Cria ClipDefinition com metadados semânticos (evento scout, zona, atletas);
    3) Aguarda processamento (clip entra em estado pronto — video.clip.ready).
    Alinhado com DR-VID-004 (clipping semântico sempre) e DR-VID-005 (segmentos imutáveis).
    Sincronização com scout via DR-VID-010 (scout é referência canônica de timecode).
    ADR-033: video como 17º módulo canônico.

sourceDescriptions:
  - name: hbtrack-http
    type: openapi
    url: ../../openapi/openapi.yaml

workflows:
  create_semantic_clip:
    summary: Criar clip semântico a partir de range temporal e contexto de evento scout.
    steps:
      - stepId: listSegments
        operationId: listSegments
        description: >
          Lista MediaSegments disponíveis no range timecodeStart-timecodeEnd.
          Segmentos são imutáveis (DR-VID-005) — garantia de integridade do clip.
      - stepId: createClip
        operationId: createClip
        description: >
          Cria ClipDefinition com metadados semânticos obrigatórios:
          timecodeStart, timecodeEnd, semanticContext (evento scout, zona, atletas).
          DR-VID-004: todo clip carrega contexto semântico indexável.
          Referencia scoutEventId sem duplicar dados do módulo scout (BOUNDARY).
          Emite evento video.clip.ready via AsyncAPI após processamento.
