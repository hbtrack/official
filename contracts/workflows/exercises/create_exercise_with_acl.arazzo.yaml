arazzo: "1.0.0"

info:
  title: Exercises — Create exercise with ACL grant
  version: "0.1.0"
  summary: Cria um exercício ORG e concede acesso a coaches/atletas específicos.
  description: >
    Workflow para criar um exercício no escopo ORG e configurar permissões de acesso:
    1) Cria o exercício (scope=ORG, visibilityMode=RESTRICTED — padrão seguro);
    2) Concede acesso explícito via ACL a usuários designados (DR-EXB-009).

    Pré-condições:
    - Ator autenticado com role que permite criação ORG (não platform_curator para ORG)
    - exerciseId deve ser UUID válido (retornado pelo step 1)

    Pós-condições:
    - Exercício existe com versionNumber=1, changeReason="Initial version"
    - ACL configurada: usuários designados têm acesso READ ou EDIT
    - Exercício pode ser referenciado em training session_exercise (INV-EXB-017)

    Casos de uso:
    - Coach cria exercício tático novo e concede acesso ao seu time
    - Assistente técnico cria exercício e restringe acesso a colaboradores selecionados

sourceDescriptions:
  - name: hbtrack-http
    type: openapi
    url: ../../openapi/openapi.yaml

workflows:
  create_exercise_with_acl:
    summary: Criar exercício ORG e configurar ACL.
    steps:
      - stepId: createExercise
        description: >
          Cria o exercício com visibilityMode=RESTRICTED (padrão seguro).
          Retorna o exerciseId para uso no próximo step.
          Primeira ExerciseVersion criada automaticamente (versionNumber=1).
        operationId: createExercise
        outputs:
          exerciseId: $response.body#/id

      - stepId: grantAclAccess
        description: >
          Concede acesso ao exercício recém-criado.
          Referencia o exerciseId do step anterior.
          Pode ser chamado múltiplas vezes (um step por usuário).
        operationId: addExerciseAclEntry
        parameters:
          - name: id
            in: path
            value: $steps.createExercise.outputs.exerciseId
