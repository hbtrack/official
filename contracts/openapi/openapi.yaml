openapi: "3.1.0"

info:
  title: HB Track API
  version: "1.0.0"
  description: >
    HB Track — Plataforma sports-tech orientada a contratos para gestão e operação de handebol.

    Esta especificação é o contrato normativo e auto-suficiente da interface HTTP pública do sistema.

    Referências normativas abaixo fornecem governança e rastreabilidade, mas não completam comportamento ausente no contrato:
    - .contract_driven/CONTRACT_SYSTEM_LAYOUT.md   (estrutura canônica de artefatos)
    - .contract_driven/templates/api/api_rules.yaml    (governança e validações do sistema contratual)
    - docs/_canon/SYSTEM_SCOPE.md                  (escopo e módulos canônicos)
    - docs/_canon/OPERATIONS.md                    (precedência, naming, validação, modelo de erros RFC 7807)
  contact:
    name: HB Track Team
    email: dev@hbtrack.com
  license:
    name: Proprietary
    identifier: LicenseRef-proprietary

# API9:2023 — Improper Inventory Management: manter inventário de hosts/envs atualizado.
servers:
  - url: http://localhost:8000
    description: Desenvolvimento local
  - url: https://staging.hbtrack.local
    description: Staging (placeholder — substituir por host real no deploy)

