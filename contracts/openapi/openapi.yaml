openapi: "3.1.0"

info:
  title: HB Track API
  version: "0.1.0"
  description: >
    HB Track — Plataforma sports-tech orientada a contratos para gestão e operação de handebol.

    Esta especificação é a fonte primária da verdade para a interface HTTP pública do sistema.

    Referências normativas — consultar antes de implementar:
    - .contract_driven/CONTRACT_SYSTEM_LAYOUT.md   (estrutura canônica de artefatos)
    - .contract_driven/templates/api/api_rules.yaml    (regras, templates e validações de API)
    - docs/_canon/SYSTEM_SCOPE.md                  (escopo e módulos canônicos)
    - docs/_canon/ERROR_MODEL.md                   (convenção de erros RFC 7807)
    - docs/_canon/API_CONVENTIONS.md               (convenções de API — aponta para api_rules.yaml)
  contact:
    name: HB Track Team
    email: dev@hbtrack.com
  license:
    name: Proprietary
    identifier: LicenseRef-proprietary

# API9:2023 — Improper Inventory Management: manter inventário de hosts/envs atualizado.
servers:
  - url: http://localhost:8000
    description: Desenvolvimento local
  - url: https://staging.hbtrack.local
    description: Staging (placeholder — substituir por host real no deploy)

# Path items são definidos por módulo em contracts/openapi/paths/<module>.yaml.
# Adicionar referências aqui conforme cada contrato de módulo for estabelecido.
#
# Módulos canônicos (16):
#   Functional domain: users, seasons, teams, training, wellness, medical,
#                      competitions, matches, scout, exercises, analytics,
#                      reports, ai_ingestion
#   Cross-cutting:     identity_access, audit, notifications
paths:
  # GENERATED PATH INVENTORY — do not edit manually.
  # Source: scripts/generate/gen_openapi_root_inventory.py
  # training module - path items defined in ./paths/training.yaml
  /training-sessions:
    $ref: ./paths/training.yaml#/~1training-sessions
  /training-sessions/{id}:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}
  /training-sessions/{id}/blocks:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1blocks
  /training-sessions/{id}/blocks/{blockId}:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1blocks~1{blockId}
  /training-sessions/{id}/blocks/reorder:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1blocks~1reorder
  /training-sessions/{id}/attendance:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1attendance
  /training-sessions/{id}/wellness-pre:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1wellness-pre
  /training-sessions/{id}/wellness-pre/{athleteId}:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1wellness-pre~1{athleteId}
  /training-sessions/{id}/wellness-post:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1wellness-post
  /training-sessions/{id}/wellness-post/{athleteId}:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1wellness-post~1{athleteId}
  /mesocycles:
    $ref: ./paths/training.yaml#/~1mesocycles
  /mesocycles/{id}:
    $ref: ./paths/training.yaml#/~1mesocycles~1{id}
  /microcycles:
    $ref: ./paths/training.yaml#/~1microcycles
  /microcycles/{id}:
    $ref: ./paths/training.yaml#/~1microcycles~1{id}
  /training-sessions/{id}/start:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1start
  /training-sessions/{id}/complete:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1complete
  /training-sessions/{id}/execution-records:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1execution-records
  /training-sessions/{id}/execution-records/{recordId}:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1execution-records~1{recordId}
  /training-sessions/{id}/feedback-threads:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1feedback-threads
  /training-sessions/{id}/objectives:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1objectives
  /training-sessions/{id}/attention-queue:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1attention-queue
  /training-sessions/{id}/cancel:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1cancel
  /training-sessions/{id}/publish:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1publish
  /training-sessions/{id}/unpublish:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1unpublish
  /training-sessions/{id}/archive:
    $ref: ./paths/training.yaml#/~1training-sessions~1{id}~1archive
  # exercises module - path items defined in ./paths/exercises.yaml
  /exercises:
    $ref: ./paths/exercises.yaml#/~1exercises
  /exercises/{id}:
    $ref: ./paths/exercises.yaml#/~1exercises~1{id}
  /exercises/{id}/copy:
    $ref: ./paths/exercises.yaml#/~1exercises~1{id}~1copy
  /exercises/{id}/versions:
    $ref: ./paths/exercises.yaml#/~1exercises~1{id}~1versions
  /exercises/{id}/versions/{versionId}:
    $ref: ./paths/exercises.yaml#/~1exercises~1{id}~1versions~1{versionId}
  /exercises/{id}/relations:
    $ref: ./paths/exercises.yaml#/~1exercises~1{id}~1relations
  /exercises/{id}/relations/{relationId}:
    $ref: ./paths/exercises.yaml#/~1exercises~1{id}~1relations~1{relationId}
  /exercises/{id}/acl:
    $ref: ./paths/exercises.yaml#/~1exercises~1{id}~1acl
  /exercises/{id}/acl/{userId}:
    $ref: ./paths/exercises.yaml#/~1exercises~1{id}~1acl~1{userId}
components:
  parameters:
    pageSize:
      $ref: ./components/parameters/pageSize.yaml
    pageToken:
      $ref: ./components/parameters/pageToken.yaml

  schemas:
    # RFC 7807 Problem+JSON — shape canônico para todos os erros HTTP.
    # Ver: .contract_driven/templates/api/api_rules.yaml → design_rules.errors
    problem:
      $ref: ./components/schemas/shared/problem.yaml

  responses: {}
  requestBodies: {}
  # Schemes de segurança serão definidos quando identity_access for contratado.
  securitySchemes: {}
  examples: {}

# Segurança global vazia — placeholder explícito.
# API5:2023 BFLA — default-deny: aplicar security requirement por operação individualmente.
# NÃO depender deste global como proteção real.
security: []

# Tags canônicas: uma por módulo (CONTRACT_SYSTEM_LAYOUT.md §2).
# Módulos de domínio funcional (13) + transversais (3) = 16 total.
tags:
  - name: users
    description: "Pessoa, perfil e dados de identidade funcional pessoal."
  - name: seasons
    description: "Temporadas e ciclos competitivos."
  - name: teams
    description: "Equipes, comissão técnica e composição de elenco."
  - name: training
    description: "Sessões de treino, ciclos, cargas e presença."
  - name: wellness
    description: "Bem-estar, pré-treino e pós-treino conversacional."
  - name: medical
    description: "Saúde, lesões e histórico médico."
  - name: competitions
    description: "Competições, fases e classificações."
  - name: matches
    description: "Partidas, placar e eventos de jogo."
  - name: scout
    description: "Eventos de scout e análise tática."
  - name: exercises
    description: "Banco de exercícios e mídia associada."
  - name: analytics
    description: "Métricas, relatórios e dashboards analíticos."
  - name: reports
    description: "Exportação e relatórios operacionais."
  - name: ai_ingestion
    description: "Ingestão de dados para modelos de IA e coach."
  - name: identity_access
    description: "Autenticação, autorização, credenciais, sessões, MFA, JWT e RBAC."
  - name: audit
    description: "Trilha de auditoria e rastreabilidade de eventos."
  - name: notifications
    description: "Notificações e alertas para usuários."
