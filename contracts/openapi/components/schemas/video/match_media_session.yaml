title: MatchMediaSession
description: Root aggregated entity orchestrating video lifecycle. References DR-VID-001..010, INV-VID-001..012.
type: object
required: [id, matchId, state, captureMode, retentionPolicy, createdAt, createdByUserId]
properties:
  id:
    type: string
    format: uuid
  matchId:
    type: string
    format: uuid
    x-semantic-id: sport.match.id.v1
  state:
    type: string
    enum: [DRAFT, CAPTURING, SYNCING, TRANSCODING, PUBLISHED]
  captureMode:
    type: string
    enum: [PANORAMIC, AUTO_FOLLOW, MULTI_ANGLE]
  retentionPolicy:
    type: string
    enum: [keep_7_days, keep_30_days, keep_90_days, archive_s3, public_forever]
  lastTimecode:
    type: integer
    minimum: 0
  technicalContactUserId:
    type: [string, "null"]
    format: uuid
  createdAt:
    type: string
    format: date-time
  createdByUserId:
    type: string
    format: uuid
    x-semantic-id: identity.user.id.v1
  segmentCount:
    type: integer
    minimum: 0
additionalProperties: false
