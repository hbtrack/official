title: ClipDefinition
description: Semantic clip with context
type: object
required: [id, sessionId, fromTimecode, toTimecode]
properties:
  id:
    type: string
    format: uuid
  sessionId:
    type: string
    format: uuid
  fromTimecode:
    type: integer
    minimum: 0
  toTimecode:
    type: integer
    minimum: 0
  scoutEventId:
    type: [string, "null"]
    format: uuid
  zoneLabel:
    type: [string, "null"]
  athleteIds:
    type: array
    items:
      type: string
      format: uuid
  createdAt:
    type: string
    format: date-time
additionalProperties: false
