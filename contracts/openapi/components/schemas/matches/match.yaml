type: object
title: Match
description: Handball match
properties:
  matchId:
    type: string
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
    format: uuid
  homeTeam:
    type: string
  awayTeam:
    type: string
  date:
    type: string
    format: date-time
required:
- matchId
- homeTeam
- awayTeam
additionalProperties: false
