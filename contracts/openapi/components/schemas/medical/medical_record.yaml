type: object
title: Medical Record
description: Medical record for athlete
properties:
  recordId:
    type: string
    format: uuid
  athleteId:
    type: string
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  date:
    type: string
    format: date
required:
- recordId
- athleteId
additionalProperties: false
