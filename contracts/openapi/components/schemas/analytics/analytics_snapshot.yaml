type: object
title: Analytics Snapshot
description: A snapshot of analytics data at a specific point in time.
properties:
  snapshotId:
    type: string
    format: uuid
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  timestamp:
    type: string
    format: date-time
  metricName:
    type: string
  metricValue:
    type: number
  aggregationType:
    type: string
    enum:
    - SUM
    - AVG
    - MIN
    - MAX
    - COUNT
    x-domain-enum-ref: analytics_aggregation_type
required:
- snapshotId
- timestamp
- metricName
- metricValue
additionalProperties: false
