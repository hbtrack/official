type: object
title: Auth Session
description: Authentication session
properties:
  sessionId:
    type: string
    pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
  token:
    type: string
  expiresAt:
    type: string
    format: date-time
required:
- sessionId
- token
additionalProperties: false
