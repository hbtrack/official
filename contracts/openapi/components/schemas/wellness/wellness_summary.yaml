title: WellnessSummary
description: >
  Resumo agregado de wellness de um atleta para um período.

  Contém médias de scores autorreferidos e tendência de readiness.
  Insumo consultivo para training e analytics (DR-WELL-002) — NÃO constitui
  avaliação clínica, diagnóstico ou liberação médica.

  Boundary (INV-WELL-004):
  - NÃO CONTÉM: campos clínicos, diagnósticos ou prescrições
  - CONTÉM: apenas agregações de percepção autorreferida

type: object
required:
  - athleteUserId
  - dateFrom
  - dateTo
  - entryCount
  - avgReadinessScore
additionalProperties: false
properties:
  athleteUserId:
    type: string
    format: uuid
    description: UUID do atleta. Referência ao módulo users.
    x-semantic-id: identity.user.id.v1
  dateFrom:
    type: string
    format: date
    description: "Início do período de agregação (YYYY-MM-DD)."
  dateTo:
    type: string
    format: date
    description: "Fim do período de agregação (YYYY-MM-DD)."
  entryCount:
    type: integer
    minimum: 0
    description: Número de entradas no período.
  avgReadinessScore:
    type:
      - number
      - "null"
    minimum: 0
    maximum: 10
    description: >
      Média de readinessScore no período [0..10].
      Null se entryCount == 0 ou readinessScore ausente em todas as entradas.
  avgFatigueScore:
    type:
      - number
      - "null"
    minimum: 0
    maximum: 10
    description: Média de fatigueScore no período [0..10]. Null se sem dados.
  avgPainScore:
    type:
      - number
      - "null"
    minimum: 0
    maximum: 10
    description: >
      Média de painScore no período [0..10].
      Percepção subjetiva — NÃO é avaliação clínica (INV-WELL-004).
  avgRecoveryScore:
    type:
      - number
      - "null"
    minimum: 0
    maximum: 10
    description: Média de recoveryScore no período [0..10]. Null se sem dados.
  avgSleepHours:
    type:
      - number
      - "null"
    minimum: 0
    maximum: 24
    description: Média de sleepHours no período [0..24]. Null se sem dados.
  readinessTrend:
    type:
      - string
      - "null"
    enum:
      - improving
      - stable
      - declining
      - "null"
    description: >
      Tendência de readiness com base nos últimos registros do período.
      Calculado quando entryCount >= 3. Null se dados insuficientes.
  lastEntryDate:
    type:
      - string
      - "null"
    format: date
    description: "Data da última entrada registrada no período (YYYY-MM-DD)."
