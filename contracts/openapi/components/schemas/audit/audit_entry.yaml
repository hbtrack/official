type: object
title: Audit Entry
description: Record of audited action
properties:
  entryId:
    type: string
    format: uuid
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  action:
    type: string
  timestamp:
    type: string
    format: date-time
  userId:
    type: string
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  resourceType:
    type: string
required:
- entryId
- action
- timestamp
additionalProperties: false
