type: object
title: Scout Event
description: Scouting event record
properties:
  eventId:
    type: string
    format: uuid
    pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
  type:
    type: string
  timestamp:
    type: string
    format: date-time
required:
- eventId
- type
additionalProperties: false
