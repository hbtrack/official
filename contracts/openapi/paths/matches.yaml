        format: uuid
        x-semantic-id: users.user.id.v1
      description: UUID do atleta a incluir/remover do lineup.

  put:
    tags:
      - matches
    summary: Adicionar atleta ao lineup
    description: >
      Adiciona um atleta ao lineup oficial da partida (DR-MATCH-003).
      lineupUserIds = elenco escalado oficial — participação em scout não substitui.
      HBR-008: máximo 16 jogadores em súmula por equipe.
      Retorna o registro completo da partida atualizado.
    operationId: addPlayerToLineup
    security:
      - HTTPBearer: []
    responses:
      "200":
        description: Atleta adicionado ao lineup. Retorna partida atualizada.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/matches/match.yaml"
      "400":
        description: >
          Operação inválida. Ex: atleta já está no lineup,
          limite HBR-008 de 16 jogadores atingido.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "401":
        description: Token ausente ou expirado (ADR-007).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "403":
        description: Papel RBAC insuficiente (ADR-008).
        content:
