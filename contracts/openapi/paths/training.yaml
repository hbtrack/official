/training-sessions/{id}/objectives:
  get:
    tags:
      - Session Objectives
    summary: List objectives for a session
    description: Returns all objectives defined for the specified training session. Every session must have at least one objective (TRAIN-DEC-004).
    operationId: listSessionObjectives
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: List of session objectives
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/training/session_objective.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []
  post:
    tags:
      - Session Objectives
    summary: Add an objective to a session
    description: >
      Session must have at least one objective before transitioning from DRAFT (TRAIN-DEC-006).
      Objective must declare a traceable origin (TRAIN-DEC-005).
      MANUAL_COACH_RATIONALE origin requires originNotes (min 10 chars).
    operationId: createSessionObjective
    parameters:
      - name: id
