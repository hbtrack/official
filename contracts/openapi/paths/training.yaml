# ---------------------------------------------------------------------------
# EXECUTION RECORDS — TRAIN-DEC-007, TRAIN-DEC-008, TRAIN-DEC-009
# Append-only execution facts. planned vs actual duality preserved.
# Live adjustments require structured reason (TRAIN-DEC-009).
# ADR-018 (HYBRID): append-only during IN_PROGRESS.
# ---------------------------------------------------------------------------
/training-sessions/{id}/execution-records:
  get:
    tags:
      - Execution Records
    summary: List execution records for a session
    description: >
      Returns all execution records for a session.
      ExecutionRecord cannot exist without session context (TRAIN-DEC-007).
    operationId: listExecutionRecords
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: executionType
        in: query
        schema:
          type: string
          x-domain-enum-ref: execution_type
          enum:
            - SESSION_EXECUTION
            - BLOCK_EXECUTION
            - LIVE_ADJUSTMENT
            - CONSTRAINT_OVERRIDE
            - ALTERNATE_EXERCISE
            - LOAD_RECALCULATION
      - name: blockId
        in: query
        schema:
          type: string
          format: uuid
      - name: athleteId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: List of execution records
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/training/execution_record.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Session not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []
  post:
    tags:
      - Execution Records
    summary: Create an execution record for a session
    description: >
      Append-only execution fact. sessionId is immutable after creation (TRAIN-DEC-007).
      planned vs actual fields are preserved separately (TRAIN-DEC-008).
      LIVE_ADJUSTMENT and CONSTRAINT_OVERRIDE require adjustmentReasonType + coachRationale (TRAIN-DEC-009).
      Idempotency key supported (TRAIN-DEC-038).
      Produces audit_event (TRAIN-DEC-023).
    operationId: createExecutionRecord
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: Client-supplied idempotency key (TRAIN-DEC-038).
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/training/execution_record.yaml
    responses:
      "201":
        description: Execution record created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/execution_record.yaml
      "400":
        description: Validation error (e.g., missing required reason for adjustment)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Session not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "409":
        description: Conflict — duplicate idempotency key
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "422":
        description: Unprocessable entity — constraint violation
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []
/training-sessions/{id}/execution-records/{recordId}:
  get:
    tags:
      - Execution Records
    summary: Get a specific execution record
    description: Returns a specific execution record for a training session, identified by its record ID.
    operationId: getExecutionRecord
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: recordId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: Execution record
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/execution_record.yaml
      "404":
        description: Not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []

# ---------------------------------------------------------------------------
# FEEDBACK THREADS — TRAIN-DEC-010, TRAIN-DEC-015
# Must be anchored to operational context. Must produce conversation outcome.
# ---------------------------------------------------------------------------
/training-sessions/{id}/feedback-threads:
  get:
    tags:
      - Feedback Threads
    summary: List feedback threads for a session
    description: Returns all feedback threads anchored to this session. Can be filtered by context type and athlete.
    operationId: listFeedbackThreads
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: contextType
        in: query
        schema:
          type: string
          x-domain-enum-ref: feedback_context_type
          enum:
            - SESSION
            - BLOCK
            - OBJECTIVE
            - ATHLETE
            - EVIDENCE
            - GROUP
      - name: athleteId
        in: query
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: List of feedback threads
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/training/feedback_thread.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []
  post:
    tags:
      - Feedback Threads
    summary: Create a feedback thread for a session
    description: >
      Feedback must reference an operational context (TRAIN-DEC-010).
      Must produce a conversationOutcome (TRAIN-DEC-015).
      Feedback without context or outcome is rejected.
    operationId: createFeedbackThread
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/training/feedback_thread.yaml
    responses:
      "201":
        description: Feedback thread created
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/feedback_thread.yaml
      "400":
        description: Validation error (missing context or outcome)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "409":
        description: Conflict with current resource state, uniqueness constraint, referential integrity, or concurrent update
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []

# ---------------------------------------------------------------------------
