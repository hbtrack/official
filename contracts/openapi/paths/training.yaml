# ---------------------------------------------------------------------------
# ATHLETE INELIGIBILITY — TRAIN-DEC-024, RC-14 (boundary: medical is sovereign)
# Declared by athlete at check-in. Training module stores declaration only —
# medical restriction_profile remains sovereign in medical module.
# ---------------------------------------------------------------------------
/training-sessions/{id}/ineligibility:
  post:
    tags:
      - Athlete Check-in
    summary: Submit athlete ineligibility declaration for a session
    description: >
      Athlete declares ineligibility for this session (TRAIN-DEC-024).
      This endpoint stores the training-side declaration only.
      Medical restriction_profile remains sovereign in the medical module (RC-14 boundary rule).
      Allowed only while session is PUBLISHED or IN_PROGRESS.
      OWASP API1:2023 (BOLA): athlete can only declare for themselves.
    operationId: submitIneligibilityDeclaration
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/training/athlete_ineligibility_declaration.yaml
    responses:
      "201":
        description: Ineligibility declaration submitted
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/athlete_ineligibility_declaration.yaml
      "400":
        description: Validation error (e.g., missing reasonFlags)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden — athlete can only submit for themselves
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Session not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "409":
        description: Conflict — session not in PUBLISHED or IN_PROGRESS state
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: [] # OWASP API5:2023 BFLA — G-02
  get:
    tags:
      - Athlete Check-in
    summary: Get athlete ineligibility status for a session
    description: >
      Returns the current ineligibility declaration for the authenticated athlete in this session.
      Coach may query for any athlete in their team (PERMISSIONS_TRAINING.md).
    operationId: getIneligibilityStatus
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: athleteId
        in: query
        schema:
          type: string
          format: uuid
        description: Coach-only. Query ineligibility for a specific athlete. Defaults to self.
    responses:
      "200":
        description: Ineligibility declaration (or absence of one)
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/athlete_ineligibility_declaration.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Session or declaration not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []

