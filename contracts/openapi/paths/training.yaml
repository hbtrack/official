      - HTTPBearer: [] # OWASP API5:2023 BFLA — G-04

# ---------------------------------------------------------------------------
# LOAD CHART — D-UI-SP-04, TRAIN-DEC-025 (coach review)
# Aggregated load × readiness data for periodization planning.
# Desktop-only view (D-UI-16). Read-only analytics endpoint.
# ---------------------------------------------------------------------------
/training/load-chart:
  get:
    tags:
      - Analytics
    summary: Get aggregated load and readiness chart data
    description: >
      Returns aggregated training load and readiness data for periodization planning.
      Inspired by ATL/CTL model (D-UI-SP-04). Desktop-only view (D-UI-16 escritório context).
      Either teamId or athleteId is required (not both).
      OWASP API1:2023 (BOLA): data scoped to caller's organization and team.
      OWASP API4:2023: date range limited to max 365 days.
    operationId: getLoadChart
    parameters:
      - name: teamId
        in: query
        schema:
          type: string
          format: uuid
        description: Required when querying team data. Mutually exclusive with athleteId.
      - name: athleteId
        in: query
        schema:
          type: string
          format: uuid
        description: Required when querying individual athlete data. Mutually exclusive with teamId.
      - name: range
        in: query
        schema:
          type: string
          enum:
            - 7d
            - 30d
            - season
          default: 30d
        description: Time range for chart data. 'season' uses current active season boundaries.
      - name: seasonId
        in: query
        schema:
          type: string
          format: uuid
        description: Required when range=season. Identifies the season to query.
    responses:
      "200":
        description: Load chart data
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/load_chart.yaml
      "400":
        description: Validation error (e.g., neither teamId nor athleteId provided, or both provided)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden — caller not authorized for requested team/athlete data
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Team, athlete, or season not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []

# ---------------------------------------------------------------------------
# HB PRO COACH — G-06 (UIF-TRAINING-006, MVP v1.1)
# Virtual assistant chat for athletes. Feature Store integration via ai_ingestion.
# Decision Refs: D-UI-20, D-UI-21, TRAIN-DEC-009
# OWASP API1:2023 (BOLA): athlete can only access own conversation.
# OWASP API5:2023 (BFLA): coach/staff may read with explicit permission.
# ---------------------------------------------------------------------------
/hb-pro-coach/conversations/{conversationId}/messages:
  get:
    tags: [training]
    summary: List chat messages for a conversation
    description: >
      Returns paginated chat history for the given conversation.
      OWASP API1:2023 (BOLA): athlete can only access own conversation.
      OWASP API4:2023: pageSize capped at 100 server-side.
      D-UI-20: default page size = 20 (last 20 messages loaded on open).
    operationId: listChatMessages
    parameters:
      - name: conversationId
        in: path
        required: true
        description: Unique identifier of the athlete conversation.
        schema:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number (1-based).
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Number of messages per page. Max 100 (OWASP API4:2023).
    responses:
      "200":
        description: Paginated list of chat messages (oldest → newest within page)
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - items
                - total
                - page
                - pageSize
              properties:
                items:
                  type: array
                  items:
                    $ref: ../components/schemas/training/athlete_chat_message.yaml
                total:
                  type: integer
                  minimum: 0
                  description: Total number of messages in the conversation.
                page:
                  type: integer
                  minimum: 1
                pageSize:
                  type: integer
                  minimum: 1
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden — caller does not own this conversation (OWASP BOLA)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Conversation not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []
/hb-pro-coach/training-suggestions:
  post:
    tags: [training]
    summary: Submit a training suggestion to the athlete's coach
    description: >
      HB Pro Coach submits an AI-generated training suggestion for coach review.
      Generates async notification to coach (AsyncAPI training.suggestion.created event).
      OWASP API1:2023 (BOLA): athleteId must match authenticated user.
      OWASP API3:2023 (BOPLA): allowlist enforced.
      Idempotency key supported to prevent duplicate suggestions on retry.
    operationId: submitTrainingSuggestion
    parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          maxLength: 128
        description: Client idempotency key to prevent duplicate submissions on retry.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - athleteId
              - trainingName
              - duration
            properties:
              athleteId:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                x-semantic-id: users.athlete.id.v1
              trainingName:
                type: string
                minLength: 1
                maxLength: 120
                description: Human-readable name for the suggested session.
              duration:
                type: integer
                minimum: 1
                maximum: 480
                description: Suggested duration in minutes.
              objectives:
                type: array
                items:
                  type: string
                  maxLength: 255
                maxItems: 10
                description: List of training objectives.
              context:
                type: string
                maxLength: 1000
                description: AI-generated justification for the suggestion (Feature Store context).
    responses:
      "201":
        description: Training suggestion created and coach notification dispatched
        headers:
          Location:
            description: URI of the created training suggestion
            schema:
              type: string
              format: uri
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/training_suggestion.yaml
      "400":
        description: Validation error
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden — athleteId does not match authenticated user (OWASP BOLA)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "409":
        description: Duplicate idempotency key — suggestion already submitted
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []
