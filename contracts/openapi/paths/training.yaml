/training-sessions/{id}/wellness-post:
  post:
    tags: [training]
    summary: Submit post-training wellness
    description: >
      Atleta submete wellness pós-treino (RPE + carga efetiva).
      internal_load é calculado server-side: minutesEffective × sessionRpe (SS-TRAIN-001, INV-TRAIN-021).

      Regras aplicadas:
      - INV-TRAIN-010: único por (training_session_id, athlete_id)
      - INV-TRAIN-032 / SS-TRAIN-002: sessionRpe ∈ [0, 10]
      - INV-TRAIN-070: aceita notes para registro conversacional
      - OWASP API1:2023 (BOLA): atleta submete para si mesmo
    operationId: submitWellnessPost
    parameters:
      - name: id
        in: path
        required: true
        description: Training session ID
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - athleteId
              - sessionRpe
              - minutesEffective
            properties:
              athleteId:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                x-semantic-id: users.athlete.id.v1
              sessionRpe:
                type: number
                minimum: 0
                maximum: 10
                description: >
                  Session RPE CR-10 scale. Collect 20–30 min post-session (SS-TRAIN-002).
                  Domain [0, 10] — INV-TRAIN-032. Fora do domínio → 400.
              minutesEffective:
                type: integer
                minimum: 1
                maximum: 1440
                description: >
                  Effective session duration in minutes.
                  Used to compute internal_load = minutesEffective × sessionRpe (SS-TRAIN-001).
              notes:
                type: string
                maxLength: 500
                description: "Optional conversational feedback (INV-TRAIN-070)"
    responses:
      "201":
        description: Wellness post submitted
        headers:
          Location:
            description: URI of the created resource
            schema:
              type: string
              format: uri
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/wellness_post.yaml
      "400":
        description: Validation error (e.g., sessionRpe out of range — INV-TRAIN-032)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden (BOLA — athlete submitting for another)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Training session or athlete not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "409":
        description: Wellness post already submitted for this athlete/session (INV-TRAIN-010)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: [] # OWASP API5:2023 BFLA
