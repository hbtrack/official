      "400":
        description: Validation error (missing origin or originNotes for MANUAL)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "409":
        description: Conflict with current resource state, uniqueness constraint, referential integrity, or concurrent update
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []

# ---------------------------------------------------------------------------
# ATTENTION QUEUE — TRAIN-DEC-027, INV-TRAIN-083
# Finite and prioritized. Severity + reason + target always required.
# ---------------------------------------------------------------------------
/training-sessions/{id}/attention-queue:
  get:
    tags:
      - Attention Queue
    summary: List attention queue items for a session
    description: >
      Returns items requiring coach attention.
      All items have explicit severity, structuredReason, and targetEntity (TRAIN-DEC-027).
    operationId: listAttentionQueueItems
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: severity
        in: query
        schema:
          type: string
          x-domain-enum-ref: attention_queue_severity
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
      - name: resolved
        in: query
        schema:
          type: boolean
        description: Filter by resolved status. Default false (active items only).
    responses:
      "200":
        description: List of attention queue items
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/training/attention_queue_item.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []
/training-sessions/{id}/cancel:
  post:
    tags:
      - Training Sessions
    summary: Cancel a training session
    description: >
      Structured cancellation. Allowed from DRAFT, SCHEDULED, PUBLISHED, IN_PROGRESS.
      COMPLETED and ARCHIVED cannot be cancelled (ADR-017 FSM — FI-007).
      Produces audit_event (TRAIN-DEC-023). Emits notification_intent (TRAIN-DEC-022).
      IN_PROGRESS: physical deletion forbidden — logical cancel only (TRAIN-DEC-013).
    operationId: cancelTrainingSession
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - cancellationReason
            properties:
              cancellationReason:
                type: string
                minLength: 1
                maxLength: 500
                description: Structured cancellation reason. Required (TRAIN-DEC-013).
              notifyAthletes:
                type: boolean
                description: If true, emit notification_intent to athletes (TRAIN-DEC-022).
    responses:
      "200":
        description: Session transitioned to CANCELLED
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/training_session.yaml
      "400":
        description: Validation error (e.g., missing cancellationReason)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "409":
        description: Conflict — session COMPLETED or ARCHIVED (ADR-017 forbidden transition)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: [] # OWASP API5:2023 BFLA
/training-sessions/{id}/publish:
  post:
    tags:
      - Training Sessions
    summary: Publish a training session (SCHEDULED → PUBLISHED)
    description: >
      Triggers transition SCHEDULED→PUBLISHED (ADR-017 FSM). Captures
      plannedContentSnapshot (immutable write-once — TRAIN-DEC-045, INV-TRAIN-088).
      Requires individualizationMode, sessionAt, and at least one session_objective
      (INV-TRAIN-086). Emits notification_intent to athletes (TRAIN-DEC-022).
      Produces audit_event (TRAIN-DEC-023). STATE_MODEL_TRAINING.md §Transitions.
    operationId: publishTrainingSession
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              notifyAthletes:
                type: boolean
                description: If true, emit notification_intent to athletes (TRAIN-DEC-022).
    responses:
      "200":
        description: Session transitioned to PUBLISHED
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/training_session.yaml
      "400":
        description: Validation error (missing required fields for publication — INV-TRAIN-086)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden (role does not allow publishing)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "409":
        description: Conflict — session not in SCHEDULED state (ADR-017 forbidden transition)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: [] # OWASP API5:2023 BFLA
/training-sessions/{id}/unpublish:
  post:
    tags:
      - Training Sessions
    summary: Unpublish a training session (PUBLISHED → SCHEDULED)
    description: >
      Triggers transition PUBLISHED→SCHEDULED (ADR-017 FSM, explicit depublication).
      Removes athlete visibility. plannedContentSnapshot is cleared on unpublish
      to allow new snapshot on next PUBLISHED transition (TRAIN-DEC-045).
      Emits notification_intent (TRAIN-DEC-022). Produces audit_event (TRAIN-DEC-023).
    operationId: unpublishTrainingSession
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              reason:
                type: string
                maxLength: 500
                description: Optional coach rationale for unpublishing.
              notifyAthletes:
                type: boolean
                description: If true, emit notification_intent (TRAIN-DEC-022).
    responses:
      "200":
        description: Session transitioned to SCHEDULED
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/training_session.yaml
      "400":
        description: Validation error
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "409":
        description: Conflict — session not in PUBLISHED state (ADR-017 forbidden transition)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: [] # OWASP API5:2023 BFLA
/training-sessions/{id}/archive:
  post:
    tags:
      - Training Sessions
    summary: Archive a training session (COMPLETED → ARCHIVED)
    description: >
      Explicitly triggers COMPLETED→ARCHIVED (ADR-017 FSM). This transition also
      occurs automatically 60 days after COMPLETED. Only allowed from COMPLETED.
      ARCHIVED is a terminal read-only state. Produces audit_event (TRAIN-DEC-023).
    operationId: archiveTrainingSession
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              archiveReason:
                type: string
                maxLength: 500
                description: Optional reason for explicit archiving before the 60-day automatic window.
    responses:
      "200":
        description: Session transitioned to ARCHIVED
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/training_session.yaml
      "400":
        description: Validation error
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "409":
        description: Conflict — session not in COMPLETED state (ADR-017 forbidden transition)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: [] # OWASP API5:2023 BFLA

# ---------------------------------------------------------------------------
# RECOMMENDATIONS — ADR-006 (Coach-in-Loop), TRAIN-DEC-025
# Coach must review and accept/dismiss analytics recommendations.
# Recommendations are generated by ai_ingestion module and read by training.
# ---------------------------------------------------------------------------
/training-sessions/{id}/recommendations:
  get:
    tags:
      - Recommendations
    summary: List analytics recommendations for a session
    description: >
      Returns analytics recommendations generated for this session (ADR-006 Coach-in-Loop).
      Recommendations are read-only in this endpoint — accept/dismiss via dedicated action endpoints.
      OWASP API1:2023 (BOLA): only recommendations belonging to session {id} are returned.
    operationId: listRecommendations
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
            - PENDING
            - ACCEPTED
            - DISMISSED
        description: Filter by recommendation status. Default PENDING.
    responses:
      "200":
        description: List of recommendations
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: ../components/schemas/training/recommendation.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Session not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: []
/training-sessions/{id}/recommendations/{recommendationId}/accept:
  post:
    tags:
      - Recommendations
    summary: Accept an analytics recommendation
    description: >
      Coach accepts a PENDING recommendation (ADR-006 Coach-in-Loop).
      Transitions recommendation status from PENDING to ACCEPTED.
      Produces audit_event. Only the assigned coach or head coach may accept.
      OWASP API5:2023 (BFLA): role-based authorization enforced server-side.
    operationId: acceptRecommendation
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
