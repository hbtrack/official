# ─────────────────────────────────────────────────────────────────────────────
# Session Lifecycle Transitions (TRAIN-DEC-029 HYBRID append-only facts)
# ADR-017 FSM: DRAFT/SCHEDULED/PUBLISHED → IN_PROGRESS → COMPLETED
# ─────────────────────────────────────────────────────────────────────────────
/training-sessions/{id}/start:
  post:
    tags:
      - Training Sessions
    summary: Start a training session (transition to IN_PROGRESS)
    description: >
      Triggers the SESSION_STARTED append-only fact (TRAIN-DEC-029).
      Allowed from PUBLISHED or SCHEDULED. Sets startedAt = now (server-side).
      ADR-017 FSM.
    operationId: startTrainingSession
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: false
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              delayMinutes:
                type: integer
                minimum: 0
                maximum: 1440
                description: Actual delay relative to scheduled sessionAt (if any).
              coachNotes:
                type: string
                maxLength: 500
                description: Optional coach annotation at session start.
    responses:
      "200":
        description: Session transitioned to IN_PROGRESS
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/training_session.yaml
      "400":
        description: Invalid transition (e.g., session is COMPLETED or CANCELLED)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden (role does not allow starting this session)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "409":
        description: Conflict — session already IN_PROGRESS
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
    security:
      - HTTPBearer: [] # OWASP API5:2023 BFLA
/training-sessions/{id}/complete:
  post:
    tags:
      - Training Sessions
    summary: Complete a training session (transition to COMPLETED)
    description: >
      Triggers the SESSION_COMPLETED append-only fact (TRAIN-DEC-029).
      Allowed from IN_PROGRESS only. Sets endedAt = now (server-side).
      Captures Fase 1 planned vs actual: actualLoadRecorded, durationActualMinutes (TRAIN-DEC-045).
      planned_content_snapshot frozen at PUBLISHED — never overwritten (FI-007).
      INV-TRAIN-019: audit_log appended.
    operationId: completeTrainingSession
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required:
              - durationActualMinutes
            properties:
              durationActualMinutes:
                type: integer
                minimum: 1
                maximum: 1440
                description: Actual session duration in minutes. TRAIN-DEC-045 Fase 1.
              actualLoadRecorded:
                type: integer
                minimum: 0
                maximum: 32767
                description: Actual load recorded. Pair of plannedLoad. TRAIN-DEC-045 Fase 1.
              planningDeviationFlag:
                type: boolean
                description: True if execution deviated significantly from plan.
              deviationJustification:
                type: string
                maxLength: 500
                description: >
                  Required when planningDeviationFlag is true. INV-TRAIN-011.
                  Minimum 50 characters for significant deviations.
              executionOutcome:
                type: string
                minLength: 1
                maxLength: 32
                description: Structured outcome label (e.g., on_time, delayed, partial, interrupted).
              coachNotes:
                type: string
                maxLength: 1000
                description: Coach qualitative annotation (decision_rationale). TRAIN-DEC-021.
    responses:
      "200":
        description: Session transitioned to COMPLETED
        content:
          application/json:
            schema:
              $ref: ../components/schemas/training/training_session.yaml
      "400":
        description: Validation error (e.g., deviationJustification required when flag=true)
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "401":
        description: Unauthenticated
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "403":
        description: Forbidden
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "404":
        description: Not found
        content:
          application/problem+json:
            schema:
              $ref: ../components/schemas/shared/problem.yaml
      "409":
        description: Conflict — session not IN_PROGRESS
        content:
          application/problem+json:
