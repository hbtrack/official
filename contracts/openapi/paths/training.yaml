                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
                x-semantic-id: users.athlete.id.v1
              sleepQuality:
                type: integer
                minimum: 1
                maximum: 5
                description: "Sleep quality 1–5: 1=very poor, 5=excellent (SS-TRAIN-005, INV-TRAIN-034)"
              sleepHours:
                type: number
                minimum: 0
                maximum: 24
                description: "Self-reported sleep hours [0, 24] (SS-TRAIN-006, INV-TRAIN-033)"
    responses:
