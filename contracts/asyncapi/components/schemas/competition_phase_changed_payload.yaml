# AsyncAPI Payload: competition_phase_changed
# Domain rules: DR-COMP-001, DR-COMP-004 / INV-COMP-001, INV-COMP-003

type: object
required:
  - eventType
  - occurredAt
  - competitionId
  - seasonId
  - statusLabel
additionalProperties: false
properties:
  eventType:
    type: string
    const: competition.phase_changed
  occurredAt:
    type: string
    format: date-time
    x-semantic-id: core.occurred_at.v1
  competitionId:
    type: string
    format: uuid
    x-semantic-id: competitions.competition.id.v1
  seasonId:
    type: string
    format: uuid
    x-semantic-id: seasons.season.id.v1
  name:
    type: [string, "null"]
    maxLength: 140
  previousStatusLabel:
    type: [string, "null"]
    enum: [draft, active, archived, null]
    description: Status anterior à transição (null se apenas stageLabels foi alterado).
  statusLabel:
    type: string
    enum: [draft, active, archived]
    description: Status atual após a transição.
  stageLabels:
    type: array
    uniqueItems: true
    items:
      type: string
      maxLength: 80
    description: >
      Lista atual de fases (DR-COMP-004, INV-COMP-003).
      Explícitas — nunca inferidas de resultados de partidas.
