# ============================================================
# AsyncAPI Payload Schema: ai_ingestion_job_failed
# Module: ai_ingestion
# Domain rules: DR-ING-003, DR-ING-004
# Invariants: INV-ING-002
# ============================================================

type: object
required:
  - eventType
  - occurredAt
  - jobId
  - sourceLabel
  - ingestionMode
  - statusLabel
  - receivedAt
properties:
  eventType:
    type: string
    const: ai_ingestion.job.failed
    description: Tipo do evento. Sempre "ai_ingestion.job.failed".

  occurredAt:
    type: string
    format: date-time
    description: >
      Timestamp UTC do momento da falha.
      DR-ING-003: occurredAt >= receivedAt (INV-ING-002).
    x-semantic-id: core.occurred_at.v1

  jobId:
    type: string
    format: uuid
    description: UUID do job de ingestão que falhou.
    x-semantic-id: ai_ingestion.job.id.v1

  sourceLabel:
    type: string
    minLength: 1
    maxLength: 120
    description: Label da fonte de dados externa.

  ingestionMode:
    type: string
    minLength: 1
    maxLength: 40
    description: "Modo de ingestão (batch, webhook, file-drop)."

  statusLabel:
    type: string
    enum:
      - failed
    description: Status do job no momento do evento. Sempre "failed".

  receivedAt:
    type: string
    format: date-time
    description: >
      Timestamp de entrada do fato externo (DR-ING-003 — preserva causalidade).
    x-semantic-id: core.occurred_at.v1

  errorCode:
    type:
      - string
      - "null"
    maxLength: 80
    description: Código de erro que causou a falha.

  errorMessage:
    type:
      - string
      - "null"
    maxLength: 500
    description: Mensagem descritiva da falha.

  idempotencyKey:
    type:
      - string
      - "null"
    maxLength: 120
    description: >
      Chave de idempotência (DR-ING-004). Presente para permitir retry seguro
      via POST /ingestion/jobs/{jobId}/retry.

additionalProperties: false
