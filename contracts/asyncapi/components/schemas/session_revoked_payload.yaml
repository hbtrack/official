# AsyncAPI Payload Schema: session_revoked
# Module: identity_access
# Domain rules: DR-IAM-001, DR-IAM-004, DR-IAM-005
# Invariants: INV-IAM-001, INV-IAM-004
# Decisions: DEC-IAM-002=B (Redis denylist), DEC-IAM-003=C

type: object
required:
  - eventType
  - occurredAt
  - sessionId
  - principalUserId
  - revokedAt
  - revocationReason
additionalProperties: false
properties:
  eventType:
    type: string
    const: session.revoked
    description: Tipo do evento. Sempre "session.revoked".

  occurredAt:
    type: string
    format: date-time
    description: Timestamp UTC do momento da revogação (ISO 8601).
    x-semantic-id: core.occurred_at.v1

  sessionId:
    type: string
    format: uuid
    description: UUID v4 da sessão revogada (INV-IAM-001).
    x-semantic-id: identity.session.id.v1

  principalUserId:
    type: string
    format: uuid
    description: >
      UUID do usuário proprietário da sessão revogada.
      Referência ao módulo users (DR-IAM-002).
    x-semantic-id: identity.user.id.v1

  revokedAt:
    type: string
    format: date-time
    description: >
      Timestamp UTC do momento em que a sessão foi revogada (DR-IAM-004).
      Coincide com occurredAt quando a revogação é imediata.

  revokedByUserId:
    type:
      - string
      - "null"
    format: uuid
    description: >
      UUID do usuário admin que forçou a revogação administrativa.
      Null quando a revogação é auto-iniciada (logout do próprio usuário).
    x-semantic-id: identity.user.id.v1

  revocationReason:
    type: string
    enum:
      - logout
      - admin_revoked
      - token_expired
      - security_policy
    description: >
      Motivo da revogação (DR-IAM-004, DEC-IAM-002=B).
      logout: o próprio usuário encerrou a sessão.
      admin_revoked: admin forçou encerramento.
      token_expired: TTL do access token expirou.
      security_policy: revogação forçada por política (ex.: mudança de senha, denylist Redis).
