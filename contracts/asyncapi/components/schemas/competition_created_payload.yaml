# AsyncAPI Payload: competition_created
# Domain rules: DR-COMP-001, DR-COMP-002 / INV-COMP-001

type: object
required:
  - eventType
  - occurredAt
  - competitionId
  - seasonId
  - name
  - statusLabel
  - startDate
additionalProperties: false
properties:
  eventType:
    type: string
    const: competition.created
  occurredAt:
    type: string
    format: date-time
    x-semantic-id: core.occurred_at.v1
  competitionId:
    type: string
    format: uuid
    x-semantic-id: competitions.competition.id.v1
  seasonId:
    type: string
    format: uuid
    x-semantic-id: seasons.season.id.v1
    description: Obrigatório — competição sem temporada é inválida (DR-COMP-002).
  organizationId:
    type: [string, "null"]
    format: uuid
    x-semantic-id: organizations.organization.id.v1
  name:
    type: string
    minLength: 1
    maxLength: 140
  formatLabel:
    type: [string, "null"]
    maxLength: 80
  statusLabel:
    type: string
    enum: [draft]
    description: Competições novas sempre iniciam como draft.
  startDate:
    type: string
    format: date
