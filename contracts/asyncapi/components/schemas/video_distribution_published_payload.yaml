# AsyncAPI Payload: video_distribution_published
# Module: video | DR-VID-007, DR-VID-008, DR-VID-009 | ADR-033
type: object
required: [eventType, occurredAt, sessionId, profileName, destinationType, distributedAt]
additionalProperties: false
properties:
  eventType:
    type: string
    const: video.distribution.published
  occurredAt:
    type: string
    format: date-time
    x-semantic-id: core.occurred_at.v1
  sessionId:
    type: string
    format: uuid
    x-semantic-id: video.session.id.v1
  profileName:
    type: string
    maxLength: 80
    description: Nome do DistributionProfile distribuído.
  destinationType:
    type: string
    enum: [technical_internal, cdn_public, partner_api, broadcast]
    description: Tipo de destino da distribuição (DR-VID-007 — escopo por sessão).
  distributedAt:
    type: string
    format: date-time
    description: Timestamp de distribuição para auditoria obrigatória (DR-VID-009).
  retentionPolicy:
    type: string
    enum: [keep_7_days, keep_30_days, archive_s3, public_forever]
    description: Política de retenção aplicada (DR-VID-008).
  accessorUserId:
    type: string
    format: uuid
    description: UUID do usuário ou sistema que solicitou a distribuição (DR-VID-009).
