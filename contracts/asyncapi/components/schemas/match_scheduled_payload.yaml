# AsyncAPI Payload: match_scheduled
# Domain rules: DR-MATCH-001, DR-MATCH-002, DR-MATCH-004 / INV-MATCH-001..002

type: object
required:
  - eventType
  - occurredAt
  - matchId
  - competitionId
  - homeTeamId
  - awayTeamId
  - statusLabel
  - scheduledAt
additionalProperties: false
properties:
  eventType:
    type: string
    const: match.scheduled
  occurredAt:
    type: string
    format: date-time
    x-semantic-id: core.occurred_at.v1
  matchId:
    type: string
    format: uuid
    x-semantic-id: matches.match.id.v1
  competitionId:
    type: string
    format: uuid
    x-semantic-id: competitions.competition.id.v1
    description: Obrigatório — partida sem competição é inválida (DR-MATCH-001).
  homeTeamId:
    type: string
    format: uuid
    x-semantic-id: teams.team.id.v1
    description: Equipe mandante (DR-MATCH-002). Sempre != awayTeamId.
  awayTeamId:
    type: string
    format: uuid
    x-semantic-id: teams.team.id.v1
    description: Equipe visitante (DR-MATCH-002). Sempre != homeTeamId.
  venueLabel:
    type: [string, "null"]
    maxLength: 200
  statusLabel:
    type: string
    enum: [scheduled]
    description: Partidas novas sempre iniciam como scheduled (DEC-MATCHES-002).
  scheduledAt:
    type: string
    format: date-time
    x-semantic-id: core.occurred_at.v1
    description: Data e hora agendada (DR-MATCH-004, INV-MATCH-001).
