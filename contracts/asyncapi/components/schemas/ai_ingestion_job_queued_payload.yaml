# ============================================================
# AsyncAPI Payload Schema: ai_ingestion_job_queued
# Module: ai_ingestion
# Domain rules: DR-ING-001, DR-ING-004
# Invariants: INV-ING-001
# ============================================================

type: object
required:
  - eventType
  - occurredAt
  - jobId
  - sourceLabel
  - ingestionMode
  - statusLabel
properties:
  eventType:
    type: string
    const: ai_ingestion.job.queued
    description: Tipo do evento. Sempre "ai_ingestion.job.queued".

  occurredAt:
    type: string
    format: date-time
    description: "Timestamp UTC do momento em que o job foi enfileirado (ISO 8601)."
    x-semantic-id: core.occurred_at.v1

  jobId:
    type: string
    format: uuid
    description: UUID do job de ingestão enfileirado (DR-ING-001).
    x-semantic-id: ai_ingestion.job.id.v1

  sourceLabel:
    type: string
    minLength: 1
    maxLength: 120
    description: Label da fonte de dados externa (INV-ING-001).

  ingestionMode:
    type: string
    minLength: 1
    maxLength: 40
    description: "Modo de ingestão (batch, webhook, file-drop)."

  statusLabel:
    type: string
    enum:
      - queued
    description: Status do job no momento do evento. Sempre "queued".

  idempotencyKey:
    type:
      - string
      - "null"
    maxLength: 120
    description: >
      Chave de idempotência do job (DR-ING-004).
      Presente quando o job deve suportar replay seguro.

additionalProperties: false
