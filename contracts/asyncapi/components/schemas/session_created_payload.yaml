# AsyncAPI Payload Schema: session_created
# Module: identity_access
# Domain rules: DR-IAM-001, DR-IAM-003, DR-IAM-004
# Invariants: INV-IAM-001, INV-IAM-002, INV-IAM-004
# Decisions: DEC-IAM-001=B (MFA opt-in), DEC-IAM-003=C

type: object
required:
  - eventType
  - occurredAt
  - sessionId
  - principalUserId
  - sessionScopeLabel
  - authMethodLabel
  - roleLabels
additionalProperties: false
properties:
  eventType:
    type: string
    const: session.created
    description: Tipo do evento. Sempre "session.created".

  occurredAt:
    type: string
    format: date-time
    description: Timestamp UTC do momento em que a sessão foi criada (ISO 8601).
    x-semantic-id: core.occurred_at.v1

  sessionId:
    type: string
    format: uuid
    description: UUID v4 da sessão criada (INV-IAM-001). Imutável após criação.
    x-semantic-id: identity.session.id.v1

  principalUserId:
    type: string
    format: uuid
    description: >
      UUID do usuário que iniciou a sessão. Referência ao módulo users.
      identity_access não duplica o perfil (DR-IAM-002).
    x-semantic-id: identity.user.id.v1

  sessionScopeLabel:
    type: string
    minLength: 1
    maxLength: 80
    description: >
      Contexto técnico da sessão (ex: "web-admin", "mobile-athlete").
      Não pode ser deduzido de atributos esportivos (DR-IAM-003).

  authMethodLabel:
    type: string
    maxLength: 40
    description: >
      Método de autenticação utilizado (ex: "jwt-bearer", "oauth2-pkce").

  roleLabels:
    type: array
    uniqueItems: true
    description: >
      Roles RBAC canônicos do usuário no momento da criação da sessão (INV-IAM-002).
      ADR-008: modelo flat de 5 roles.
    items:
      type: string
      enum:
        - admin
        - coordinator
        - coach
        - athlete
        - member

  mfaSatisfied:
    type: boolean
    description: >
      Indica se MFA foi satisfeito nesta sessão (DEC-IAM-001=B opt-in).
      true quando o usuário completou TOTP; false ou ausente quando MFA não configurado.

  expiresAt:
    type: string
    format: date-time
    description: >
      Timestamp UTC de expiração do access token emitido (ADR-007).
