# AsyncAPI Payload Schema: role_revoked
# Module: identity_access
# Domain rules: DR-IAM-001, DR-IAM-003, DR-IAM-005
# Invariants: INV-IAM-002
# Decisions: DEC-IAM-003=C
# ADR refs: ADR-008 (RBAC flat 5 roles)

type: object
required:
  - eventType
  - occurredAt
  - targetUserId
  - roleLabel
  - revokedByUserId
additionalProperties: false
properties:
  eventType:
    type: string
    const: role.revoked
    description: Tipo do evento. Sempre "role.revoked".

  occurredAt:
    type: string
    format: date-time
    description: Timestamp UTC do momento em que o role foi removido (ISO 8601).
    x-semantic-id: core.occurred_at.v1

  targetUserId:
    type: string
    format: uuid
    description: >
      UUID do usuário que teve o role removido. Referência ao módulo users (DR-IAM-002).
    x-semantic-id: identity.user.id.v1

  roleLabel:
    type: string
    enum:
      - admin
      - coordinator
      - coach
      - athlete
      - member
    description: >
      Role RBAC canônico que foi removido (INV-IAM-002, ADR-008).
      identity_access é o único soberano desta operação (DR-IAM-005).

  revokedByUserId:
    type: string
    format: uuid
    description: >
      UUID do usuário admin que removeu o role. Obrigatório para rastreabilidade
      de compliance (DEC-IAM-003=C).
    x-semantic-id: identity.user.id.v1

  revocationReason:
    type: string
    maxLength: 200
    description: >
      Justificativa opcional da remoção do role (ex: "saída do clube", "rebaixamento de permissão").
      Informativo — não altera o contrato técnico do binding revogado.

  organizationId:
    type:
      - string
      - "null"
    format: uuid
    description: >
      UUID da organização no contexto da qual o role foi revogado.
      Null quando o role revogado era global (ex: admin).
    x-semantic-id: organizations.organization.id.v1
