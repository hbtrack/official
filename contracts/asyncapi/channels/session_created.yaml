address: session.created
title: Sessão Criada
description: >
  Canal de publicação quando uma nova sessão autenticada é criada no sistema.
  Soberano de authn/authz (DR-IAM-001). identity_access é a única fonte que
  publica neste canal. Consumidores típicos: audit, notifications.
  NUNCA expõe hash de senha, refresh token ou credenciais armazenadas (INV-IAM-004).
messages:
