address: session.revoked
title: Sessão Revogada
description: >
  Canal de publicação quando uma sessão autenticada é revogada (logout, expiração
  forçada por admin, ou invalidação via Redis denylist — DEC-IAM-002).
  Consumidores: audit (compliance), notifications (alerta de sessão encerrada).
  revokedAt sempre presente no payload (DR-IAM-004).
messages:
