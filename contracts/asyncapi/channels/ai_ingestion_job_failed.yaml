address: ai_ingestion.job.failed
title: Job de Ingestão Falhou
description: >
  Canal de publicação de falhas em jobs de ingestão de dados externos.

  DR-ING-004: idempotencyKey incluído no payload para permitir retry seguro
  via POST /ingestion/jobs/{jobId}/retry.
  DR-ING-003: causalidade temporal preservada (receivedAt → failedAt).

  Publicado sempre que um job transita para statusLabel=failed.
messages:
  ai_ingestion_job_failed_publish:
    $ref: "../messages/ai_ingestion_job_failed.yaml"
