    required_behavior_tests_negative:
      - id: TRAIN-DEC-012-NEG-001
        description: >
          Tentar completar session sem nenhuma execution_record vinculada deve
          retornar 422 (training.error.completion_without_evidence).
        test_type: adversarial
        target_path: "tests/training/test_completion_evidence_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-012-POS-001
        description: >
          Completar session com ao menos uma execution_record vinculada deve
          ser aceito.
        test_type: behavioral
        target_path: "tests/training/test_completion_evidence.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: not_materialized
    blocks_feature_work: true
