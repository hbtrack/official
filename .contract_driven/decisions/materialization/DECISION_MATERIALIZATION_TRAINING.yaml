  - decision_id: TRAIN-DEC-012
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-012"

    decision_ir_refs:
      entities:
        - "training.training_session"
        - "training.execution_record"
      relations:
        - "source_entity_ref: training.execution_record → target_entity_ref: training.training_session"
      state_models:
