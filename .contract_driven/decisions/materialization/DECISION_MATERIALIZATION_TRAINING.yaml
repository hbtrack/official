# -------------------------------------------------------------------------
# DECISION_MATERIALIZATION_TRAINING.yaml
# Matriz operacional derivada — Decision Materialization do módulo training.
#
# ARTEFATO DERIVADO — NÃO É SSOT SEMÂNTICA.
# Fonte semântica soberana: .contract_driven/decisions/DECISION_IR_TRAINING.yaml
# ADRs canônicas: docs/_canon/decisions/ADR-032-training-arch-decisions.md
# Política canônica: docs/_canon/DECISION_MATERIALIZATION_POLICY.md
#
# Status PR 1 (BOOTSTRAP): classificações iniciais conservadoras.
# Nenhuma decisão está marcada como `materialized` neste PR.
# PR 3 (TRAINING_DECISION_MATERIALIZATION_BACKFILL) completará a classificação.
# -------------------------------------------------------------------------
module: training
source_decision_ir: ".contract_driven/decisions/DECISION_IR_TRAINING.yaml"
source_adr:
  - "docs/_canon/decisions/ADR-032-training-arch-decisions.md"

freshness:
  main_ref: null
  generated_at_utc: null
  report_ref: "_reports/decision_materialization/training.json"

decisions:
  # ---------------------------------------------------------------------------
  # TRAIN-DEC-001 — training_intervention_cycle soberano
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-001
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-001"

    decision_ir_refs:
      entities:
        - "training_session"
        - "intervention_cycle"
      relations: []
      state_models:
        - "STATE_MODEL_TRAINING.md"

    runtime_obligations:
      - id: TRAIN-DEC-001-RUNTIME-001
        statement: >
          O módulo training deve representar o ciclo completo de intervenção
          (need → objective → prescription → session → execution → response →
          review → adjustment) como unidade operacional soberana, não apenas
          CRUD de sessão.
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "src/training/application/"

    required_runtime_artifacts:
      - "src/training/domain/entities/training_session.py"
      - "src/training/domain/entities/intervention_cycle.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-001-NEG-001
        description: >
          Criar training_session sem objective vinculado deve retornar erro de
          validação (session CRUD sem propósito deve ser bloqueada).
        test_type: adversarial
        target_path: "tests/training/test_intervention_cycle_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-001-POS-001
        description: >
          Criar training_session com need + objective + prescrição deve resultar
          em intervenção válida com lifecycle completo auditável.
        test_type: behavioral
        target_path: "tests/training/test_intervention_cycle.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: not_materialized
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-004 — Sessão exige objetivo
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-004
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-004"

    decision_ir_refs:
      entities:
        - "training_session"
        - "objective"
      relations:
        - "session → objective (required)"
      state_models: []

    runtime_obligations:
      - id: TRAIN-DEC-004-RUNTIME-001
        statement: >
          Toda training_session publicada deve ter ao menos um objetivo
          vinculado com need ou rationale. Sessão sem objetivo não pode ser
          publicada.
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "contracts/schemas/training/training_session.schema.json"

    required_runtime_artifacts:
      - "contracts/schemas/training/training_session.schema.json"
      - "src/training/domain/rules/session_objective_rule.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-004-NEG-001
        description: >
          Tentativa de publicar session sem objetivo deve retornar 422.
        test_type: adversarial
        target_path: "tests/training/test_session_objective_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-004-POS-001
        description: >
          Publicar session com objetivo vinculado a need deve ser aceito.
        test_type: behavioral
        target_path: "tests/training/test_session_objective.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: partially_materialized
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-006 — published exige conteúdo mínimo
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-006
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-006"

    decision_ir_refs:
      entities:
        - "training_session"
      relations: []
      state_models:
        - "STATE_MODEL_TRAINING.md"

    runtime_obligations:
      - id: TRAIN-DEC-006-RUNTIME-001
        statement: >
          Uma session no estado `published` deve conter ao menos um bloco com
          ao menos um exercício. Transição de draft→published sem conteúdo
          mínimo deve ser bloqueada.
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "contracts/schemas/training/training_session.schema.json"

    required_runtime_artifacts:
      - "contracts/schemas/training/training_session.schema.json"
      - "src/training/domain/rules/session_publish_rule.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-006-NEG-001
        description: >
          Publicar session sem nenhum bloco/exercício deve retornar 422.
        test_type: adversarial
        target_path: "tests/training/test_session_publish_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-006-POS-001
        description: >
          Publicar session com bloco e exercício deve ser aceito e gerar
          estado published persistido.
        test_type: behavioral
        target_path: "tests/training/test_session_publish.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: partially_materialized
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-007 — execution_record exige contexto de prescrição/bloco/improviso
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-007
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-007"

    decision_ir_refs:
      entities:
        - "execution_record"
        - "training_session"
      relations:
        - "execution_record → session_block (required context)"
      state_models:
        - "STATE_MODEL_TRAINING.md"

    runtime_obligations:
      - id: TRAIN-DEC-007-RUNTIME-001
        statement: >
          Cada execution_record deve ter contexto explícito de prescrição,
          bloco ou improviso. Não é permitido criar execution_record sem
          rastreabilidade ao plano original.
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "contracts/schemas/training/"

    required_runtime_artifacts:
      - "contracts/schemas/training/execution_record.schema.json"
      - "src/training/domain/rules/execution_context_rule.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-007-NEG-001
        description: >
          Criar execution_record sem contexto de prescrição/bloco/improviso
          deve ser rejeitado.
        test_type: adversarial
        target_path: "tests/training/test_execution_record_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-007-POS-001
        description: >
          Criar execution_record com contexto de bloco vinculado à sessão
          deve ser aceito.
        test_type: behavioral
        target_path: "tests/training/test_execution_record.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: partially_materialized
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-008 — planned vs actual preservado
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-008
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-008"

    decision_ir_refs:
      entities:
        - "training_session"
        - "session_block"
        - "execution_record"
      relations:
        - "execution_record → planned_state (immutable reference)"
      state_models:
        - "STATE_MODEL_TRAINING.md"

    runtime_obligations:
      - id: TRAIN-DEC-008-RUNTIME-001
        statement: >
          O estado planejado (planned) de uma session deve ser preservado
          imutável após publicação. Divergências durante execução são
          registradas em execution_record sem alterar o planned original.
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "contracts/schemas/training/"

    required_runtime_artifacts:
      - "contracts/schemas/training/training_session.schema.json"
      - "src/training/domain/rules/planned_immutability_rule.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-008-NEG-001
        description: >
          Tentativa de alterar o plano original de uma session já em execução
          deve ser bloqueada.
        test_type: adversarial
        target_path: "tests/training/test_planned_immutability_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-008-POS-001
        description: >
          Registrar divergência de execução sem alterar o planned deve ser
          aceito e preservar ambas as versões.
        test_type: behavioral
        target_path: "tests/training/test_planned_vs_actual.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: partially_materialized
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-012 — restrição crítica bloqueia ou exige override auditado
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-012
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-012"

    decision_ir_refs:
      entities:
        - "training_session"
        - "athlete_restriction"
      relations:
        - "session_assignment → athlete_restriction (guard check required)"
      state_models: []

    runtime_obligations:
      - id: TRAIN-DEC-012-RUNTIME-001
        statement: >
          Qualquer prescrição ou atribuição de carga que envolva atleta com
          restrição crítica ativa deve ser bloqueada automaticamente ou exigir
          override explícito auditado por profissional autorizado.
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "src/training/application/"

    required_runtime_artifacts:
      - "src/training/domain/rules/restriction_guard.py"
      - "contracts/schemas/training/training_session.schema.json"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-012-NEG-001
        description: >
          Prescrever carga a atleta com restrição crítica ativa sem override
          auditado deve ser bloqueada com erro explícito.
        test_type: adversarial
        target_path: "tests/training/test_restriction_guard_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-012-POS-001
        description: >
          Override com autorização documentada deve ser aceito e registrado
          no audit trail.
        test_type: behavioral
        target_path: "tests/training/test_restriction_override.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: partially_materialized
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-020 — conflito canônico com ADR-017
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-020
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-020"

    decision_ir_refs:
      entities: []
      relations:
        - "training → audit (conflict with ADR-017 transversal module boundary)"
      state_models: []

    runtime_obligations:
      - id: TRAIN-DEC-020-RUNTIME-001
        statement: >
          Resolução do conflito canônico entre TRAIN-DEC-020 e ADR-017 é
          pré-requisito para qualquer implementação de audit trail no módulo
          training. Nenhuma implementação parcial de audit é permitida até o
          conflito ser resolvido via processo ADR.
        required: true
        expected_runtime_locations: []

    required_runtime_artifacts: []

    required_behavior_tests_negative: []

    required_behavior_tests_positive: []

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: blocked_by_contract_conflict
    blocks_feature_work: true
    waiver: null
    conflict_note: >
      TRAIN-DEC-020 entra em conflito com ADR-017 (módulo transversal de audit).
      blocked_by_contract_conflict bloqueia feature work que tente implementar
      audit diretamente em training. Não bloqueia PR cujo único objetivo seja
      resolver o conflito canônico via processo ADR formal.

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-047 — exercise_id + exercise_version_id (boundary exercises/training)
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-047
    decision_policy_criticality: obrigatoria
    execution_priority: P1
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-047"
    note: >
      TRAIN-DEC-047 está em ADR-032 e em DECISION_IR_EXERCISES.yaml mas não
      no DECISION_IR_TRAINING.yaml. Isso indica gap de rastreabilidade na Decision
      IR soberana de training. A ser avaliado em PR 3.

    decision_ir_refs:
      entities: []
      relations:
        - "training:session_exercise → exercises:exercise_id + exercise_version_id (boundary)"
      state_models: []

    runtime_obligations:
      - id: TRAIN-DEC-047-RUNTIME-001
        statement: >
          O módulo training deve referenciar exercícios exclusivamente via
          exercise_id + exercise_version_id. Training não pode armazenar atributos
          de exercício fora desses dois campos.
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "contracts/schemas/training/"

    required_runtime_artifacts:
      - "contracts/schemas/training/session_exercise.schema.json"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-047-NEG-001
        description: >
          Criar session_exercise com atributos de exercício embarcados (nome,
          descrição, intensidade) em vez de exercise_id + exercise_version_id
          deve ser rejeitado.
        test_type: adversarial
        target_path: "tests/training/test_exercise_boundary_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-047-POS-001
        description: >
          Criar session_exercise com exercise_id + exercise_version_id válidos
          deve ser aceito sem exigir atributos do exercício.
        test_type: behavioral
        target_path: "tests/training/test_exercise_boundary.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: not_materialized
    blocks_feature_work: true
    waiver: null
