  # ---------------------------------------------------------------------------
  # TRAIN-DEC-020 — audit via módulo transversal (conflito canônico com ADR-017)
  # IR soberana: rule training.rule.audit_via_transversal_module (RUL-TRAINING-040),
  #   event training.event.audit_event_emitted (EVT-TRAINING-022),
  #   integration training (INT-TRAINING-005, decision_refs: TRAIN-DEC-016, TRAIN-DEC-020)
  # Conflito: training.rule.audit_via_transversal_module direciona audit para
  #   módulo transversal; ADR-017 define fronteiras do módulo audit soberano.
  #   A resolução deste conflito requer PR formal de ADR, não é resolvível no PR 1.
  # blocked_by_contract_conflict bloqueia feature work que tente implementar
  #   audit diretamente em training. Não bloqueia PR cujo único objetivo seja
  #   resolver o conflito canônico via processo ADR.
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-020
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-020"

    decision_ir_refs:
      entities:
        - "training.training_session"
      relations:
        - "integration: training → audit (INT-TRAINING-005, type: event_emission)"
      state_models: []

    runtime_obligations:
      - id: TRAIN-DEC-020-RUNTIME-001
        statement: >
          Resolução do conflito canônico entre TRAIN-DEC-020 e ADR-017 é
          pré-requisito. Nenhuma implementação parcial de audit direta em
          training é permitida até o conflito ser resolvido via ADR formal.
          (training.rule.audit_via_transversal_module: RUL-TRAINING-040)
        required: true
        expected_runtime_locations: []

    required_runtime_artifacts: []

    required_behavior_tests_negative: []

    required_behavior_tests_positive: []

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: blocked_by_contract_conflict
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-047 — exercise_id + exercise_version_id (boundary exercises/training)
  # Gap de rastreabilidade fechado no IR soberano de training em 2026-05-03.
  # A decisão agora aparece em capability, entidade session_block e surface_mapping
  # do DECISION_IR_TRAINING.yaml, com runtime já presente em schema, entidade e teste.
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-047
    decision_policy_criticality: obrigatoria
    execution_priority: P1
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-047"

    decision_ir_refs:
      entities:
        - "training.session_block"
      relations: []
      state_models: []

    runtime_obligations:
      - id: TRAIN-DEC-047-RUNTIME-001
        statement: >
          O módulo training deve referenciar exercícios exclusivamente via
          exercise_id + exercise_version_id. Training não pode armazenar atributos
          de exercício fora desses dois campos de referência.
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "contracts/schemas/training/"

    required_runtime_artifacts:
      - "contracts/schemas/training/session_block.schema.json"
      - "src/training/domain/entities/blocks.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-047-NEG-001
        description: >
          Criar session_block com exerciseId sem exerciseVersionId deve ser rejeitado.
        test_type: adversarial
        target_path: "src/training/tests/unit/test_session_blocks.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-047-POS-001
        description: >
          Criar session_block com exerciseId + exerciseVersionId válidos
          deve ser aceito sem exigir atributos do exercício.
        test_type: behavioral
        target_path: "src/training/tests/unit/test_session_blocks.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: materialized
    evidence_refs:
      - "contracts/schemas/training/session_block.schema.json"
      - "src/training/domain/entities/blocks.py"
      - "src/training/tests/unit/test_session_blocks.py"
      - "migrations/training/versions/20260317_001_create_training_tables.py"
    blocks_feature_work: true
    waiver: null
