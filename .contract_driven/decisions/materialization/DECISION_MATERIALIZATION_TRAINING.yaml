module: training
source_decision_ir: ".contract_driven/decisions/DECISION_IR_TRAINING.yaml"
source_adr:
  - "docs/_canon/decisions/ADR-032-training-arch-decisions.md"

freshness:
  main_ref: null
  generated_at_utc: null
  report_ref: "_reports/decision_materialization/training.json"

decisions:
  # ---------------------------------------------------------------------------
  # TRAIN-DEC-001 — training_intervention_cycle como unidade soberana
  # IR soberana: entities training.training_intervention_cycle (line ~267),
  #   state model STM-TRAINING-002 (entity_ref: training.training_intervention_cycle),
  #   surface_mapping decision_ref: TRAIN-DEC-001 (lines 2000–2006)
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-001
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-001"

    decision_ir_refs:
      entities:
        - "training.training_intervention_cycle"
        - "training.training_session"
      relations:
        - "source_entity_ref: training.training_session → target_entity_ref: training.training_intervention_cycle"
      state_models:
        - "STM-TRAINING-002"

    runtime_obligations:
      - id: TRAIN-DEC-001-RUNTIME-001
        statement: >
          O módulo training deve representar o ciclo completo de intervenção
          (need → objective → prescription → session → execution → response →
          review → adjustment) como unidade operacional soberana, não apenas
          CRUD de sessão.
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "src/training/application/"

    required_runtime_artifacts:
      - "src/training/domain/entities/training_session.py"
      - "src/training/domain/entities/training_intervention_cycle.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-001-NEG-001
        description: >
          Criar training_session sem objetivo ou ciclo de intervenção vinculado
          deve ser bloqueado pelo domínio.
        test_type: adversarial
        target_path: "tests/training/test_intervention_cycle_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-001-POS-001
        description: >
          Criar training_session com need + objective + prescrição deve resultar
          em intervenção válida com lifecycle completo rastreável.
        test_type: behavioral
        target_path: "tests/training/test_intervention_cycle.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: not_materialized
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-004 — objective requires linked need or rationale
  # IR soberana: entity training.session_objective (line ~377),
  #   rule training.rule.session_requires_objective (RUL-TRAINING-001),
  #   events EVT-TRAINING-004, EVT-TRAINING-005,
  #   api_use_case decision_ref: TRAIN-DEC-004 (lines ~1676, 1685),
  #   surface_mapping decision_ref: TRAIN-DEC-004 (lines 2036–2045)
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-004
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-004"

    decision_ir_refs:
      entities:
        - "training.training_session"
        - "training.session_objective"
      relations:
        - "source_entity_ref: training.session_objective → target_entity_ref: training.need_detected"
      state_models: []

    runtime_obligations:
      - id: TRAIN-DEC-004-RUNTIME-001
        statement: >
          Toda training_session publicada deve ter ao menos um objetivo vinculado
          com need ou rationale. Sessão sem objetivo não pode ser publicada.
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "contracts/schemas/training/training_session.schema.json"

    required_runtime_artifacts:
      - "contracts/schemas/training/training_session.schema.json"
      - "src/training/domain/rules/session_objective_rule.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-004-NEG-001
        description: >
          Tentativa de publicar session sem objetivo vinculado deve retornar 422.
        test_type: adversarial
        target_path: "tests/training/test_session_objective_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-004-POS-001
        description: >
          Publicar session com objetivo vinculado a need deve ser aceito.
        test_type: behavioral
        target_path: "tests/training/test_session_objective.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: not_materialized
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-006 — published session requires minimum content
  # IR soberana: entity training.training_session (line ~175),
  #   rule training.rule.publication_preconditions_met (RUL-TRAINING-*),
  #   error training.error.session_publish_preconditions_not_met (ERR-TRAINING-001),
  #   event EVT-TRAINING-009, state model STM-TRAINING-001,
  #   api_use_case training.session.publish (line ~1339),
  #   surface_mapping decision_ref: TRAIN-DEC-006 (lines 2067–2076)
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-006
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-006"

    decision_ir_refs:
      entities:
        - "training.training_session"
        - "training.session_block"
      relations: []
      state_models:
        - "STM-TRAINING-001"

    runtime_obligations:
      - id: TRAIN-DEC-006-RUNTIME-001
        statement: >
          Uma session no estado published deve conter ao menos um bloco com
          ao menos um exercício. Transição sem conteúdo mínimo deve ser bloqueada
          com training.error.session_publish_preconditions_not_met (422).
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "contracts/schemas/training/training_session.schema.json"

    required_runtime_artifacts:
      - "contracts/schemas/training/training_session.schema.json"
      - "src/training/domain/rules/session_publish_rule.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-006-NEG-001
        description: >
          Publicar session sem nenhum bloco/exercício deve retornar 422
          (training.error.session_publish_preconditions_not_met).
        test_type: adversarial
        target_path: "tests/training/test_session_publish_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-006-POS-001
        description: >
          Publicar session com bloco e exercício deve ser aceito com estado
          published persistido.
        test_type: behavioral
        target_path: "tests/training/test_session_publish.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: not_materialized
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-007 — execution_record requires prescription context
  # IR soberana: entity training.execution_record (line ~485),
  #   rule training.rule.execution_requires_prescription_context,
  #   error training.error.execution_without_context (ERR-TRAINING-003),
  #   event EVT-TRAINING-012,
  #   api_use_case training.execution.record (line ~1367),
  #   surface_mapping decision_ref: TRAIN-DEC-007 (lines 2081–2090)
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-007
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-007"

    decision_ir_refs:
      entities:
        - "training.execution_record"
        - "training.training_session"
      relations:
        - "source_entity_ref: training.execution_record → target_entity_ref: training.training_session"
      state_models: []

    runtime_obligations:
      - id: TRAIN-DEC-007-RUNTIME-001
        statement: >
          Cada execution_record deve ter contexto explícito de prescrição, bloco
          ou improviso. Criar execution_record sem contexto de session ou block
          deve ser bloqueado com training.error.execution_without_context (422).
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "contracts/schemas/training/"

    required_runtime_artifacts:
      - "contracts/schemas/training/execution_record.schema.json"
      - "src/training/domain/rules/execution_context_rule.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-007-NEG-001
        description: >
          Criar execution_record sem contexto de prescrição/bloco deve retornar
          422 (training.error.execution_without_context).
        test_type: adversarial
        target_path: "tests/training/test_execution_record_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-007-POS-001
        description: >
          Criar execution_record com contexto de bloco vinculado à sessão deve
          ser aceito.
        test_type: behavioral
        target_path: "tests/training/test_execution_record.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: not_materialized
    blocks_feature_work: true
    waiver: null

  # ---------------------------------------------------------------------------
  # TRAIN-DEC-008 — planned vs actual must not merge
  # IR soberana: entity training.training_session (line ~175),
  #   entity training.execution_record (line ~485),
  #   rule training.rule.planned_actual_must_not_merge,
  #   error training.error.invalid_state_transition (ERR-TRAINING-002),
  #   event EVT-TRAINING-013,
  #   state model STM-TRAINING-001,
  #   surface_mapping decision_ref: TRAIN-DEC-008 (lines 2095–2101)
  # ---------------------------------------------------------------------------
  - decision_id: TRAIN-DEC-008
    decision_policy_criticality: obrigatoria
    execution_priority: P0
    canonical_source: "docs/_canon/decisions/ADR-032-training-arch-decisions.md#train-dec-008"

    decision_ir_refs:
      entities:
        - "training.training_session"
        - "training.execution_record"
      relations:
        - "source_entity_ref: training.execution_record → target_entity_ref: training.training_session"
      state_models:
        - "STM-TRAINING-001"

    runtime_obligations:
      - id: TRAIN-DEC-008-RUNTIME-001
        statement: >
          O estado planejado (planned) de uma session deve ser preservado
          imutável após publicação. Divergências durante execução são registradas
          em execution_record sem alterar o planned original
          (training.rule.planned_actual_must_not_merge).
        required: true
        expected_runtime_locations:
          - "src/training/domain/"
          - "contracts/schemas/training/"

    required_runtime_artifacts:
      - "contracts/schemas/training/training_session.schema.json"
      - "src/training/domain/rules/planned_immutability_rule.py"

    required_behavior_tests_negative:
      - id: TRAIN-DEC-008-NEG-001
        description: >
          Tentativa de alterar o plano original de uma session já em execução
          deve ser bloqueada (training.error.invalid_state_transition, 422).
        test_type: adversarial
        target_path: "tests/training/test_planned_immutability_adversarial.py"

    required_behavior_tests_positive:
      - id: TRAIN-DEC-008-POS-001
        description: >
          Registrar divergência de execução via execution_record sem alterar o
          planned deve ser aceito e preservar ambos os estados.
        test_type: behavioral
        target_path: "tests/training/test_planned_vs_actual.py"

    enforcement_gate: DECISION_MATERIALIZATION_GATE
    materialization_status: not_materialized
    blocks_feature_work: true
    waiver: null

