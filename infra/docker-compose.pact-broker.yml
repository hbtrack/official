# ──────────────────────────────────────────────────────────────────────────────
# HB Track — Pact Broker (auto-hospedado, VPS Locaweb)
# Uso:  docker compose -f infra/docker-compose.pact-broker.yml up -d
# Dir:  /opt/hbtrack/pact-broker/ na VPS
# URL:  http://<VPS_IP>:9292  (configurar PACT_BROKER_BASE_URL no CI)
#
# Ref:  docs/_canon/decisions/ADR-025-cdct-pact-strategy.md
# ──────────────────────────────────────────────────────────────────────────────

name: hbtrack-pact-broker

services:

  # ── PostgreSQL dedicado ao Pact Broker ───────────────────────────────────────
  pact-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pact_broker
      POSTGRES_USER: pact_broker
      POSTGRES_PASSWORD: ${PACT_BROKER_DB_PASSWORD}
    volumes:
      - pact_postgres_data:/var/lib/postgresql/data
    networks:
      - pact-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pact_broker -d pact_broker"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Pact Broker ──────────────────────────────────────────────────────────────
  pact-broker:
    image: pactfoundation/pact-broker:latest
    restart: unless-stopped
    ports:
      - "9292:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://pact_broker:${PACT_BROKER_DB_PASSWORD}@pact-postgres/pact_broker
      PACT_BROKER_BASIC_AUTH_USERNAME: ${PACT_BROKER_BASIC_AUTH_USERNAME:-hbtrack}
      PACT_BROKER_BASIC_AUTH_PASSWORD: ${PACT_BROKER_BASIC_AUTH_PASSWORD}
      PACT_BROKER_ALLOW_PUBLIC_READ: "false"
      PACT_BROKER_LOG_LEVEL: INFO
    depends_on:
      pact-postgres:
        condition: service_healthy
    networks:
      - pact-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9292/diagnostic/status/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pact_postgres_data:

networks:
  pact-net:
    driver: bridge
