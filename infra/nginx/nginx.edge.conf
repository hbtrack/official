# ──────────────────────────────────────────────────────────────────────────────
# HB Track — Edge Nginx: proxy único de borda com roteamento por hostname
#
# Hostnames atendidos:
#   handballtrack.app       → produção (api + frontend)
#   www.handballtrack.app   → produção (api + frontend)
#   staging.handballtrack.app → staging (api + frontend)
#
# Upstreams resolvidos via aliases Docker nas redes internas:
#   prod-api, prod-frontend    → hbtrack-prod-net
#   staging-api, staging-frontend → hbtrack-staging-net
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Rate limiting (OWASP API6)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # ── Upstreams de produção ───────────────────────────────────────────────
    upstream prod_api {
        server prod-api:8000;
        keepalive 32;
    }

    upstream prod_frontend {
        server prod-frontend:80;
    }

    # ── Upstreams de staging ────────────────────────────────────────────────
    upstream staging_api {
        server staging-api:8000;
        keepalive 32;
    }

    upstream staging_frontend {
        server staging-frontend:80;
    }

    # ── HTTP: redireciona para HTTPS + ACME challenge ───────────────────────
    server {
        listen 80;
        server_name handballtrack.app www.handballtrack.app staging.handballtrack.app;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS produção: handballtrack.app + www ─────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name handballtrack.app www.handballtrack.app;

        ssl_certificate /etc/letsencrypt/live/handballtrack.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/handballtrack.app/privkey.pem;
        ssl_session_cache shared:SSL_PROD:10m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-XSS-Protection "1; mode=block" always;

        client_max_body_size 20M;

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://prod_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://prod_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://prod_api;
            proxy_set_header Host $host;
            access_log off;
        }

        # WebSocket (Django Channels)
        location /ws/ {
            proxy_pass http://prod_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /static/ {
            proxy_pass http://prod_api;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Frontend SPA
        location / {
            proxy_pass http://prod_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }
    }

    # ── HTTPS staging: staging.handballtrack.app ────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name staging.handballtrack.app;

        ssl_certificate /etc/letsencrypt/live/staging.handballtrack.app/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/staging.handballtrack.app/privkey.pem;
        ssl_session_cache shared:SSL_STAGING:10m;
        ssl_session_timeout 10m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        add_header X-XSS-Protection "1; mode=block" always;
        # Impede indexação de staging por crawlers
        add_header X-Robots-Tag "noindex, nofollow" always;

        client_max_body_size 20M;

        location /api/ {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://staging_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
        }

        location /api/auth/ {
            limit_req zone=auth_limit burst=5 nodelay;
            proxy_pass http://staging_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://staging_api;
            proxy_set_header Host $host;
            access_log off;
        }

        # WebSocket (Django Channels)
        location /ws/ {
            proxy_pass http://staging_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        location /static/ {
            proxy_pass http://staging_api;
            proxy_set_header Host $host;
            expires 1h;
            add_header Cache-Control "public";
        }

        # Frontend SPA
        location / {
            proxy_pass http://staging_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }
    }
}
