# ──────────────────────────────────────────────────────────────────────────────
# HB Track — Edge Nginx Bootstrap (sem SSL)
#
# Usado APENAS na fase inicial do primeiro deploy, antes de os certificados
# Let's Encrypt existirem. Permite que o certbot --standalone obtenha os
# certificados via HTTP. Após emissão dos certs, substituir por nginx.edge.conf.
#
# Serve ACME challenge em HTTP puro para todos os hostnames.
# ──────────────────────────────────────────────────────────────────────────────

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr [$time_local] "$request" $status';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80 default_server;
        server_name handballtrack.app www.handballtrack.app staging.handballtrack.app _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /health {
            return 200 "edge-bootstrap-ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 503 "Bootstrap em progresso. Aguarde...\n";
            add_header Content-Type text/plain;
        }
    }
}
