# ──────────────────────────────────────────────────────────────────────────────
# HB Track — Docker Compose de PRODUÇÃO
#
# Responsabilidade: somente serviços de aplicação (api, frontend, db, cache, workers)
# NÃO expõe portas 80/443 publicamente — o proxy de borda (docker-compose.edge.yml)
# é o único a publicar portas públicas e terminar TLS.
#
# Rede: hbtrack-prod-net (acessada pelo edge via external network)
# Aliases de rede: prod-api, prod-frontend (usados pelo nginx.edge.conf)
#
# Uso: docker compose -f infra/docker-compose.prod.yml up -d
# Requer: arquivo .env no mesmo diretório (ver infra/env/.env.production.template)
# ──────────────────────────────────────────────────────────────────────────────

name: ${COMPOSE_PROJECT_NAME:-hbtrack-prod}

services:

  # ── API: Django Ninja + Gunicorn + UvicornWorker (HTTP + WebSocket) ──────────

  # ── Frontend: React/Vite ─────────────────────────────────────────────────────
  frontend:
    image: ${REGISTRY:-ghcr.io/hbtrack}/hbtrack-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      hbtrack-prod-net:
        aliases:
          - prod-frontend
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  # ── API: Django Ninja + Gunicorn + UvicornWorker (HTTP + WebSocket) ──────────
  api:
    image: ${REGISTRY:-ghcr.io/hbtrack}/hbtrack-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      hbtrack-prod-net:
        aliases:
          - prod-api
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    entrypoint:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput &&
        exec gunicorn config.asgi:application
        --bind 0.0.0.0:8000
        --worker-class uvicorn.workers.UvicornWorker
        --workers 2
        --timeout 120
        --graceful-timeout 30
        --access-logfile -
        --error-logfile -

  # ── Celery Worker: processamento assíncrono de tarefas ───────────────────────
  celery_worker:
    image: ${REGISTRY:-ghcr.io/hbtrack}/hbtrack-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hbtrack-prod-net
    entrypoint: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]

  # ── Celery Beat: scheduler de tarefas periódicas ─────────────────────────────
  celery_beat:
    image: ${REGISTRY:-ghcr.io/hbtrack}/hbtrack-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: ../.env
    environment:
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hbtrack-prod-net
    entrypoint: ["celery", "-A", "config", "beat", "--loglevel=info", "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]

  # ── PostgreSQL 16 ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hbtrack}
      - POSTGRES_USER=${POSTGRES_USER:-hbtrack}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hbtrack-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hbtrack} -d ${POSTGRES_DB:-hbtrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - hbtrack-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5


volumes:
  postgres_data:
  redis_data:

networks:
  hbtrack-prod-net:
    name: hbtrack-prod-net
    driver: bridge
