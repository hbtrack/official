name: Domain Completeness Audit

on:
  schedule:
    # Executar toda segunda-feira às 09:00 UTC (6:00 AM BRT)
    - cron: "0 9 * * MON"

  workflow_dispatch:
    inputs:
      module:
        description: "Módulo específico para auditar (deixar em branco para todos)"
        required: false
        default: ""
      verbose:
        description: "Modo verbose"
        required: false
        type: boolean
        default: false

jobs:
  domain_completeness_audit:
    name: Domain Completeness Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Run domain completeness audit (all modules)
        if: ${{ !github.event.inputs.module }}
        id: audit_all
        run: |
          python scripts/audit/run_all_modules_audit.py > audit_output.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat audit_output.txt

      - name: Run domain completeness audit (specific module)
        if: ${{ github.event.inputs.module }}
        id: audit_specific
        run: |
          python -c "
          from pathlib import Path
          from scripts.audit.run_domain_completeness import DomainCompletenessAuditor

          module = '${{ github.event.inputs.module }}'
          auditor = DomainCompletenessAuditor(Path.cwd(), module=module)
          passed = auditor.run()
          print(auditor.generate_report())
          exit(0 if passed else 1)
          " > audit_output.txt 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat audit_output.txt

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: domain-completeness-audit-reports
          path: |
            _reports/DOMAIN_COMPLETENESS_*.md
            _reports/DOMAIN_COMPLETENESS_*.json
          retention-days: 90

      - name: Comment on PR with results (if running on PR)
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('audit_output.txt', 'utf8');

            // Extrair sumário do relatório
            const summaryMatch = output.match(/✓ PASS: (\d+)\/(\d+)/);
            const failMatch = output.match(/✗ FAIL: (\d+)\/(\d+)/);

            let comment = '## 🔍 Domain Completeness Audit Results\n\n';

            if (summaryMatch) {
              const [, passed, total] = summaryMatch;
              comment += `**Status**: ✅ All ${total} modules passed!\n\n`;
            } else if (failMatch) {
              const [, failed, total] = failMatch;
              comment += `**Status**: ⚠️ ${failed}/${total} modules failed\n\n`;
            }

            comment += '### Audit Report\n```\n';
            comment += output.split('\n').slice(0, 50).join('\n');
            comment += '\n```\n';
            comment += '\n_Full reports available in artifacts._\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Check audit results
        if: always()
        run: |
          if grep -q "✓ PASS: 17/17" audit_output.txt; then
            echo "✅ All modules passed!"
            exit 0
          else
            echo "❌ Some modules failed. Check audit reports."
            exit 1
          fi

  publish_audit_metrics:
    name: Publish Audit Metrics
    runs-on: ubuntu-latest
    needs: domain_completeness_audit
    if: always()

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download audit reports
        uses: actions/download-artifact@v3
        with:
          name: domain-completeness-audit-reports
          path: _reports

      - name: Create metrics summary
        run: |
          echo "## Domain Completeness Metrics" > metrics_summary.md
          echo "" >> metrics_summary.md
          echo "**Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> metrics_summary.md
          echo "" >> metrics_summary.md

          # Buscar último arquivo JSON de audit
          latest_json=$(ls -t _reports/DOMAIN_COMPLETENESS_ALL_MODULES_*.json 2>/dev/null | head -1)
          if [ -n "$latest_json" ]; then
            echo "📊 Latest audit data: $latest_json" >> metrics_summary.md
          fi

      - name: Archive metrics
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: audit-metrics
          path: metrics_summary.md
          retention-days: 365
