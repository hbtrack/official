name: Contract Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

# ---------------------------------------------------------------------------
# Path filters: jobs de governança só rodam em mudanças nos paths relevantes.
# Isso evita custo extra em PRs que não tocam governança.
# ---------------------------------------------------------------------------

jobs:
  # ── Detectar se há mudança em paths de governança (usado pelos jobs abaixo) ──
  detect-governance-change:
    name: Detectar mudança em governança
    runs-on: ubuntu-latest
    outputs:
      governance_changed: ${{ steps.filter.outputs.governance }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            governance:
              - '.contract_driven/**'
              - 'docs/_canon/**'
              - '.github/copilot-instructions.md'
              - '.github/skills/**'
              - 'scripts/contracts/validate/**'
              - 'scripts/hb'
              - 'contracts/schemas/shared/**'

  validate-contracts:
    name: Validate Contract Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r scripts/_policy/requirements.txt
          pip install schemathesis==4.12.1

      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.12.3/oasdiff_1.12.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/oasdiff.tar.gz"
          mkdir -p "$RUNNER_TEMP/oasdiff-extract"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff-extract"
          install -m 0755 "$(find "$RUNNER_TEMP/oasdiff-extract" -type f -name oasdiff | head -n1)" "$RUNNER_TEMP/oasdiff"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci

      - name: Validate contracts
        run: python3 scripts/validate_contracts.py
        env:
          CI: "true"

      - name: Upload contract gates report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-gates-report
          path: _reports/contract_gates/
          retention-days: 30
          if-no-files-found: warn

      - name: Check for contract gate failures
        if: failure()
        run: |
          echo "::error::Contract validation failed. Check the uploaded artifact for details."
          exit 1

  governance-tests:
    name: Governance Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/_policy/requirements.txt pytest
      - run: pytest tests/test_pipeline_governance.py -v

  architecture-drift-check:
    name: Architecture Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/_policy/requirements.txt pytest

      - name: Run architecture drift checker
        run: python3 scripts/audit/check_architecture_docs.py --json

      - name: Run architecture drift regression tests
        run: pytest tests/pipeline_gates/test_architecture_drift.py -v

  # ── Governance Enforcement: só roda em mudanças de GOVERNANCE_PATHS ───────
  governance-enforcement:
    name: Governance Enforcement (survival-suite)
    runs-on: ubuntu-latest
    needs: detect-governance-change
    if: needs.detect-governance-change.outputs.governance_changed == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r scripts/_policy/requirements.txt pytest

      - name: Run survival-suite (obrigatório em mudanças de governança)
        run: python3 scripts/hb survival-suite
        env:
          CI: "true"

  # ── Paridade registry x executor ─────────────────────────────────────────
  registry-executor-parity:
    name: Paridade Registry × Executor
    runs-on: ubuntu-latest
    needs: detect-governance-change
    if: needs.detect-governance-change.outputs.governance_changed == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/_policy/requirements.txt pytest

      - name: Teste de paridade registry × executor
        run: python -m pytest tests/pipeline_gates/test_gate_registry_parity.py -v

  # ── Paridade schema × template × skills ──────────────────────────────────
  schema-template-skills-parity:
    name: Paridade Schema × Template × Skills
    runs-on: ubuntu-latest
    needs: detect-governance-change
    if: needs.detect-governance-change.outputs.governance_changed == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/_policy/requirements.txt pytest

      - name: Teste de paridade schema/template/skills (FASE 4)
        run: python -m pytest tests/pipeline_gates/test_schema_template_parity_phase4.py -v

  # ── Validação cruzada SESSION_HANDOFF ↔ session_start ────────────────────
  session-handoff-crossval:
    name: Validação Cruzada SESSION_HANDOFF ↔ session_start
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: detect-governance-change
    if: needs.detect-governance-change.outputs.governance_changed == 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/_policy/requirements.txt pytest

      - name: Validação cruzada SESSION_HANDOFF ↔ session_start (FASE 3)
        run: python -m pytest tests/pipeline_gates/test_session_state_phase3.py -v
