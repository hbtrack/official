name: Contract Gates

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate-contracts:
    name: Validate Contract Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r scripts/_policy/requirements.txt
          pip install schemathesis==4.12.1

      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.12.3/oasdiff_1.12.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/oasdiff.tar.gz"
          mkdir -p "$RUNNER_TEMP/oasdiff-extract"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff-extract"
          install -m 0755 "$(find "$RUNNER_TEMP/oasdiff-extract" -type f -name oasdiff | head -n1)" "$RUNNER_TEMP/oasdiff"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Node dependencies
        run: npm ci

      - name: Validate contracts
        run: python3 scripts/validate_contracts.py
        env:
          CI: "true"

      - name: Upload contract gates report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-gates-report
          path: _reports/contract_gates/
          retention-days: 30
          if-no-files-found: warn

      - name: Check for contract gate failures
        if: failure()
        run: |
          echo "::error::Contract validation failed. Check the uploaded artifact for details."
          exit 1

  governance-tests:
    name: Governance Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: pytest tests/test_pipeline_governance.py -v
