# ──────────────────────────────────────────────────────────────────────────────
# HB Track — CI Pipeline (validação de PR e push para main)
# Jobs: validate -> test -> build
# NOTA: O deploy (staging/prod) é coberto por .github/workflows/deploy.yml
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hbtrack-backend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Validar contratos e schemas
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar branch_ativo no SESSION_HANDOFF
        run: |
          CURRENT="${{ github.head_ref || github.ref_name }}"
          if [ -n "$CURRENT" ] && [ -f SESSION_HANDOFF.md ]; then
            sed -i "s|^branch_ativo:.*|branch_ativo: ${CURRENT}|" SESSION_HANDOFF.md
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: pip install -r requirements-dev.txt -r scripts/_policy/requirements.txt

      - name: Run contract validation
        run: python3 scripts/contracts/validate/validate_contracts.py --profile precommit

      - name: Lint OpenAPI specs (Redocly)
        run: |
          npx --yes @redocly/cli@latest lint contracts/ --format=github-actions 2>/dev/null || echo "redocly lint optional"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Testes unitários e de integração
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-22.04
    needs: validate

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hbtrack_test
          POSTGRES_USER: hbtrack
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd "pg_isready -U hbtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-secret-key-for-testing-only-not-real
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://hbtrack:testpassword@localhost:5432/hbtrack_test
      DB_NAME: hbtrack_test
      DB_USER: hbtrack
      DB_PASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests (excluindo schemathesis e pipeline_gates)
        run: pytest -q --ignore=tests/schemathesis --ignore=tests/pipeline_gates --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Build da imagem Docker frontend
  # ────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build + Tests
    runs-on: ubuntu-22.04
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Run unit tests (Vitest)
        run: npx vitest run --reporter=verbose
        working-directory: frontend

      - name: Build production bundle
        run: npm run build
        working-directory: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image (sem push — validação)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: hbtrack-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Build da imagem Docker backend (verifica que o Dockerfile funciona)
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Docker Build Check
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (sem push — apenas validação)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
