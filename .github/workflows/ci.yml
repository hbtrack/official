# ──────────────────────────────────────────────────────────────────────────────
# HB Track — CI Pipeline (validação de PR e push para main)
# Jobs: validate -> test -> build
# NOTA: O deploy (staging/prod) é coberto por .github/workflows/deploy.yml
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hbtrack-backend

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Validar contratos e schemas
  # ────────────────────────────────────────────────────────────────────────────
  validate:
    name: Validate Contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar branch_ativo no SESSION_HANDOFF
        run: |
          CURRENT="${{ github.head_ref || github.ref_name }}"
          if [ -n "$CURRENT" ] && [ -f SESSION_HANDOFF.md ]; then
            sed -i "s|^branch_ativo:.*|branch_ativo: ${CURRENT}|" SESSION_HANDOFF.md
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node.js tooling (redocly, spectral, asyncapi)
        # Keep local parity with scripts/bootstrap/dev_contract_env.sh
        run: npm ci --ignore-scripts

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        # Keep local parity with scripts/bootstrap/dev_contract_env.sh
        run: pip install -r requirements-dev.txt -r scripts/_policy/requirements.txt

      - name: Install oasdiff
        run: |
          OASDIFF_VERSION="1.12.3"
          curl -fsSL "https://github.com/Tufin/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/oasdiff.tar.gz
          tar -xzf /tmp/oasdiff.tar.gz -C /tmp oasdiff
          sudo mv /tmp/oasdiff /usr/local/bin/oasdiff
          oasdiff --version

      - name: Run contract validation (warnings=failure B9-002)
        run: |
          python3 scripts/contracts/validate/validate_contracts.py --profile precommit
          echo "Contract gates passed (exit code 0 — no warnings, no failures)"

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Testes unitários e de integração
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-22.04
    needs: validate

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hbtrack_test
          POSTGRES_USER: hbtrack
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd "pg_isready -U hbtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-secret-key-for-testing-only-not-real
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      HB_RUN_SCHEMATHESIS: "1"
      HB_SCHEMATHESIS_MAX_EXAMPLES: "10"
      DATABASE_URL: postgres://hbtrack:testpassword@localhost:5432/hbtrack_test
      DB_NAME: hbtrack_test
      DB_USER: hbtrack
      DB_PASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: WARNING
      JWT_ALGORITHM: HS256
      JWT_SECRET: ci-jwt-secret-for-testing-only

    steps:
      - uses: actions/checkout@v4

      - name: Configurar git hooks path (requerido por TestHookIntegrity)
        run: git config core.hooksPath scripts/git-hooks

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (inclui schemathesis)
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests (inclui schemathesis e pipeline_gates; exclui slow)
        run: pytest -q -m "not slow" --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Build da imagem Docker frontend
  # ────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build + Tests
    runs-on: ubuntu-22.04
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps
        working-directory: frontend

      - name: Run unit tests (Vitest)
        run: npx vitest run --reporter=verbose
        working-directory: frontend

      - name: Run consumer contract tests (Pact)
        run: npm run test:pact
        working-directory: frontend

      - name: Publish consumer contracts to Pact Broker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
          PACT_BROKER_USERNAME: hbtrack
          PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
          CONSUMER_APP_VERSION: ${{ github.sha }}
          CONSUMER_VERSION_BRANCH: ${{ github.ref_name }}
        run: python3 scripts/contracts/pact/publish_frontend_pacts.py

      - name: Build production bundle
        run: npm run build
        working-directory: frontend

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image (sem push — validação)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: hbtrack-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 4 — Build da imagem Docker backend (verifica que o Dockerfile funciona)
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Docker Build Check
    runs-on: ubuntu-22.04
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (sem push — apenas validação)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
