# ──────────────────────────────────────────────────────────────────────────────
# HB Track — CI Pipeline (caller fino — E5: canonical executor)
# Delega para _reusable-ci.yml que lê versões de toolchain.json
# ATENÇÃO: após merge, verificar nomes dos check-runs no GitHub e atualizar
# ruleset + merge-readiness.json se os contexts mudaram
# ──────────────────────────────────────────────────────────────────────────────

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/_reusable-ci.yml
    secrets: inherit
