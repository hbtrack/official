name: HB Track — Deploy Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_env:
        description: "Ambiente alvo (staging | production)"
        required: false
        default: "staging"
      destructive_reset:
        description: "Destruir volumes de DB/Redis e recriar do zero (PERDA DE DADOS)"
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: hbtrack-backend
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # ETAPA 1: Validar contratos (todos os gates devem passar)
  # ─────────────────────────────────────────────────────────────
  validate:
    name: "1. Validate Contracts"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar branch_ativo no SESSION_HANDOFF
        run: |
          CURRENT=$(git branch --show-current)
          if [ -n "$CURRENT" ] && [ -f SESSION_HANDOFF.md ]; then
            sed -i "s|^branch_ativo:.*|branch_ativo: ${CURRENT}|" SESSION_HANDOFF.md
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.12.3/oasdiff_1.12.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/oasdiff.tar.gz"
          mkdir -p "$RUNNER_TEMP/oasdiff-extract"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff-extract"
          install -m 0755 "$(find "$RUNNER_TEMP/oasdiff-extract" -type f -name oasdiff | head -n1)" "$RUNNER_TEMP/oasdiff"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run contract gates
        run: python3 scripts/contracts/validate/validate_contracts.py

  # ─────────────────────────────────────────────────────────────
  # ETAPA 2: Testes
  # ─────────────────────────────────────────────────────────────
  test:
    name: "2. Run Tests"
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hbtrack_test
          POSTGRES_USER: hbtrack
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd "pg_isready -U hbtrack" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-secret-key-for-testing-only-not-real
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://hbtrack:testpassword@localhost:5432/hbtrack_test
      DB_NAME: hbtrack_test
      DB_USER: hbtrack
      DB_PASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: WARNING
      JWT_ALGORITHM: HS256
      JWT_SECRET: ci-jwt-secret-for-testing-only
      TRAINING_CURSOR_SECRET: ci-training-cursor-secret-for-testing-only

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests (excluindo schemathesis e pipeline_gates)
        run: pytest -q -m "not slow" --ignore=tests/schemathesis
          --ignore=tests/pipeline_gates --tb=short

  # ─────────────────────────────────────────────────────────────
  # ETAPA 3: Build da imagem Docker
  # ─────────────────────────────────────────────────────────────
  build:
    name: "3. Build Docker Image"
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            HB_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/hbtrack-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          build-args: |
            VITE_API_URL=/api
            VITE_APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # ETAPA 4: Deploy automático em staging
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: "4. Deploy → Staging"
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.handballtrack.app' }}
    env:
      STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.handballtrack.app' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar infra para o servidor staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/"
          target: /opt/hbtrack/staging

      - name: Provisionar e fazer deploy no staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/hbtrack/staging
            cd /opt/hbtrack/staging

            upsert_env() {
              KEY="$1"
              VALUE="$2"
              if grep -q "^${KEY}=" .env 2>/dev/null; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
              else
                echo "${KEY}=${VALUE}" >> .env
              fi
            }

            if [ ! -f .env ]; then
              echo "🔧 Primeiro deploy: gerando .env inicial para staging..."
              SK=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))")
              DB=$(python3 -c "import secrets; print(secrets.token_hex(16))")
              {
                echo "REGISTRY=ghcr.io/hbtrack"
                echo "IMAGE_TAG=latest"
                echo "COMPOSE_PROJECT_NAME=hbtrack-staging"
                echo "SECRET_KEY=${SK}"
                echo "DEBUG=false"
                echo "ALLOWED_HOSTS=staging.handballtrack.app,localhost,127.0.0.1"
                echo "DB_NAME=hb_track_staging"
                echo "DB_USER=hbtrack"
                echo "DB_PASSWORD=${DB}"
                echo "DB_HOST=postgres"
                echo "DB_PORT=5432"
                echo "DB_TEST_NAME=hb_track_staging_test"
                echo "POSTGRES_DB=hb_track_staging"
                echo "POSTGRES_USER=hbtrack"
                echo "POSTGRES_PASSWORD=${DB}"
                echo "REDIS_URL=redis://redis:6379/0"
                echo "CELERY_BROKER_URL=redis://redis:6379/0"
                echo "CELERY_TIMEZONE=America/Sao_Paulo"
                echo "CORS_ALLOWED_ORIGINS=https://staging.handballtrack.app"
                echo "LOG_LEVEL=INFO"
                echo "CLOUDINARY_URL="
                echo "CLOUDINARY_CLOUD_NAME="
                echo "CLOUDINARY_API_KEY="
                echo "CLOUDINARY_API_SECRET="
                echo "CLOUDINARY_UPLOAD_PRESET=hb_profile_photo"
                echo "RESEND_API_KEY="
                echo "RESEND_FROM_EMAIL=suporte@handballtrack.app"
                echo "RESEND_FROM_NAME=Handball Track"
              } > .env
              echo "✅ .env gerado com sucesso"
            else
              echo "✅ .env já existe — mantendo credenciais existentes"
            fi

            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

            upsert_env "REGISTRY" "ghcr.io/hbtrack"
            upsert_env "IMAGE_TAG" "${SHORT_SHA}"
            upsert_env "HB_BUILD_SHA" "${{ github.sha }}"
            upsert_env "COMPOSE_PROJECT_NAME" "hbtrack-staging"

            # Garantir localhost no ALLOWED_HOSTS (health check interno)
            if ! grep "^ALLOWED_HOSTS=" .env | grep -q "localhost"; then
              sed -i "s|^ALLOWED_HOSTS=\(.*\)$|ALLOWED_HOSTS=\1,localhost,127.0.0.1|" .env
            fi

            if grep -qvP '^\s*(#.*|[A-Za-z_][A-Za-z0-9_]*=.*)?\s*$' .env 2>/dev/null; then
              echo "⚠️ .env contém linhas com formato inválido — verifique manualmente"
              grep -nvP '^\s*(#.*|[A-Za-z_][A-Za-z0-9_]*=.*)?\s*$' .env || true
            else
              echo "✅ .env válido — credenciais existentes mantidas"
            fi

            # Login no GHCR com credencial persistente para pull no VPS
            if ! echo "${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_PULL_USERNAME || github.actor }}" --password-stdin 2>&1; then
              echo "❌ Falha ao autenticar no GHCR"
              exit 1
            fi

            docker compose -f infra/docker-compose.staging.yml pull

            if [ "${{ inputs.destructive_reset }}" = "true" ]; then
              echo "🔄 DESTRUCTIVE RESET — removendo volumes de staging..."
              docker compose -f infra/docker-compose.staging.yml down -v 2>/dev/null || true
              echo "⚠️ Volumes de staging removidos — dados recriados do zero"
            else
              docker compose -f infra/docker-compose.staging.yml down 2>/dev/null || true
            fi

            # Staging não expõe portas 80/443 — o edge proxy gerencia a borda.
            # Sem port guard, sem certbot, sem nginx nesta stack.
            docker compose -f infra/docker-compose.staging.yml up -d

            echo "⏳ Aguardando API inicializar (30s)..."
            sleep 30

            echo "--- STATUS DOS CONTAINERS ---"
            docker compose -f infra/docker-compose.staging.yml ps

            echo "--- LOGS DO CONTAINER API (últimas 80 linhas) ---"
            docker compose -f infra/docker-compose.staging.yml logs api --tail=80 2>&1 || true

            echo "✅ Deploy staging concluído — IMAGE_TAG=${SHORT_SHA}"

      - name: Health check — staging (interno no VPS)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/hbtrack/staging
            echo "Aguardando API inicializar (check interno)..."
            for i in $(seq 1 24); do
              if docker compose -f infra/docker-compose.staging.yml exec -T api \
                   curl -sf --max-time 5 http://localhost:8000/health >/dev/null 2>&1; then
                echo "✅ Staging OK (tentativa $i)"
                exit 0
              fi
              echo "⏳ Tentativa $i/24 — container não pronto"
              sleep 5
            done
            echo "❌ Health check interno falhou após 120s"
            exit 1

      - name: Freshness check — staging (interno no VPS)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/hbtrack/staging
            EXPECTED_SHA="${{ github.sha }}"

            echo "Aguardando frontend interno responder com o build esperado..."
            for i in $(seq 1 24); do
              HTML="$(docker compose -f infra/docker-compose.staging.yml exec -T frontend \
                sh -lc 'wget -qO- "http://127.0.0.1/?deploy_sha='"${EXPECTED_SHA}"'" 2>/dev/null || true)"

              if printf "%s" "$HTML" | grep -F "hb-build-sha" >/dev/null \
                && printf "%s" "$HTML" | grep -F "${EXPECTED_SHA}" >/dev/null; then
                echo "✅ Frontend interno serve o SHA esperado (tentativa $i)"
                break
              fi

              if [ "$i" -eq 24 ]; then
                echo "❌ Frontend interno não serviu o SHA esperado após 120s"
                echo "--- HTML retornado (última tentativa) ---"
                printf "%s\n" "$HTML"
                exit 1
              fi

              echo "⏳ Tentativa $i/24 — frontend ainda não pronto"
              sleep 5
            done

            HEALTH="$(docker compose -f infra/docker-compose.staging.yml exec -T api \
              curl -sf --max-time 5 http://localhost:8000/health)"
            if ! printf "%s" "$HEALTH" | grep -F "\"buildSha\": \"${EXPECTED_SHA}\"" >/dev/null \
              && ! printf "%s" "$HEALTH" | grep -F "\"buildSha\":\"${EXPECTED_SHA}\"" >/dev/null; then
              echo "❌ /health interno não reporta buildSha=${EXPECTED_SHA}"
              echo "$HEALTH"
              exit 1
            fi

            echo "✅ Staging interno serve o build ${EXPECTED_SHA}"

      - name: Reachability check — staging (público)
        run: |
          set -euo pipefail
          BASE_URL="${STAGING_URL%/}"
          echo "Validando reachability pública do staging em ${BASE_URL}..."
          for i in $(seq 1 24); do
            STATUS=$(curl -sS -L --max-time 10 -o /dev/null -w "%{http_code}" "${BASE_URL}/" || true)
            if [ -z "$STATUS" ]; then
              STATUS="000"
            fi
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging público acessível (tentativa $i)"
              exit 0
            fi
            echo "⏳ Tentativa $i/24 — HTTP $STATUS"
            sleep 5
          done
          echo "❌ Staging público inacessível após 120s"
          exit 1

      - name: Seed demo data — staging (opcional)
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/staging
            echo "🌱 Aplicando seed de dados de demonstração em staging..."
            docker compose -f infra/docker-compose.staging.yml exec -T api \
              python manage.py seed_demo 2>&1 || true
            echo "✅ Seed demo concluído (ou já existia)"

      - name: Diagnóstico — logs container api (em caso de falha)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/staging
            echo "--- CONTAINER STATUS ---"
            docker compose -f infra/docker-compose.staging.yml ps 2>&1 || true
            echo "--- LOGS API (100 linhas) ---"
            docker compose -f infra/docker-compose.staging.yml logs api --tail=100 2>&1 || true
            echo "--- LOGS EDGE (verificar se proxy está rodando) ---"
            docker ps --filter name=hbtrack-edge 2>&1 || true

  # ─────────────────────────────────────────────────────────────
  # ETAPA 5: Validação de contratos contra staging live
  #          HTTP_RUNTIME_CONTRACT_GATE — Schemathesis CLI
  #          Matrix: 1 job por módulo em paralelo (evita timeout)
  # ─────────────────────────────────────────────────────────────
  contract-conformance:
    name: "5. Contract Conformance — ${{ matrix.module }} (Staging)"
    runs-on: ubuntu-latest
    needs: deploy-staging
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module:
          - auth
          - users
          - teams
          - seasons
          - training-core
          - training-ops
          - training-intelligence
    env:
      HB_STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.handballtrack.app' }}
      HB_SCHEMATHESIS_MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar branch_ativo no SESSION_HANDOFF
        env:
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          CURRENT="${CURRENT_BRANCH}"
          if [ -n "$CURRENT" ] && [ -f SESSION_HANDOFF.md ]; then
            sed -i "s|^branch_ativo:.*|branch_ativo: ${CURRENT}|" SESSION_HANDOFF.md
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.12.3/oasdiff_1.12.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/oasdiff.tar.gz"
          mkdir -p "$RUNNER_TEMP/oasdiff-extract"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff-extract"
          install -m 0755 "$(find "$RUNNER_TEMP/oasdiff-extract" -type f -name oasdiff | head -n1)" "$RUNNER_TEMP/oasdiff"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run HTTP_RUNTIME_CONTRACT_GATE
        run: python3 scripts/contracts/validate/validate_contracts.py

  # ─────────────────────────────────────────────────────────────
  # ETAPA 6: Aprovação humana obrigatória antes de produção
  #          Configurar em: Settings → Environments → production
  #          → Required reviewers → adicionar responsável
  # ─────────────────────────────────────────────────────────────
  approve:
    name: "6. Aguardando aprovação humana"
    runs-on: ubuntu-latest
    needs: contract-conformance
    permissions:
      contents: read
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Aprovação concedida
        run: echo "✅ Deploy para produção aprovado por ${{ github.actor }}"

  # ─────────────────────────────────────────────────────────────
  # ETAPA 7: Deploy em produção após aprovação
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: "7. Deploy → Production"
    runs-on: ubuntu-latest
    needs: approve
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verificar se produção está configurada
        id: check-prod
        run: |
          if [ -z "${{ secrets.VPS_HOST_PRODUCTION }}" ]; then
            echo "⚠️ VPS_HOST_PRODUCTION não configurado — skip deploy de produção"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar diretório de produção no servidor
        if: steps.check-prod.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/hbtrack/production
            # chmod apenas se o usuário atual for dono do diretório (evita falha se criado por root)
            if [ "$(stat -c '%U' /opt/hbtrack/production)" = "$(whoami)" ]; then
              chmod 755 /opt/hbtrack/production
            fi
            # Validação explícita: falhar com mensagem clara se o diretório não for gravável
            OWNER=$(stat -c '%U:%G' /opt/hbtrack/production)
            PERMS=$(stat -c '%a' /opt/hbtrack/production)
            echo "INFO: /opt/hbtrack/production owner=$OWNER perms=$PERMS"
            if ! test -w /opt/hbtrack/production; then
              echo "ERRO: diretório /opt/hbtrack/production não é gravável para $(whoami) (owner=$OWNER perms=$PERMS)"
              echo "AÇÃO NECESSÁRIA: executar no VPS como root: chown $(whoami) /opt/hbtrack/production"
              exit 1
            fi

      - name: Sincronizar infra para o servidor produção
        if: steps.check-prod.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/"
          target: /opt/hbtrack/production

      - name: Provisionar e fazer deploy em produção via SSH
        if: steps.check-prod.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/hbtrack/production
            cd /opt/hbtrack/production

            # ── Auto-provisioning: gerar .env no primeiro deploy ──
            if [ ! -f .env ]; then
              echo "🔧 Primeiro deploy: gerando .env inicial para produção..."
              SK=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))")
              DB=$(python3 -c "import secrets; print(secrets.token_hex(16))")
              {
                echo "REGISTRY=ghcr.io/hbtrack"
                echo "IMAGE_TAG=latest"
                echo "COMPOSE_PROJECT_NAME=hbtrack-production"
                echo "SECRET_KEY=${SK}"
                echo "DEBUG=false"
                echo "ALLOWED_HOSTS=handballtrack.app,www.handballtrack.app,${{ secrets.VPS_HOST_PRODUCTION }},localhost,127.0.0.1"
                echo "DB_NAME=hb_track_production"
                echo "DB_USER=hbtrack"
                echo "DB_PASSWORD=${DB}"
                echo "DB_HOST=postgres"
                echo "DB_PORT=5432"
                echo "DB_TEST_NAME=hb_track_production_test"
                echo "POSTGRES_DB=hb_track_production"
                echo "POSTGRES_USER=hbtrack"
                echo "POSTGRES_PASSWORD=${DB}"
                echo "REDIS_URL=redis://redis:6379/0"
                echo "CELERY_BROKER_URL=redis://redis:6379/0"
                echo "CELERY_TIMEZONE=America/Sao_Paulo"
                echo "CORS_ALLOWED_ORIGINS=https://handballtrack.app,https://www.handballtrack.app"
                echo "LOG_LEVEL=WARNING"
                echo "CLOUDINARY_URL="
                echo "CLOUDINARY_CLOUD_NAME="
                echo "CLOUDINARY_API_KEY="
                echo "CLOUDINARY_API_SECRET="
                echo "CLOUDINARY_UPLOAD_PRESET=hb_profile_photo"
                echo "RESEND_API_KEY="
                echo "RESEND_FROM_EMAIL=suporte@handballtrack.app"
                echo "RESEND_FROM_NAME=Handball Track"
              } > .env
              echo "✅ .env gerado com sucesso"
            else
              echo "✅ .env já existe — mantendo credenciais existentes"
            fi

            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

            # Salvar SHA anterior para rollback
            PREV_SHA=$(grep "^IMAGE_TAG=" .env | cut -d= -f2 || echo "")
            if [ -n "${PREV_SHA}" ] && [ "${PREV_SHA}" != "latest" ]; then
              echo "${PREV_SHA}" > .last_sha
            fi

            # Garantir localhost no ALLOWED_HOSTS
            if ! grep -q "^ALLOWED_HOSTS=" .env 2>/dev/null; then
              echo "ALLOWED_HOSTS=handballtrack.app,www.handballtrack.app,${{ secrets.VPS_HOST_PRODUCTION }},localhost,127.0.0.1" >> .env
            elif ! grep "^ALLOWED_HOSTS=" .env | grep -q "localhost"; then
              sed -i "s|^ALLOWED_HOSTS=\(.*\)$|ALLOWED_HOSTS=\1,localhost,127.0.0.1|" .env
            fi

            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${SHORT_SHA}|" .env
            if grep -q "^HB_BUILD_SHA=" .env 2>/dev/null; then
              sed -i "s|^HB_BUILD_SHA=.*|HB_BUILD_SHA=${{ github.sha }}|" .env
            else
              echo "HB_BUILD_SHA=${{ github.sha }}" >> .env
            fi

            if grep -qvP '^\s*(#.*|[A-Za-z_][A-Za-z0-9_]*=.*)?\s*$' .env 2>/dev/null; then
              echo "⚠️ .env contém linhas com formato inválido"
              grep -nvP '^\s*(#.*|[A-Za-z_][A-Za-z0-9_]*=.*)?\s*$' .env || true
            else
              echo "✅ .env válido"
            fi

            # Login no GHCR com credencial persistente para pull no VPS
            if ! echo "${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_PULL_USERNAME || github.actor }}" --password-stdin 2>&1; then
              echo "❌ Falha ao autenticar no GHCR"
              exit 1
            fi

            docker compose -f infra/docker-compose.prod.yml pull

            echo "🔄 Deploy produção — parando containers, preservando dados..."
            docker compose -f infra/docker-compose.prod.yml down 2>/dev/null || true

            # Produção não expõe 80/443 — o edge proxy gerencia a borda.
            # Sem port guard, sem certbot nesta stack.
            docker compose -f infra/docker-compose.prod.yml up -d

            echo "⏳ Aguardando API inicializar (30s)..."
            sleep 30

            echo "--- STATUS DOS CONTAINERS ---"
            docker compose -f infra/docker-compose.prod.yml ps

            echo "--- LOGS DO CONTAINER API (últimas 80 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs api --tail=80 2>&1 || true

            echo "✅ Deploy produção concluído — IMAGE_TAG=${SHORT_SHA}"

      - name: Health check — production
        if: steps.check-prod.outputs.skip != 'true'
        id: healthcheck
        # Verifica internamente via docker exec — não depende do edge proxy estar rodando.
        # O healthcheck via URL pública só funcionaria após deploy-edge, criando deadlock
        # em primeiro rollout. Usando check interno o rollback continua funcional.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            echo "Aguardando API inicializar..."
            for i in $(seq 1 24); do
              if docker exec hbtrack-production-api-1 \
                   curl -sf --max-time 5 http://localhost:8000/health > /dev/null 2>&1; then
                echo "✅ Produção OK (tentativa $i)"
                exit 0
              fi
              echo "⏳ Tentativa $i/24 — container não pronto"
              sleep 5
            done
            echo "❌ Health check interno falhou — iniciando rollback"
            exit 1

      - name: Rollback automático em caso de falha
        if: failure() && steps.healthcheck.outcome == 'failure' &&
          steps.check-prod.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/hbtrack/production
            PREV_SHA=$(cat .last_sha 2>/dev/null | tr -d '[:space:]' || echo "")
            if [ -n "${PREV_SHA}" ] && [ "${PREV_SHA}" != "latest" ] && [ "${PREV_SHA}" != "none" ]; then
              echo "⏪ Rollback para SHA ${PREV_SHA}..."
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${PREV_SHA}|" .env
              docker compose -f infra/docker-compose.prod.yml pull
              docker compose -f infra/docker-compose.prod.yml up -d --force-recreate
              echo "✅ Rollback concluído — IMAGE_TAG=${PREV_SHA}"
            else
              echo "⚠️ Sem SHA válido para rollback (PREV_SHA='${PREV_SHA}')"
              echo "   Stack atual mantida — investigar manualmente"
              docker compose -f infra/docker-compose.prod.yml ps || true
            fi

      - name: Diagnóstico — logs container api (em caso de falha)
        if: failure() && steps.check-prod.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/production
            echo "--- CONTAINER STATUS ---"
            docker compose -f infra/docker-compose.prod.yml ps 2>&1 || true
            echo "--- LOGS API (100 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs api --tail=100 2>&1 || true
            echo "--- LOGS EDGE (verificar se proxy está rodando) ---"
            docker ps --filter name=hbtrack-edge 2>&1 || true

  # ─────────────────────────────────────────────────────────────
  # ETAPA 8: Deploy Edge Proxy (proxy único de borda)
  #          Roda após deploy-production. Idempotente.
  #
  #          Resolve o conflito staging/produção:
  #          staging e produção ficam em redes internas distintas.
  #          O edge roteia por hostname sem disputar 80/443.
  # ─────────────────────────────────────────────────────────────
  deploy-edge:
    name: "8. Deploy → Edge Proxy"
    runs-on: ubuntu-latest
    needs: deploy-production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verificar se VPS está configurada
        id: check-vps
        run: |
          if [ -z "${{ secrets.VPS_HOST_PRODUCTION }}" ]; then
            echo "⚠️ VPS_HOST_PRODUCTION não configurado — skip edge deploy"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sincronizar infra para o servidor (edge)
        if: steps.check-vps.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/"
          target: /opt/hbtrack/edge

      - name: Provisionar Edge Proxy via SSH
        if: steps.check-vps.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/hbtrack/edge
            cd /opt/hbtrack/edge

            docker network create hbtrack-prod-net 2>/dev/null || true
            docker network create hbtrack-staging-net 2>/dev/null || true

            EDGE_CONF_VOL="hbtrack-edge_certbot_conf"
            EDGE_WWW_VOL="hbtrack-edge_certbot_www"
            OLD_PROD_VOL="hbtrack-production_certbot_conf"
            OLD_PROD_WWW="hbtrack-production_certbot_www"

            # Migração única: copiar certs do volume antigo de produção para edge
            if docker volume ls --format "{{.Name}}" | grep -q "^${OLD_PROD_VOL}$" && \
               ! docker volume ls --format "{{.Name}}" | grep -q "^${EDGE_CONF_VOL}$"; then
              echo "📦 Migrando certs de produção para volume edge..."
              docker run --rm \
                -v ${OLD_PROD_VOL}:/src:ro \
                -v ${EDGE_CONF_VOL}:/dst \
                alpine sh -c "cp -a /src/. /dst/"
              echo "✅ Migração certbot_conf concluída"
            fi
            if docker volume ls --format "{{.Name}}" | grep -q "^${OLD_PROD_WWW}$" && \
               ! docker volume ls --format "{{.Name}}" | grep -q "^${EDGE_WWW_VOL}$"; then
              docker run --rm \
                -v ${OLD_PROD_WWW}:/src:ro \
                -v ${EDGE_WWW_VOL}:/dst \
                alpine sh -c "cp -a /src/. /dst/"
            fi

            # Parar qualquer nginx legado que ocupe 80/443
            docker ps --format '{{.ID}} {{.Ports}} {{.Names}}' \
              | awk '/:80->|:443->/ && !/hbtrack-edge/ {print $1}' \
              | xargs -r docker stop >/dev/null 2>&1 || true

            if [ ! -f .env ]; then
              { echo "NGINX_EDGE_CONF=nginx.edge.bootstrap.conf"; echo "COMPOSE_PROJECT_NAME=hbtrack-edge"; } > .env
            fi

            PROD_CERT_OK=false
            STAGING_CERT_OK=false
            docker run --rm -v ${EDGE_CONF_VOL}:/etc/letsencrypt alpine \
              test -f /etc/letsencrypt/live/handballtrack.app/fullchain.pem 2>/dev/null \
              && PROD_CERT_OK=true && echo "✅ Cert produção: presente" || echo "📜 Cert produção: ausente"
            docker run --rm -v ${EDGE_CONF_VOL}:/etc/letsencrypt alpine \
              test -f /etc/letsencrypt/live/staging.handballtrack.app/fullchain.pem 2>/dev/null \
              && STAGING_CERT_OK=true && echo "✅ Cert staging: presente" || echo "📜 Cert staging: ausente"

            if [ "${PROD_CERT_OK}" = "false" ] || [ "${STAGING_CERT_OK}" = "false" ]; then
              sed -i "s|^NGINX_EDGE_CONF=.*|NGINX_EDGE_CONF=nginx.edge.bootstrap.conf|" .env
              docker compose -f infra/docker-compose.edge.yml up -d nginx
              sleep 5
              VPS_IP=$(curl -s --max-time 5 ifconfig.me 2>/dev/null || hostname -I | awk '{print $1}')

              if [ "${PROD_CERT_OK}" = "false" ]; then
                DNS_PROD=$(curl -s "https://dns.google/resolve?name=handballtrack.app&type=A" \
                  | python3 -c "import sys,json; r=json.load(sys.stdin); a=[x['data'] for x in r.get('Answer',[]) if x['type']==1]; print(a[0] if a else '')" 2>/dev/null || true)
                if [ "${DNS_PROD}" = "${VPS_IP}" ]; then
                  docker run --rm \
                    -v ${EDGE_CONF_VOL}:/etc/letsencrypt \
                    -v ${EDGE_WWW_VOL}:/var/www/certbot \
                    certbot/certbot certonly \
                    --webroot --webroot-path /var/www/certbot \
                    --non-interactive --agree-tos \
                    --email suporte@handballtrack.app \
                    -d handballtrack.app -d www.handballtrack.app
                  PROD_CERT_OK=true
                  echo "✅ Cert produção emitido"
                fi
              fi

              if [ "${STAGING_CERT_OK}" = "false" ]; then
                DNS_STAG=$(curl -s "https://dns.google/resolve?name=staging.handballtrack.app&type=A" \
                  | python3 -c "import sys,json; r=json.load(sys.stdin); a=[x['data'] for x in r.get('Answer',[]) if x['type']==1]; print(a[0] if a else '')" 2>/dev/null || true)
                if [ "${DNS_STAG}" = "${VPS_IP}" ]; then
                  docker run --rm \
                    -v ${EDGE_CONF_VOL}:/etc/letsencrypt \
                    -v ${EDGE_WWW_VOL}:/var/www/certbot \
                    certbot/certbot certonly \
                    --webroot --webroot-path /var/www/certbot \
                    --non-interactive --agree-tos \
                    --email suporte@handballtrack.app \
                    -d staging.handballtrack.app
                  STAGING_CERT_OK=true
                  echo "✅ Cert staging emitido"
                fi
              fi
            fi

            if [ "${PROD_CERT_OK}" = "true" ] && [ "${STAGING_CERT_OK}" = "true" ]; then
              sed -i "s|^NGINX_EDGE_CONF=.*|NGINX_EDGE_CONF=nginx.edge.conf|" .env
              docker compose -f infra/docker-compose.edge.yml up -d
              echo "✅ Edge proxy rodando com SSL completo"
            else
              echo "⚠️ Edge em modo bootstrap — certs incompletos. Re-execute após corrigir DNS."
              docker compose -f infra/docker-compose.edge.yml up -d nginx
            fi
            docker compose -f infra/docker-compose.edge.yml ps

      - name: Health check — edge
        if: steps.check-vps.outputs.skip != 'true'
        run: |
          for HOST in handballtrack.app www.handballtrack.app; do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "https://${HOST}/health" || echo "000")
            echo "${HOST}: HTTP ${STATUS}"
          done
          PROD_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "https://handballtrack.app/health" || echo "000")
          if [ "${PROD_STATUS}" != "200" ]; then
            echo "❌ handballtrack.app não respondeu 200 (status=${PROD_STATUS})"
            exit 1
          fi
          echo "✅ Edge proxy OK"
