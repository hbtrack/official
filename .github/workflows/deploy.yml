name: HB Track — Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_env:
        description: "Ambiente alvo (staging | production)"
        required: false
        default: "staging"

env:
  IMAGE_NAME: hbtrack-backend
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # ETAPA 1: Validar contratos (todos os gates devem passar)
  # ─────────────────────────────────────────────────────────────
  validate:
    name: "1. Validate Contracts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.12.3/oasdiff_1.12.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/oasdiff.tar.gz"
          mkdir -p "$RUNNER_TEMP/oasdiff-extract"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff-extract"
          install -m 0755 "$(find "$RUNNER_TEMP/oasdiff-extract" -type f -name oasdiff | head -n1)" "$RUNNER_TEMP/oasdiff"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run contract gates
        run: python3 scripts/contracts/validate/validate_contracts.py

  # ─────────────────────────────────────────────────────────────
  # ETAPA 2: Testes
  # ─────────────────────────────────────────────────────────────
  test:
    name: "2. Run Tests"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q

  # ─────────────────────────────────────────────────────────────
  # ETAPA 3: Build da imagem Docker
  # ─────────────────────────────────────────────────────────────
  build:
    name: "3. Build Docker Image"
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  # ─────────────────────────────────────────────────────────────
  # ETAPA 4: Deploy automático em staging
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: "4. Deploy → Staging"
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/staging
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ needs.build.outputs.image_sha }}|" .env
            docker compose -f infra/docker-compose.prod.yml pull
            docker compose -f infra/docker-compose.prod.yml up -d --force-recreate
      - name: Health check — staging
        run: |
          echo "Aguardando staging inicializar..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging OK (tentativa $i)"
              exit 0
            fi
            echo "⏳ Tentativa $i/24 — HTTP $STATUS"
            sleep 5
          done
          echo "❌ Health check falhou após 120s"
          exit 1

  # ─────────────────────────────────────────────────────────────
  # ETAPA 5: Aprovação humana obrigatória antes de produção
  #          Configurar em: Settings → Environments → production
  #          → Required reviewers → adicionar responsável
  # ─────────────────────────────────────────────────────────────
  approve:
    name: "5. Aguardando aprovação humana"
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Aprovação concedida
        run: echo "✅ Deploy para produção aprovado por ${{ github.actor }}"

  # ─────────────────────────────────────────────────────────────
  # ETAPA 6: Deploy em produção após aprovação
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: "6. Deploy → Production"
    runs-on: ubuntu-latest
    needs: approve
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/production
            # Salvar SHA anterior para rollback
            PREV_SHA=$(grep "^IMAGE_TAG=" .env | cut -d= -f2 || echo "")
            echo "$PREV_SHA" > .last_sha
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${{ needs.build.outputs.image_sha }}|" .env
            docker compose -f infra/docker-compose.prod.yml pull
            docker compose -f infra/docker-compose.prod.yml up -d --force-recreate
      - name: Health check — production
        id: healthcheck
        run: |
          echo "Aguardando produção inicializar..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PRODUCTION_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Produção OK (tentativa $i)"
              exit 0
            fi
            echo "⏳ Tentativa $i/24 — HTTP $STATUS"
            sleep 5
          done
          echo "❌ Health check falhou — iniciando rollback"
          exit 1
      - name: Rollback automático em caso de falha
        if: failure() && steps.healthcheck.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/production
            PREV_SHA=$(cat .last_sha 2>/dev/null || echo "")
            if [ -n "$PREV_SHA" ]; then
              echo "⏪ Rollback para SHA $PREV_SHA"
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$PREV_SHA|" .env
              docker compose -f infra/docker-compose.prod.yml pull
              docker compose -f infra/docker-compose.prod.yml up -d --force-recreate
            else
              echo "⚠️ Sem SHA anterior para rollback"
            fi
