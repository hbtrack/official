name: HB Track — Deploy Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_env:
        description: "Ambiente alvo (staging | production)"
        required: false
        default: "staging"
      destructive_reset:
        description: "Destruir volumes de DB/Redis e recriar do zero (PERDA DE DADOS)"
        required: false
        type: boolean
        default: false

env:
  IMAGE_NAME: hbtrack-backend
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # ETAPA 1: Validar contratos (todos os gates devem passar)
  # ─────────────────────────────────────────────────────────────
  validate:
    name: "1. Validate Contracts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar branch_ativo no SESSION_HANDOFF
        run: |
          CURRENT=$(git branch --show-current)
          if [ -n "$CURRENT" ] && [ -f SESSION_HANDOFF.md ]; then
            sed -i "s|^branch_ativo:.*|branch_ativo: ${CURRENT}|" SESSION_HANDOFF.md
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.12.3/oasdiff_1.12.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/oasdiff.tar.gz"
          mkdir -p "$RUNNER_TEMP/oasdiff-extract"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff-extract"
          install -m 0755 "$(find "$RUNNER_TEMP/oasdiff-extract" -type f -name oasdiff | head -n1)" "$RUNNER_TEMP/oasdiff"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run contract gates
        run: python3 scripts/contracts/validate/validate_contracts.py

  # ─────────────────────────────────────────────────────────────
  # ETAPA 2: Testes
  # ─────────────────────────────────────────────────────────────
  test:
    name: "2. Run Tests"
    runs-on: ubuntu-latest
    needs: validate

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hbtrack_test
          POSTGRES_USER: hbtrack
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd "pg_isready -U hbtrack" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      SECRET_KEY: ci-secret-key-for-testing-only-not-real
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://hbtrack:testpassword@localhost:5432/hbtrack_test
      DB_NAME: hbtrack_test
      DB_USER: hbtrack
      DB_PASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: WARNING
      JWT_ALGORITHM: HS256
      JWT_SECRET: ci-jwt-secret-for-testing-only
      TRAINING_CURSOR_SECRET: ci-training-cursor-secret-for-testing-only

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests (excluindo schemathesis e pipeline_gates)
        run: pytest -q --ignore=tests/schemathesis --ignore=tests/pipeline_gates
          --tb=short

  # ─────────────────────────────────────────────────────────────
  # ETAPA 3: Build da imagem Docker
  # ─────────────────────────────────────────────────────────────
  build:
    name: "3. Build Docker Image"
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            HB_BUILD_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/hbtrack-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          build-args: |
            VITE_API_URL=/api
            VITE_APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  # ETAPA 4: Deploy automático em staging
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: "4. Deploy → Staging"
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ vars.STAGING_URL || 'https://staging.handballtrack.app' }}
    env:
      STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.handballtrack.app' }}
      STAGING_HTTP_PORT: ${{ vars.STAGING_HTTP_PORT || '80' }}
      STAGING_HTTPS_PORT: ${{ vars.STAGING_HTTPS_PORT || '443' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sincronizar infra para o servidor staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/"
          target: /opt/hbtrack/staging

      - name: Provisionar e fazer deploy no staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/hbtrack/staging
            cd /opt/hbtrack/staging
            STAGING_HTTP_PORT="${{ vars.STAGING_HTTP_PORT || '80' }}"
            STAGING_HTTPS_PORT="${{ vars.STAGING_HTTPS_PORT || '443' }}"

            upsert_env() {
              KEY="$1"
              VALUE="$2"
              if grep -q "^${KEY}=" .env 2>/dev/null; then
                sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
              else
                echo "${KEY}=${VALUE}" >> .env
              fi
            }

            if [ ! -f .env ]; then
              echo "🔧 Primeiro deploy: gerando .env inicial para staging..."
              SK=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))")
              DB=$(python3 -c "import secrets; print(secrets.token_hex(16))")
              {
                echo "REGISTRY=ghcr.io/hbtrack"
                echo "IMAGE_TAG=latest"
                echo "COMPOSE_PROJECT_NAME=hbtrack-staging"
                echo "NGINX_CONF=nginx.staging.conf"
                echo "HTTP_PORT=${STAGING_HTTP_PORT}"
                echo "HTTPS_PORT=${STAGING_HTTPS_PORT}"
                echo "SECRET_KEY=${SK}"
                echo "DEBUG=false"
                echo "ALLOWED_HOSTS=staging.handballtrack.app,191.252.185.34"
                echo "DB_NAME=hb_track_staging"
                echo "DB_USER=hbtrack"
                echo "DB_PASSWORD=${DB}"
                echo "DB_HOST=postgres"
                echo "DB_PORT=5432"
                echo "DB_TEST_NAME=hb_track_staging_test"
                echo "POSTGRES_DB=hb_track_staging"
                echo "POSTGRES_USER=hbtrack"
                echo "POSTGRES_PASSWORD=${DB}"
                echo "REDIS_URL=redis://redis:6379/0"
                echo "CELERY_BROKER_URL=redis://redis:6379/0"
                echo "CELERY_TIMEZONE=America/Sao_Paulo"
                echo "CORS_ALLOWED_ORIGINS=https://staging.handballtrack.app"
                echo "LOG_LEVEL=INFO"
                echo "CLOUDINARY_URL="
                echo "CLOUDINARY_CLOUD_NAME="
                echo "CLOUDINARY_API_KEY="
                echo "CLOUDINARY_API_SECRET="
                echo "CLOUDINARY_UPLOAD_PRESET=hb_profile_photo"
                echo "RESEND_API_KEY="
                echo "RESEND_FROM_EMAIL=suporte@handballtrack.app"
                echo "RESEND_FROM_NAME=Handball Track"
              } > .env
              echo "✅ .env gerado com sucesso"
            else
              echo "✅ .env já existe — mantendo credenciais existentes"
            fi

            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

            # Migrar .env existente e forçar staging para o endpoint público validado.
            upsert_env "REGISTRY" "ghcr.io/hbtrack"
            upsert_env "IMAGE_TAG" "${SHORT_SHA}"
            upsert_env "HB_BUILD_SHA" "${{ github.sha }}"
            upsert_env "COMPOSE_PROJECT_NAME" "hbtrack-staging"
            upsert_env "NGINX_CONF" "nginx.staging.conf"
            upsert_env "HTTP_PORT" "${STAGING_HTTP_PORT}"
            upsert_env "HTTPS_PORT" "${STAGING_HTTPS_PORT}"

            # Validar .env: se tiver linhas sem VAR= (ex: PEM key multi-linha), avisar
            if grep -qvP '^\s*(#.*|[A-Za-z_][A-Za-z0-9_]*=.*)?\s*$' .env 2>/dev/null; then
              echo "⚠️ .env contém linhas com formato inválido — verifique manualmente"
              echo "   Para regenerar, execute o workflow com destructive_reset=true"
              grep -nvP '^\s*(#.*|[A-Za-z_][A-Za-z0-9_]*=.*)?\s*$' .env || true
            else
              echo "✅ .env válido — credenciais existentes mantidas"
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true

            docker compose -f infra/docker-compose.prod.yml pull

            if [ "${{ inputs.destructive_reset }}" = "true" ]; then
              echo "🔄 DESTRUCTIVE RESET solicitado — parando containers e removendo volumes de dados..."
              docker compose -f infra/docker-compose.prod.yml down -v 2>/dev/null || true
              docker volume rm hbtrack-prod_postgres_data hbtrack-prod_redis_data 2>/dev/null || true
              echo "⚠️ Volumes de DB e Redis removidos — dados serão recriados do zero"
            else
              echo "🔄 Deploy normal — parando containers, preservando dados..."
              docker compose -f infra/docker-compose.prod.yml down 2>/dev/null || true
            fi

            # ────────────────────────────────────────────────────────────
            # PORT GUARD — libera 80/443 antes de certbot e up -d.
            # Causa raiz histórica: stacks legados (com COMPOSE_PROJECT_NAME
            # diferente do esperado) seguram as portas e o "stop nginx"
            # com nome hardcoded falha silenciosamente. Aqui paramos
            # qualquer container Docker que esteja publicando 80/443,
            # independentemente de project name.
            # ────────────────────────────────────────────────────────────
            free_port() {
              local PORT="$1"
              echo "🔍 Verificando ocupantes da porta ${PORT}..."
              local OCCUPANTS
              OCCUPANTS=$(docker ps --format '{{.ID}} {{.Names}} {{.Ports}}' | awk -v p=":${PORT}->" '$0 ~ p {print $1"|"$2}')
              if [ -z "${OCCUPANTS}" ]; then
                echo "  ✅ Porta ${PORT} livre"
                return 0
              fi
              echo "  ⚠️ Porta ${PORT} ocupada por:"
              echo "${OCCUPANTS}" | sed 's/^/    /'
              echo "${OCCUPANTS}" | while IFS='|' read -r CID CNAME; do
                # NUNCA mexer em containers do staging atual (vão subir já já)
                case "${CNAME}" in
                  hbtrack-staging-*) echo "    ↩️ skip ${CNAME} (staging atual)"; continue ;;
                esac
                echo "    🛑 stop ${CNAME} (${CID})"
                docker stop "${CID}" >/dev/null 2>&1 || true
              done
            }
            if [ "${STAGING_HTTP_PORT}" = "80" ]; then
              free_port 80
            else
              echo "ℹ️ STAGING_HTTP_PORT=${STAGING_HTTP_PORT} (não-pública) — port guard 80 skip"
            fi
            if [ "${STAGING_HTTPS_PORT}" = "443" ]; then
              free_port 443
            else
              echo "ℹ️ STAGING_HTTPS_PORT=${STAGING_HTTPS_PORT} (não-pública) — port guard 443 skip"
            fi

            # Gerar certificado SSL se ausente
            if ! docker run --rm -v hbtrack-staging_certbot_conf:/etc/letsencrypt alpine \
                test -f /etc/letsencrypt/live/staging.handballtrack.app/fullchain.pem 2>/dev/null; then
              echo "📜 Certificado SSL ausente — gerando via certbot standalone..."
              # port guard acima já liberou a 80; double-check
              free_port 80
              docker run --rm \
                -v hbtrack-staging_certbot_conf:/etc/letsencrypt \
                -v hbtrack-staging_certbot_www:/var/www/certbot \
                -p 80:80 \
                certbot/certbot certonly \
                --standalone \
                --non-interactive \
                --agree-tos \
                --email suporte@handballtrack.app \
                -d staging.handballtrack.app \
              && echo "✅ Certificado SSL gerado com sucesso" \
              || echo "⚠️ Certbot falhou — continuando deploy sem SSL (renovação manual necessária)"
            else
              echo "✅ Certificado SSL existente — mantendo"
            fi

            # Re-confirma portas livres logo antes do up (independente por porta)
            if [ "${STAGING_HTTP_PORT}" = "80" ]; then
              free_port 80
            fi
            if [ "${STAGING_HTTPS_PORT}" = "443" ]; then
              free_port 443
            fi

            docker compose -f infra/docker-compose.prod.yml up -d

            echo "⏳ Aguardando API inicializar (30s)..."
            sleep 30

            echo "--- STATUS DOS CONTAINERS ---"
            docker compose -f infra/docker-compose.prod.yml ps

            echo "--- LOGS DO CONTAINER API (últimas 80 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs api --tail=80 2>&1 || true

            echo "✅ Deploy staging concluído — IMAGE_TAG=${SHORT_SHA}"

      - name: Health check — staging
        run: |
          echo "Aguardando staging inicializar..."
          HEALTH_URL="${STAGING_URL%/}/health"
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_URL}" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging OK (tentativa $i)"
              exit 0
            fi
            echo "⏳ Tentativa $i/24 — HTTP $STATUS"
            sleep 5
          done
          echo "❌ Health check falhou após 120s"
          exit 1

      - name: Freshness check — staging
        run: |
          set -euo pipefail
          BASE_URL="${STAGING_URL%/}"
          EXPECTED_SHA="${GITHUB_SHA}"

          HTML="$(curl -fsS --max-time 15 -H "Cache-Control: no-cache" "${BASE_URL}/?deploy_sha=${EXPECTED_SHA}")"
          if ! printf "%s" "$HTML" | grep -F "hb-build-sha" >/dev/null; then
            echo "❌ HTML público não contém meta hb-build-sha; domínio pode estar servindo artefato antigo"
            exit 1
          fi
          if ! printf "%s" "$HTML" | grep -F "${EXPECTED_SHA}" >/dev/null; then
            echo "❌ HTML público não contém o SHA esperado ${EXPECTED_SHA}"
            exit 1
          fi

          HEALTH="$(curl -fsS --max-time 15 "${BASE_URL}/health")"
          if ! printf "%s" "$HEALTH" | grep -F "\"buildSha\": \"${EXPECTED_SHA}\"" >/dev/null \
            && ! printf "%s" "$HEALTH" | grep -F "\"buildSha\":\"${EXPECTED_SHA}\"" >/dev/null; then
            echo "❌ /health público não reporta buildSha=${EXPECTED_SHA}"
            echo "$HEALTH"
            exit 1
          fi

          echo "✅ Staging público serve o build ${EXPECTED_SHA}"

      - name: Seed demo data — staging (opcional)
        if: success()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/staging
            echo "🌱 Aplicando seed de dados de demonstração em staging..."
            # Executar seed_demo dentro do container de forma idempotente
            docker compose -f infra/docker-compose.prod.yml exec -T api \
              python manage.py seed_demo 2>&1 || true
            echo "✅ Seed demo concluído (ou já existia)"

      - name: Diagnóstico — logs container api (em caso de falha)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/staging
            echo "--- CONTAINER STATUS ---"
            docker compose -f infra/docker-compose.prod.yml ps 2>&1 || true
            echo "--- LOGS API (100 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs api --tail=100 2>&1 || true
            echo "--- LOGS NGINX (30 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs nginx --tail=30 2>&1 || true

  # ─────────────────────────────────────────────────────────────
  # ETAPA 5: Validação de contratos contra staging live
  #          HTTP_RUNTIME_CONTRACT_GATE — Schemathesis CLI
  #          Matrix: 1 job por módulo em paralelo (evita timeout)
  # ─────────────────────────────────────────────────────────────
  contract-conformance:
    name: "5. Contract Conformance — ${{ matrix.module }} (Staging)"
    runs-on: ubuntu-latest
    needs: deploy-staging
    strategy:
      fail-fast: false
      matrix:
        module:
          - auth
          - users
          - teams
          - seasons
          - training-core
          - training-ops
          - training-intelligence
    env:
      HB_STAGING_URL: ${{ vars.STAGING_URL || 'https://staging.handballtrack.app' }}
      HB_SCHEMATHESIS_MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar branch_ativo no SESSION_HANDOFF
        env:
          CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          CURRENT="${CURRENT_BRANCH}"
          if [ -n "$CURRENT" ] && [ -f SESSION_HANDOFF.md ]; then
            sed -i "s|^branch_ativo:.*|branch_ativo: ${CURRENT}|" SESSION_HANDOFF.md
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.12.3/oasdiff_1.12.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/oasdiff.tar.gz"
          mkdir -p "$RUNNER_TEMP/oasdiff-extract"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff-extract"
          install -m 0755 "$(find "$RUNNER_TEMP/oasdiff-extract" -type f -name oasdiff | head -n1)" "$RUNNER_TEMP/oasdiff"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run HTTP_RUNTIME_CONTRACT_GATE
        run: python3 scripts/contracts/validate/validate_contracts.py

  # ─────────────────────────────────────────────────────────────
  # ETAPA 6: Aprovação humana obrigatória antes de produção
  #          Configurar em: Settings → Environments → production
  #          → Required reviewers → adicionar responsável
  # ─────────────────────────────────────────────────────────────
  approve:
    name: "6. Aguardando aprovação humana"
    runs-on: ubuntu-latest
    needs: contract-conformance
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Aprovação concedida
        run: echo "✅ Deploy para produção aprovado por ${{ github.actor }}"

  # ─────────────────────────────────────────────────────────────
  # ETAPA 7: Deploy em produção após aprovação
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: "7. Deploy → Production"
    runs-on: ubuntu-latest
    needs: approve
    steps:
      - uses: actions/checkout@v4
      - name: Verificar se produção está configurada
        id: check-prod
        run: |
          if [ -z "${{ secrets.VPS_HOST_PRODUCTION }}" ]; then
            echo "⚠️ VPS_HOST_PRODUCTION não configurado — skip deploy de produção"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Criar diretório de produção no servidor
        if: steps.check-prod.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/hbtrack/production
            # chmod apenas se o usuário atual for dono do diretório (evita falha se criado por root)
            [ "$(stat -c '%U' /opt/hbtrack/production)" = "$(whoami)" ] && chmod 755 /opt/hbtrack/production || true

      - name: Sincronizar infra para o servidor produção
        if: steps.check-prod.outputs.skip != 'true'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/"
          target: /opt/hbtrack/production

      - name: Provisionar e fazer deploy em produção via SSH
        if: steps.check-prod.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/hbtrack/production
            cd /opt/hbtrack/production

            # ── Auto-provisioning: gerar .env no primeiro deploy ──
            if [ ! -f .env ]; then
              echo "🔧 Primeiro deploy: gerando .env inicial para produção..."
              SK=$(python3 -c "import secrets; print(secrets.token_urlsafe(50))")
              DB=$(python3 -c "import secrets; print(secrets.token_hex(16))")
              {
                echo "REGISTRY=ghcr.io/hbtrack"
                echo "IMAGE_TAG=latest"
                echo "COMPOSE_PROJECT_NAME=hbtrack-production"
                echo "NGINX_CONF=nginx.production.conf"
                echo "HTTP_PORT=80"
                echo "HTTPS_PORT=443"
                echo "SECRET_KEY=${SK}"
                echo "DEBUG=false"
                echo "ALLOWED_HOSTS=handballtrack.app,www.handballtrack.app,${{ secrets.VPS_HOST_PRODUCTION }}"
                echo "DB_NAME=hb_track_production"
                echo "DB_USER=hbtrack"
                echo "DB_PASSWORD=${DB}"
                echo "DB_HOST=postgres"
                echo "DB_PORT=5432"
                echo "DB_TEST_NAME=hb_track_production_test"
                echo "POSTGRES_DB=hb_track_production"
                echo "POSTGRES_USER=hbtrack"
                echo "POSTGRES_PASSWORD=${DB}"
                echo "REDIS_URL=redis://redis:6379/0"
                echo "CELERY_BROKER_URL=redis://redis:6379/0"
                echo "CELERY_TIMEZONE=America/Sao_Paulo"
                echo "CORS_ALLOWED_ORIGINS=https://handballtrack.app,https://www.handballtrack.app"
                echo "LOG_LEVEL=WARNING"
                echo "CLOUDINARY_URL="
                echo "CLOUDINARY_CLOUD_NAME="
                echo "CLOUDINARY_API_KEY="
                echo "CLOUDINARY_API_SECRET="
                echo "CLOUDINARY_UPLOAD_PRESET=hb_profile_photo"
                echo "RESEND_API_KEY="
                echo "RESEND_FROM_EMAIL=suporte@handballtrack.app"
                echo "RESEND_FROM_NAME=Handball Track"
              } > .env
              echo "✅ .env gerado com sucesso"
            else
              echo "✅ .env já existe — mantendo credenciais existentes"
            fi

            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

            # Salvar SHA anterior para rollback
            PREV_SHA=$(grep "^IMAGE_TAG=" .env | cut -d= -f2 || echo "")
            echo "$PREV_SHA" > .last_sha

            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${SHORT_SHA}|" .env
            if grep -q "^HB_BUILD_SHA=" .env 2>/dev/null; then
              sed -i "s|^HB_BUILD_SHA=.*|HB_BUILD_SHA=${{ github.sha }}|" .env
            else
              echo "HB_BUILD_SHA=${{ github.sha }}" >> .env
            fi

            # Validar .env
            if grep -qvP '^\s*(#.*|[A-Za-z_][A-Za-z0-9_]*=.*)?\s*$' .env 2>/dev/null; then
              echo "⚠️ .env contém linhas com formato inválido — verifique manualmente"
              grep -nvP '^\s*(#.*|[A-Za-z_][A-Za-z0-9_]*=.*)?\s*$' .env || true
            else
              echo "✅ .env válido"
            fi

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true

            docker compose -f infra/docker-compose.prod.yml pull

            echo "🔄 Deploy produção — parando containers, preservando dados..."
            docker compose -f infra/docker-compose.prod.yml down 2>/dev/null || true

            # Gerar certificado SSL se ausente
            if ! docker run --rm -v hbtrack-production_certbot_conf:/etc/letsencrypt alpine \
                test -f /etc/letsencrypt/live/handballtrack.app/fullchain.pem 2>/dev/null; then
              echo "📜 Certificado SSL ausente — gerando via certbot standalone..."
              # Liberar porta 80 caso staging esteja rodando no mesmo VPS
              COMPOSE_PROJECT_NAME=hbtrack-staging docker compose -f infra/docker-compose.prod.yml stop nginx 2>/dev/null || true
              docker run --rm \
                -v hbtrack-production_certbot_conf:/etc/letsencrypt \
                -v hbtrack-production_certbot_www:/var/www/certbot \
                -p 80:80 \
                certbot/certbot certonly \
                --standalone \
                --non-interactive \
                --agree-tos \
                --email suporte@handballtrack.app \
                -d handballtrack.app \
                -d www.handballtrack.app \
              && echo "✅ Certificado SSL gerado com sucesso" \
              || echo "⚠️ Certbot falhou — continuando deploy sem SSL (renovação manual necessária)"
              # Sempre reiniciar nginx de staging, mesmo se certbot falhou
              COMPOSE_PROJECT_NAME=hbtrack-staging docker compose -f infra/docker-compose.prod.yml start nginx 2>/dev/null || true
            else
              echo "✅ Certificado SSL existente — mantendo"
            fi

            docker compose -f infra/docker-compose.prod.yml up -d

            echo "⏳ Aguardando API inicializar (30s)..."
            sleep 30

            echo "--- STATUS DOS CONTAINERS ---"
            docker compose -f infra/docker-compose.prod.yml ps

            echo "--- LOGS DO CONTAINER API (últimas 80 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs api --tail=80 2>&1 || true

            echo "✅ Deploy produção concluído — IMAGE_TAG=${SHORT_SHA}"

      - name: Health check — production
        if: steps.check-prod.outputs.skip != 'true'
        id: healthcheck
        run: |
          echo "Aguardando produção inicializar..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PRODUCTION_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Produção OK (tentativa $i)"
              exit 0
            fi
            echo "⏳ Tentativa $i/24 — HTTP $STATUS"
            sleep 5
          done
          echo "❌ Health check falhou — iniciando rollback"
          exit 1

      - name: Rollback automático em caso de falha
        if: failure() && steps.healthcheck.outcome == 'failure' &&
          steps.check-prod.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/production
            PREV_SHA=$(cat .last_sha 2>/dev/null || echo "")
            if [ -n "$PREV_SHA" ]; then
              echo "⏪ Rollback para SHA $PREV_SHA"
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$PREV_SHA|" .env
              docker compose -f infra/docker-compose.prod.yml pull
              docker compose -f infra/docker-compose.prod.yml up -d --force-recreate
            else
              echo "⚠️ Sem SHA anterior para rollback"
            fi

      - name: Diagnóstico — logs container api (em caso de falha)
        if: failure() && steps.check-prod.outputs.skip != 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/production
            echo "--- CONTAINER STATUS ---"
            docker compose -f infra/docker-compose.prod.yml ps 2>&1 || true
            echo "--- LOGS API (100 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs api --tail=100 2>&1 || true
            echo "--- LOGS NGINX (30 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs nginx --tail=30 2>&1 || true
