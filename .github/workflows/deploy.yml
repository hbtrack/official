name: HB Track — Deploy Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_env:
        description: "Ambiente alvo (staging | production)"
        required: false
        default: "staging"

env:
  IMAGE_NAME: hbtrack-backend
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # ETAPA 1: Validar contratos (todos os gates devem passar)
  # ─────────────────────────────────────────────────────────────
  validate:
    name: "1. Validate Contracts"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar branch_ativo no SESSION_HANDOFF
        run: |
          CURRENT=$(git branch --show-current)
          if [ -n "$CURRENT" ] && [ -f SESSION_HANDOFF.md ]; then
            sed -i "s|^branch_ativo:.*|branch_ativo: ${CURRENT}|" SESSION_HANDOFF.md
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.12.3/oasdiff_1.12.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/oasdiff.tar.gz"
          mkdir -p "$RUNNER_TEMP/oasdiff-extract"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff-extract"
          install -m 0755 "$(find "$RUNNER_TEMP/oasdiff-extract" -type f -name oasdiff | head -n1)" "$RUNNER_TEMP/oasdiff"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run contract gates
        run: python3 scripts/contracts/validate/validate_contracts.py

  # ─────────────────────────────────────────────────────────────
  # ETAPA 2: Testes
  # ─────────────────────────────────────────────────────────────
  test:
    name: "2. Run Tests"
    runs-on: ubuntu-latest
    needs: validate

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hbtrack_test
          POSTGRES_USER: hbtrack
          POSTGRES_PASSWORD: testpassword
        options: >-
          --health-cmd "pg_isready -U hbtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      # Fixtures locais do job de teste. Nao representam contrato operacional de deploy.
      SECRET_KEY: ci-secret-key-for-testing-only-not-real
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://hbtrack:testpassword@localhost:5432/hbtrack_test
      DB_NAME: hbtrack_test
      DB_USER: hbtrack
      DB_PASSWORD: testpassword
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: WARNING
      JWT_ALGORITHM: HS256
      JWT_SECRET: ci-jwt-secret-for-testing-only

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run migrations
        run: python manage.py migrate --noinput
      - name: Run tests (excluindo schemathesis e pipeline_gates)
        run: pytest -q --ignore=tests/schemathesis --ignore=tests/pipeline_gates --tb=short

  # ─────────────────────────────────────────────────────────────
  # ETAPA 3: Build da imagem Docker
  # ─────────────────────────────────────────────────────────────
  build:
    name: "3. Build Docker Image"
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.deploy-tag.outputs.image_tag }}
      image_sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute deploy image tag
        id: deploy-tag
        run: echo "image_tag=$(echo "${GITHUB_SHA}" | cut -c1-7)" >> "$GITHUB_OUTPUT"
      - name: Set image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Set frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/hbtrack-frontend
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}

  # ─────────────────────────────────────────────────────────────
  # ETAPA 4: Deploy automático em staging
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: "4. Deploy → Staging"
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render staging .env from operational contract
        env:
          HB_ENV_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          HB_ENV_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          HB_ENV_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HB_ENV_JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          HB_ENV_JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          HB_ENV_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          HB_ENV_CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          HB_ENV_CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          HB_ENV_CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          HB_ENV_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HB_ENV_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p .deploy
          bash scripts/deploy/inject_env.sh staging .deploy/staging.env "${{ needs.build.outputs.image_tag }}"

      - name: Sincronizar infra para o servidor staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/"
          target: /opt/hbtrack/staging

      - name: Sincronizar .env renderizado para o servidor staging
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".deploy/staging.env"
          target: /opt/hbtrack/staging

      - name: Provisionar e fazer deploy no staging via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/hbtrack/staging /opt/hbtrack/staging/.deploy
            cd /opt/hbtrack/staging
            install -m 600 .deploy/staging.env .env
            rm -f .deploy/staging.env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin 2>/dev/null || true

            docker compose -f infra/docker-compose.prod.yml pull

            # Reset apenas volumes de DB/Redis — preservar certificados SSL
            echo "🔄 Parando containers e resetando volumes de dados..."
            docker compose -f infra/docker-compose.prod.yml down 2>/dev/null || true
            docker volume rm hbtrack-prod_postgres_data hbtrack-prod_redis_data 2>/dev/null || true

            # Gerar certificado SSL se ausente (porta 80 livre após down)
            if ! docker run --rm -v hbtrack-prod_certbot_conf:/etc/letsencrypt alpine \
                test -f /etc/letsencrypt/live/staging.handballtrack.app/fullchain.pem 2>/dev/null; then
              echo "📜 Certificado SSL ausente — gerando via certbot standalone..."
              docker run --rm \
                -v hbtrack-prod_certbot_conf:/etc/letsencrypt \
                -v hbtrack-prod_certbot_www:/var/www/certbot \
                -p 80:80 \
                certbot/certbot certonly \
                --standalone \
                --non-interactive \
                --agree-tos \
                --email suporte@handballtrack.app \
                -d staging.handballtrack.app
              echo "✅ Certificado SSL gerado com sucesso"
            else
              echo "✅ Certificado SSL existente — mantendo"
            fi

            docker compose -f infra/docker-compose.prod.yml up -d

            echo "⏳ Aguardando API inicializar (30s)..."
            sleep 30

            echo "--- STATUS DOS CONTAINERS ---"
            docker compose -f infra/docker-compose.prod.yml ps

            echo "--- LOGS DO CONTAINER API (últimas 80 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs api --tail=80 2>&1 || true

            echo "✅ Deploy staging concluído — IMAGE_TAG=${{ needs.build.outputs.image_tag }}"

      - name: Health check — staging
        run: |
          echo "Aguardando staging inicializar..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.STAGING_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Staging OK (tentativa $i)"
              exit 0
            fi
            echo "⏳ Tentativa $i/24 — HTTP $STATUS"
            sleep 5
          done
          echo "❌ Health check falhou após 120s"
          exit 1

      - name: Diagnóstico — logs container api (em caso de falha)
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_STAGING }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/staging
            echo "--- CONTAINER STATUS ---"
            docker compose -f infra/docker-compose.prod.yml ps 2>&1 || true
            echo "--- LOGS API (100 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs api --tail=100 2>&1 || true
            echo "--- LOGS NGINX (30 linhas) ---"
            docker compose -f infra/docker-compose.prod.yml logs nginx --tail=30 2>&1 || true

  # ─────────────────────────────────────────────────────────────
  # ETAPA 5: Validação de contratos contra staging live
  #          HTTP_RUNTIME_CONTRACT_GATE — Schemathesis CLI
  # ─────────────────────────────────────────────────────────────
  contract-conformance:
    name: "5. Contract Conformance (Staging)"
    runs-on: ubuntu-latest
    needs: deploy-staging
    env:
      HB_STAGING_URL: https://staging.handballtrack.app
      # PACT_BROKER_BASE_URL ativa PACT_PROVIDER_GATE — configura como secret após provisionar
      # o Pact Broker na VPS (infra/docker-compose.pact-broker.yml, ADR-025)
      PACT_BROKER_BASE_URL: ${{ vars.PACT_BROKER_BASE_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Sincronizar branch_ativo no SESSION_HANDOFF
        run: |
          CURRENT="${{ github.head_ref || github.ref_name }}"
          if [ -n "$CURRENT" ] && [ -f SESSION_HANDOFF.md ]; then
            sed -i "s|^branch_ativo:.*|branch_ativo: ${CURRENT}|" SESSION_HANDOFF.md
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install oasdiff
        run: |
          curl -fsSL https://github.com/oasdiff/oasdiff/releases/download/v1.12.3/oasdiff_1.12.3_linux_amd64.tar.gz -o "$RUNNER_TEMP/oasdiff.tar.gz"
          mkdir -p "$RUNNER_TEMP/oasdiff-extract"
          tar -xzf "$RUNNER_TEMP/oasdiff.tar.gz" -C "$RUNNER_TEMP/oasdiff-extract"
          install -m 0755 "$(find "$RUNNER_TEMP/oasdiff-extract" -type f -name oasdiff | head -n1)" "$RUNNER_TEMP/oasdiff"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Install Node dependencies
        run: npm ci
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Run HTTP_RUNTIME_CONTRACT_GATE e PACT_PROVIDER_GATE
        run: python3 scripts/contracts/validate/validate_contracts.py

  # ─────────────────────────────────────────────────────────────
  # ETAPA 6: Aprovação humana obrigatória antes de produção
  #          Configurar em: Settings → Environments → production
  #          → Required reviewers → adicionar responsável
  # ─────────────────────────────────────────────────────────────
  approve:
    name: "6. Aguardando aprovação humana"
    runs-on: ubuntu-latest
    needs: contract-conformance
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Aprovação concedida
        run: echo "✅ Deploy para produção aprovado por ${{ github.actor }}"

  # ─────────────────────────────────────────────────────────────
  # ETAPA 7: Deploy em produção após aprovação
  # ─────────────────────────────────────────────────────────────
  deploy-production:
    name: "7. Deploy → Production"
    runs-on: ubuntu-latest
    needs: approve
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render production .env from operational contract
        env:
          HB_ENV_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          HB_ENV_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          HB_ENV_POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          HB_ENV_JWT_PRIVATE_KEY: ${{ secrets.JWT_PRIVATE_KEY }}
          HB_ENV_JWT_PUBLIC_KEY: ${{ secrets.JWT_PUBLIC_KEY }}
          HB_ENV_CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          HB_ENV_CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          HB_ENV_CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          HB_ENV_CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
          HB_ENV_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          HB_ENV_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p .deploy
          bash scripts/deploy/inject_env.sh production .deploy/production.env "${{ needs.build.outputs.image_tag }}"
      - name: Sincronizar infra para o servidor production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/"
          target: /opt/hbtrack/production
      - name: Sincronizar .env renderizado para o servidor production
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: ".deploy/production.env"
          target: /opt/hbtrack/production
      - name: Deploy to production via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            mkdir -p /opt/hbtrack/production /opt/hbtrack/production/.deploy
            cd /opt/hbtrack/production
            # Salvar SHA anterior para rollback
            PREV_SHA=$(grep "^IMAGE_TAG=" .env | cut -d= -f2 || echo "")
            echo "$PREV_SHA" > .last_sha
            install -m 600 .deploy/production.env .env
            rm -f .deploy/production.env
            docker compose -f infra/docker-compose.prod.yml pull
            docker compose -f infra/docker-compose.prod.yml up -d --force-recreate
      - name: Health check — production
        id: healthcheck
        run: |
          echo "Aguardando produção inicializar..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ vars.PRODUCTION_URL }}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✅ Produção OK (tentativa $i)"
              exit 0
            fi
            echo "⏳ Tentativa $i/24 — HTTP $STATUS"
            sleep 5
          done
          echo "❌ Health check falhou — iniciando rollback"
          exit 1
      - name: Rollback automático em caso de falha
        if: failure() && steps.healthcheck.outcome == 'failure'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST_PRODUCTION }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/hbtrack/production
            PREV_SHA=$(cat .last_sha 2>/dev/null || echo "")
            if [ -n "$PREV_SHA" ]; then
              echo "⏪ Rollback para SHA $PREV_SHA"
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=$PREV_SHA|" .env
              docker compose -f infra/docker-compose.prod.yml pull
              docker compose -f infra/docker-compose.prod.yml up -d --force-recreate
            else
              echo "⚠️ Sem SHA anterior para rollback"
            fi
