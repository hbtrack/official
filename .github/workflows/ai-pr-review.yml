name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
      - develop
    paths:
      - 'docs/hbtrack/modulos/**/graph/**'
      - 'contracts/**'
      - '.contract_driven/**'
      - 'docs/_canon/**'
      - '.github/copilot-instructions.md'
      - '.github/workflows/**'
      - 'scripts/contracts/validate/**'
      - 'scripts/hb'
      - 'backend/**'
      - 'frontend/**'
      - 'apps/**'
      - 'api/**'
      - 'tests/**'

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gemini-review:
    name: Gemini Review (HB Track / inline-hybrid)
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      AI_REVIEW_CONFIG: .github/ai-review/config.yaml
      AI_REVIEW_MODEL_RESPONSE: gemini_response.json
      AI_REVIEW_PR_FILES: pr_files.json

    steps:
      - name: Validar secret
        run: |
          if [ -z "${GEMINI_API_KEY}" ]; then
            echo "::error::Secret GEMINI_API_KEY não configurado."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências do bridge
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Carregar configuração
        id: cfg
        run: |
          python - <<'PY'
          import os, yaml
          from pathlib import Path
          cfg = yaml.safe_load(Path('.github/ai-review/config.yaml').read_text(encoding='utf-8'))
          review = cfg.get('review', {})
          print(f"model={review.get('model','gemini-2.5-flash')}")
          print(f"temperature={review.get('temperature',0.2)}")
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"model={review.get('model','gemini-2.5-flash')}\n")
              fh.write(f"temperature={review.get('temperature',0.2)}\n")
          PY

      - name: Coletar arquivos alterados do PR
        id: files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const yaml = require('js-yaml');
            const cfg = yaml.load(fs.readFileSync('.github/ai-review/config.yaml', 'utf8'));
            const include = (cfg.paths && cfg.paths.include) || [];
            const exclude = (cfg.paths && cfg.paths.exclude) || [];

            function globToRegex(glob) {
              const s = glob
                .replace(/[.+^${}()|[\]\\]/g, '\\$&')
                .replace(/\*\*/g, '::DOUBLESTAR::')
                .replace(/\*/g, '[^/]*')
                .replace(/::DOUBLESTAR::/g, '.*');
              return new RegExp('^' + s + '$');
            }

            const includeRx = include.map(globToRegex);
            const excludeRx = exclude.map(globToRegex);

            const pr = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const allFiles = await github.paginate(
              github.rest.pulls.listFiles,
              { owner, repo, pull_number: pr, per_page: 100 }
            );

            const selected = allFiles.filter(f => {
              const filename = f.filename;
              const ok = includeRx.some(rx => rx.test(filename));
              const no = excludeRx.some(rx => rx.test(filename));
              return ok && !no;
            }).slice(0, Number(cfg.review?.max_files || 20));

            fs.writeFileSync('pr_files.json', JSON.stringify(selected.map(f => ({
              filename: f.filename,
              status: f.status,
              additions: f.additions,
              deletions: f.deletions,
              changes: f.changes,
              patch: f.patch || ''
            })), null, 2));

            core.setOutput('count', String(selected.length));

      - name: Encerrar sem review se não houver arquivos relevantes
        if: steps.files.outputs.count == '0'
        run: echo "Nenhum arquivo relevante para revisão semântica."

      - name: Preparar contexto do repositório
        if: steps.files.outputs.count != '0'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = json.loads(Path('pr_files.json').read_text(encoding='utf-8'))
          styleguide = Path('.github/ai-review/styleguide.md').read_text(encoding='utf-8')

          context_files = [
              'README.md',
              'SESSION_HANDOFF.md',
              '.github/copilot-instructions.md',
              'docs/_canon/AGENT_INSTRUCTIONS.md',
              'docs/_canon/CONTRACT_PIPELINE.md',
              'docs/_canon/gates/GATES_REGISTRY.yaml',
              '.contract_driven/CONTRACT_SYSTEM_RULES.md',
          ]

          repo_context = {}
          for file in context_files:
              p = Path(file)
              if p.exists() and p.is_file():
                  repo_context[file] = p.read_text(encoding='utf-8')[:14000]

          payload = {
              'styleguide': styleguide,
              'repo_context': repo_context,
              'changed_files': files,
              'instructions': (
                  'Revise apenas com base no diff e no contexto fornecido. '
                  'Retorne JSON válido conforme o formato obrigatório do styleguide.'
              )
          }
          Path('review_input.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Chamar Gemini
        if: steps.files.outputs.count != '0'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('review_input.json').read_text(encoding='utf-8'))
          body = {
            'contents': [
              {
                'role': 'user',
                'parts': [
                  { 'text': json.dumps(payload, ensure_ascii=False) }
                ]
              }
            ],
            'generationConfig': {
              'temperature': float('${{ steps.cfg.outputs.temperature }}'),
              'maxOutputTokens': 4096
            }
          }
          Path('gemini_request.json').write_text(json.dumps(body, ensure_ascii=False), encoding='utf-8')
          PY

          curl -sS -X POST \
            -H "Content-Type: application/json" \
            "https://generativelanguage.googleapis.com/v1beta/models/${{ steps.cfg.outputs.model }}:generateContent?key=${GEMINI_API_KEY}" \
            -d @gemini_request.json \
            > gemini_response.json

      - name: Processar resposta e gerar comentários inline
        if: steps.files.outputs.count != '0'
        run: |
          python scripts/ai_review_bridge.py

      - name: Publicar review híbrido
        if: steps.files.outputs.count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('ai_review_summary.md', 'utf8');
            const findings = JSON.parse(fs.readFileSync('ai_review_findings.json', 'utf8'));
            const pr = context.payload.pull_request.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const commit_id = context.payload.pull_request.head.sha;

            await github.rest.pulls.createReview({
              owner,
              repo,
              pull_number: pr,
              commit_id,
              event: 'COMMENT',
              body: summary,
              comments: findings.comments || []
            });

      - name: Resumo
        if: always()
        run: echo "AI PR Review finalizado."
