# HB Track — Redocly CLI Configuration
# Gate: OPENAPI_ROOT_STRUCTURE_GATE (CI_CONTRACT_GATES.md §9.6)
#
# Instalar: npm install -g @redocly/cli
# Executar: redocly lint contracts/openapi/openapi.yaml
#
# Referências normativas:
#   .contract_driven/CONTRACT_SYSTEM_LAYOUT.md §4 (contracts/openapi/)
#   docs/_canon/CI_CONTRACT_GATES.md §9.5

apis:
  main@v0.1.0:
    root: contracts/openapi/openapi.yaml

rules:
  # Estrutura obrigatória
  info-license: error
  no-invalid-media-type-examples: error
  no-unresolved-refs: error

  # operationId
  operation-operationId: error
  operation-operationId-unique: error
  operation-operationId-url-safe: error

  # Descrições
  operation-description: error
  operation-summary: error
  tag-description: error
  no-empty-servers: error

  # Segurança
  # Validado no root (openapi.yaml define securitySchemes.HTTPBearer);
  # path files são sempre referenciados pelo root e não declaram securitySchemes.
  security-defined: error

  # Schema
  no-invalid-schema-examples: error
  # scalar-property-missing-example: off — DECISÃO DELIBERADA (não promover).
  # Regra exige `example:` em toda propriedade escalar (string, integer, etc.).
  # Custo: ~milhares de violations no openapi.yaml. Benefício marginal (exemplos
  # podem ser definidos no nível do schema/parent). Manter `off` até que haja
  # decisão de produto sobre obrigar exemplos em todo campo.
  scalar-property-missing-example: off

  # Path
  path-not-include-query: error
  path-parameters-defined: error
  no-path-trailing-slash: error

  # Compatibilidade OpenAPI 3.1
  struct: error
  spec-components-invalid-map-name: error

theme:
  openapi:
    disableSearch: false
    expandDefaultServerVariables: true
