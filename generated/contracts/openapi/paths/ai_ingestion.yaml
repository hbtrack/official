# ============================================================
# Module: ai_ingestion — OpenAPI path items
# Source of truth: contracts/openapi/openapi.yaml
# Docs: docs/hbtrack/modulos/ai_ingestion/MODULE_SCOPE_AI_INGESTION.md
# Source graph: docs/hbtrack/modulos/ai_ingestion/graph/module_manifest.yaml
# Domain rules: DR-ING-001..005
# Invariants: INV-ING-001..005
# ADR refs: ADR-007 (JWT), ADR-008 (RBAC), ADR-031 (stack)
# ============================================================

/ingestion/jobs:
  get:
    tags:
      - ai_ingestion
    summary: Lista jobs de ingestão
    description: >
      Retorna lista paginada de jobs de ingestão de dados externos.
      ai_ingestion é soberano do intake: fonte, modo, schema de entrada,
      mapeamento explícito, binding de execução e idempotência (DR-ING-001).

      Filtros por sourceLabel, ingestionMode e statusLabel.
      OWASP API4:2023: pageSize máximo 100.

      Acesso: apenas admin e coordinator (dados de integração operacional).
    operationId: listIngestionJobs
    security:
      - HTTPBearer: []
    parameters:
      - name: sourceLabel
        in: query
        required: false
        schema:
          type: string
          maxLength: 120
        description: Filtra por label da fonte de dados externa.
      - name: ingestionMode
        in: query
        required: false
        schema:
          type: string
          maxLength: 40
        description: "Filtra por modo de ingestão (batch, webhook, file-drop)."
      - name: statusLabel
        in: query
        required: false
        schema:
          type: string
          enum:
            - queued
            - processing
            - completed
            - failed
        description: Filtra pelo status do ciclo de vida do job.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Número da página (base 1).
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
        description: Itens por página (máx 100).
    responses:
      "200":
        description: Lista paginada de jobs de ingestão.
        content:
          application/json:
            schema:
              type: object
              required:
                - data
                - page
                - pageSize
                - total
              properties:
                data:
                  type: array
                  items:
                    $ref: "../components/schemas/ai_ingestion/ingestion_job.yaml"
                page:
                  type: integer
                  minimum: 1
                pageSize:
                  type: integer
                  minimum: 1
                total:
                  type: integer
                  minimum: 0
              additionalProperties: false
              description: Itens de `data` projetam diretamente o schema soberano `ingestion_job.schema.json`.
      "401":
        description: Token ausente ou expirado (ADR-007).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "403":
        description: Papel RBAC insuficiente — requer admin ou coordinator (ADR-008).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
  post:
    tags:
      - ai_ingestion
    summary: Cria job de ingestão
    description: >
      Cria e enfileira um novo job de ingestão de dados externos.
      ai_ingestion é soberano do intake de dados: fonte, modo de ingestão,
      schema de entrada, mapeamento explícito, binding e idempotência
      (DR-ING-001).

      Normalização automatizada exige `payloadSchemaRef` e `mappingProfile`
      explícitos — parser implícito e transformação silenciosa são proibidos
      (DR-ING-002 / INV-ING-003).

      `idempotencyKey` é o mecanismo canônico para replay seguro e
      deduplicação (DR-ING-004 / INV-ING-004). Enviar o mesmo
      `idempotencyKey` retorna 200 com o job original (idempotente).

      Após normalização, a soberania do dado pertence ao módulo de destino
      (DR-ING-005 / INV-ING-005).

      Pós-condições:
      - Job criado com statusLabel=queued
      - Evento ai_ingestion.job.queued publicado via AsyncAPI

      Acesso: apenas admin e coordinator (ADR-008 RBAC).
    operationId: createIngestionJob
    security:
      - HTTPBearer: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              - sourceLabel
              - ingestionMode
            properties:
              sourceLabel:
                type: string
                minLength: 1
                maxLength: 120
                description: "Label da fonte de dados externa (INV-ING-001). Ex: external-handball-feed."
              ingestionMode:
                type: string
                minLength: 1
                maxLength: 40
                description: >
                  Modo de ingestão (INV-ING-001). Exemplos: batch, webhook, file-drop.
                  Ingestão com normalização automatizada exige payloadSchemaRef +
                  mappingProfile explícitos (INV-ING-003 / DR-ING-002).
              payloadSchemaRef:
                type:
                  - string
                  - "null"
                maxLength: 255
                description: >
                  Referência ao schema de payload de entrada (DR-ING-002).
                  Obrigatório quando ingestionMode envolve normalização automatizada
                  (INV-ING-003).
              mappingProfile:
                type:
                  - string
                  - "null"
                maxLength: 120
                description: >
                  Perfil de mapeamento de campos externos para domínio interno
                  (DR-ING-002 / INV-ING-003).
                  Proibida transformação silenciosa sem mapeamento explícito.
              idempotencyKey:
                type:
                  - string
                  - "null"
                maxLength: 120
                description: >
                  Chave de idempotência para replay seguro e deduplicação
                  (DR-ING-004 / INV-ING-004).
                  Fatos sujeitos a replay ou redelivery DEVEM portar idempotencyKey
                  estável.
              executionBindingLabel:
                type:
                  - string
                  - "null"
                maxLength: 80
                description: >
                  Label do binding de execução (ex: celery-import, webhook-processor).
                  DR-ING-001: binding explícito obrigatório para intake soberano.
            additionalProperties: false
    responses:
      "202":
        description: Job aceito e enfileirado (statusLabel=queued).
        content:
          application/json:
            schema:
              $ref: "../components/schemas/ai_ingestion/ingestion_job.yaml"
      "400":
        description: >
          Requisição inválida. Causas: sourceLabel ausente; ingestionMode ausente;
          ingestionMode com normalização sem payloadSchemaRef/mappingProfile
          (INV-ING-003).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "401":
        description: Token ausente ou expirado (ADR-007).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "403":
        description: Papel RBAC insuficiente — requer admin ou coordinator (ADR-008).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "409":
        description: >
          idempotencyKey já existe — retorna o job original sem reprocessar
          (DR-ING-004 idempotência).
        content:
          application/json:
            schema:
              $ref: "../components/schemas/ai_ingestion/ingestion_job.yaml"
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
/ingestion/jobs/{jobId}:
  get:
    tags:
      - ai_ingestion
    summary: Obtém job de ingestão por ID
    description: >
      Retorna dados completos de um job de ingestão, incluindo timestamps de
      causalidade (DR-ING-003 — receivedAt ≠ completedAt).

      Acesso: apenas admin e coordinator (ADR-008).
    operationId: getIngestionJob
    security:
      - HTTPBearer: []
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID do job de ingestão.
    responses:
      "200":
        description: Job encontrado.
        content:
          application/json:
            schema:
              $ref: "../components/schemas/ai_ingestion/ingestion_job.yaml"
      "401":
        description: Token ausente ou expirado (ADR-007).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "403":
        description: Papel RBAC insuficiente (ADR-008).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "404":
        description: Job não encontrado.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
/ingestion/jobs/{jobId}/retry:
  post:
    tags:
      - ai_ingestion
    summary: Reprocessa job de ingestão falho
    description: >
      Reenfileira um job com statusLabel=failed para reprocessamento.
      DR-ING-004: idempotencyKey garante replay seguro e deduplicação.
      INV-ING-004: o job original é preservado; um novo job de retry é
      criado com referência ao jobId original.

      Pós-condições:
      - Novo job criado com statusLabel=queued, referenciando o job original
      - Evento ai_ingestion.job.queued publicado via AsyncAPI

      Acesso: apenas admin e coordinator (ADR-008 RBAC).
    operationId: retryIngestionJob
    security:
      - HTTPBearer: []
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: UUID do job falho a reprocessar.
    responses:
      "202":
        description: Job de retry aceito e enfileirado (statusLabel=queued).
        content:
          application/json:
            schema:
              $ref: "../components/schemas/ai_ingestion/ingestion_job.yaml"
      "400":
        description: Job não está no estado failed — retry não permitido.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "401":
        description: Token ausente ou expirado (ADR-007).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "403":
        description: Papel RBAC insuficiente (ADR-008).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "404":
        description: Job não encontrado.
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "500":
        description: Internal server error
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "409":
        description: Conflict with current resource state, uniqueness constraint, referential integrity, or concurrent update
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
