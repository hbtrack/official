# AsyncAPI Message: session_revoked
# Module: identity_access
# Domain rules: DR-IAM-001, DR-IAM-004, DR-IAM-005
# Decisions: DEC-IAM-002=B (Redis denylist), DEC-IAM-003=C

name: SessionRevokedMessage
title: Sessão Revogada
summary: Publicado quando uma sessão autenticada é encerrada ou revogada (DR-IAM-004, DEC-IAM-002).
description: >
  Evento emitido pelo módulo identity_access após logout (POST /auth/logout),
  revogação administrativa (DELETE /auth/sessions/{sessionId}), ou invalidação
  via Redis denylist (DEC-IAM-002=B).
  revokedAt e revokedByUserId identificam quem e quando revogou.
  BOUNDARY: payload não expõe refreshToken nem credenciais (INV-IAM-004).
contentType: application/json
payload:
  $ref: "../components/schemas/session_revoked_payload.yaml"
