# AsyncAPI Message: role_revoked
# Module: identity_access
# Domain rules: DR-IAM-001, DR-IAM-003, DR-IAM-005
# Decisions: DEC-IAM-003=C
# ADR refs: ADR-008

messageId: role_revoked
name: RoleRevokedMessage
title: Role Revogado
summary: Publicado quando um role RBAC é removido de um usuário (ADR-008, DEC-IAM-003).
description: >
  Evento emitido pelo módulo identity_access após revogação de role (operationId: revokeRole).
  revokedByUserId identifica quem removeu o role (rastreabilidade de compliance).
  identity_access é o único soberano desta operação — nunca delegada a users, teams
  ou módulos operacionais (DR-IAM-005).
contentType: application/json
payload:
  $ref: "../components/schemas/role_revoked_payload.yaml"
