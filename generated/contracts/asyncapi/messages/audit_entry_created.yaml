messageId: audit_entry_created
name: AuditEntryCreatedMessage
title: Entrada de Auditoria Criada
summary: Publicado quando uma nova entrada é registrada no trilho de auditoria (INV-AUD-002).
description: >
  Evento emitido pelo módulo audit após registro bem-sucedido via POST /audit/entries
  ou por geração interna (ex.: audit.export_requested).
  Consumidores (ex.: notifications, analytics) usam este evento para downstream sync.

  BOUNDARY:
  - payload nunca contém token de autenticação, senha ou refresh_token
  - beforeSummary/afterSummary são resumos saneados, não payloads integrais (INV-AUD-004)
  - não duplica estado de domínio dos módulos de origem (DR-AUD-004)
contentType: application/json
payload:
