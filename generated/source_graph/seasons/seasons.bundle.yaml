    sovereign_fields:
    - name: id
      runtime_name: id
      required: true
      type: uuid_v4
    - name: organizationId
      runtime_name: organization_id
      required: false
      type: uuid_v4
      constraints:
      - 'boundary: reference to identity_access module'
    - name: name
      runtime_name: name
      required: true
      type: string
      constraints:
      - 'maxLength: 120'
      - 'minLength: 1'
    - name: sportCycleLabel
      runtime_name: sport_cycle_label
      required: false
      type: string
    - name: statusLabel
      runtime_name: status_label
      required: true
      type: enum
      values:
      - DRAFT
      - ACTIVE
      - ARCHIVED
    - name: startDate
      runtime_name: start_date
      required: true
      type: date
    - name: endDate
      runtime_name: end_date
      required: true
      type: date
      constraints:
      - 'INV-SEAS-002: startDate <= endDate'
    - name: phaseLabels
      runtime_name: phase_labels
      required: true
      type: array_of_string
      constraints:
      - 'INV-SEAS-003: uniqueItems'
    - name: competitionIds
      runtime_name: competition_ids
      required: true
      type: array_of_uuid
      constraints:
      - 'INV-SEAS-003: uniqueItems'
      - 'boundary: reference to competitions module'
    - name: teamIds
