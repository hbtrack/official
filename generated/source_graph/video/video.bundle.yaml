    \ de dom\xEDnio soberanas nesta fase."
  - "patchSession cobre m\xFAltiplas transi\xE7\xF5es de estado (DR-VID-002, INV-VID-002)\
    \ \u2014 transi\xE7\xF5es validadas por state_machine.py."
