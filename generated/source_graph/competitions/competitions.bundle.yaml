  http_status: 400
  source_ref: ../../../../../src/competitions/domain/entities.py#validate_invariants
  operations:
  - createCompetition
  - patchCompetition
- id: ERR-COMP-400-INVALID-STATUS-TRANSITION
  kind: domain
  http_status: 400
  exception_ref: ../../../../../src/competitions/domain/rules.py#InvalidStatusTransition
  notes:
  - "InvalidStatusTransition \xE9 capturado junto com ValueError e emite HTTP 400\
    \ (n\xE3o 422) \u2014 verificado em api.py#patch_competition: except (ValueError,\
    \ InvalidStatusTransition)"
  operations:
