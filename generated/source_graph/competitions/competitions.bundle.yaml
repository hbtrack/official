errors:
- id: ERR-COMP-401-UNAUTHENTICATED
  kind: transport
  http_status: 401
  source_ref: ../../../../../src/competitions/api.py#_role
  operations:
  - listCompetitions
  - createCompetition
  - getCompetition
  - patchCompetition
  - registerTeamInCompetition
  - unregisterTeamFromCompetition
- id: ERR-COMP-403-INSUFFICIENT-PRIVILEGE
  kind: domain
  http_status: 403
  exception_ref: ../../../../../src/competitions/domain/rules.py#InsufficientPrivilege
  operations:
  - listCompetitions
  - createCompetition
  - getCompetition
  - patchCompetition
  - registerTeamInCompetition
  - unregisterTeamFromCompetition
- id: ERR-COMP-404-NOT-FOUND
  kind: domain
  http_status: 404
  exception_ref: ../../../../../src/competitions/domain/rules.py#CompetitionNotFound
  operations:
  - getCompetition
  - patchCompetition
  - registerTeamInCompetition
