    - name: mfaRequired
      runtime_name: mfa_required
      required: false
      type: boolean
      constraints:
      - 'nullable: true'
      - "DR-IAM-004: ciclo de vida da sess\xE3o rastre\xE1vel"
    - name: mfaSatisfied
      runtime_name: mfa_satisfied
      required: false
      type: boolean
      constraints:
      - 'nullable: true'
      - "DR-IAM-004: somente v\xE1lido se mfaRequired=true"
    - name: issuedAt
      runtime_name: issued_at
      required: false
      type: datetime_utc
      constraints:
      - 'nullable: true'
      - 'INV-IAM-003: issuedAt < expiresAt quando ambos presentes'
    - name: expiresAt
      runtime_name: expires_at
      required: false
      type: datetime_utc
      constraints:
      - 'nullable: true'
      - 'INV-IAM-003: expiresAt > issuedAt'
    - name: revokedAt
      runtime_name: revoked_at
      required: false
      type: datetime_utc
      constraints:
      - 'nullable: true'
      - 'INV-IAM-003: revokedAt >= issuedAt quando presente'
      - "DR-IAM-005: revoga\xE7\xE3o somente via identity_access"
