      production: "/opt/hbtrack/production/.env"
    rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
    rotation_command_ref: "scripts/ops/rotate_keys.sh"
    rotation_period_days: 90
    rotation_actor: "maintainer_operations"
    rotate_on:
      - "credential_leak"
      - "provider_rotation"

  - name: GEMINI_API_KEY
    category: external_provider
    storage_modes:
      staging: "/opt/hbtrack/staging/.env"
      production: "/opt/hbtrack/production/.env"
    rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
    rotation_command_ref: "scripts/ops/rotate_keys.sh"
    rotation_period_days: 90
    rotation_actor: "maintainer_operations"
    rotate_on:
