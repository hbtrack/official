version: "1.2.0"
artifact: "OPS_SECRETS_CATALOG"
status: active
scope: operations

github_actions:
  secrets:
    - name: GITHUB_TOKEN
      kind: github_builtin
      workflows:
        - ".github/workflows/deploy.yml"
      notes: "Usado para push/pull no GHCR durante build e deploy."

    - name: VPS_HOST_STAGING
      kind: ssh_target
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"

    - name: VPS_HOST_PRODUCTION
      kind: ssh_target
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "production"

    - name: VPS_USER
      kind: ssh_credential
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "maintainer_offboarding"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: VPS_SSH_KEY
      kind: ssh_private_key
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "maintainer_offboarding"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: SECRET_KEY
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 180
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "application_compromise"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: DB_PASSWORD
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "maintainer_offboarding"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: POSTGRES_PASSWORD
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      notes: "Opcional no GitHub Environment; se ausente, o renderer deriva de DB_PASSWORD."
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "maintainer_offboarding"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: JWT_PRIVATE_KEY
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "jwt_rotation_window"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: JWT_PUBLIC_KEY
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "jwt_rotation_window"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: CLOUDINARY_CLOUD_NAME
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 365
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "provider_migration"
        - "credential_leak"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: CLOUDINARY_API_KEY
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "provider_rotation"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: CLOUDINARY_API_SECRET
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "provider_rotation"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: CLOUDINARY_URL
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      notes: "Opcional no GitHub Environment; se ausente, o renderer deriva de CLOUDINARY_API_KEY + CLOUDINARY_API_SECRET + CLOUDINARY_CLOUD_NAME."
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "provider_rotation"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: RESEND_API_KEY
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "provider_rotation"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: GEMINI_API_KEY
      kind: runtime_environment_secret
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"
        - "production"
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "provider_rotation"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

    - name: PACT_BROKER_TOKEN
      kind: contract_broker_credential
      workflows: []
      environments:
        - "staging"
        - "production"
      notes: "Ainda nao consumido no workflow versionado; obrigatorio quando o Pact Broker for autenticado."
      rotation_period_days: 90
      rotation_actor: "maintainer_operations"
      rotate_on:
        - "credential_leak"
        - "broker_rotation"
      rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
      rotation_command_ref: "scripts/ops/rotate_keys.sh"

  variables:
    - name: STAGING_URL
      kind: github_environment_variable
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "staging"

    - name: PRODUCTION_URL
      kind: github_environment_variable
      workflows:
        - ".github/workflows/deploy.yml"
      environments:
        - "production"

runtime_secrets:
  - name: SECRET_KEY
    category: django
    storage_modes:
      development: ".env gitignored"
      staging: "/opt/hbtrack/staging/.env"
      production: "/opt/hbtrack/production/.env"
    rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
    rotation_command_ref: "scripts/ops/rotate_keys.sh"
    rotation_period_days: 180
    rotation_actor: "maintainer_operations"
    rotate_on:
      - "credential_leak"
      - "application_compromise"

  - name: DB_PASSWORD
    category: database
    storage_modes:
      development: ".env gitignored"
      staging: "/opt/hbtrack/staging/.env"
      production: "/opt/hbtrack/production/.env"
    rotation_ref: "docs/_canon/decisions/ADR-012-secrets-policy.md"
    rotation_command_ref: "scripts/ops/rotate_keys.sh"
    rotation_period_days: 90
    rotation_actor: "maintainer_operations"
    rotate_on:
