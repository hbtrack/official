          - name: DB_TEST_NAME
            value: "hb_track_test"

      - title: "Database (PostgreSQL container)"
        comment_lines:
          - "Deve ser idêntico a DB_NAME / DB_USER / DB_PASSWORD acima"
        entries:
          - name: POSTGRES_DB
            value: "hb_track"
          - name: POSTGRES_USER
