version: "1.0.0"
artifact: "SOURCE_AUTHORITY_GRAPH"
status: "active"
scope: "global"

policy:
  objective: >
    Declarar, por conceito crítico, qual artefato é o owner_source soberano,
    qual classificação o conceito possui no sistema e como conflitos de autoridade
    devem ser resolvidos sem inferência livre do agente.

  classification_vocab:
    sovereign: "Define a regra primária do conceito; conflito abaixo deste nível bloqueia."
    derived: "Artefato gerado ou relatório derivado; nunca redefine regra soberana."
    bridge: "Ponte operacional para agentes/humanos; só pode repetir regras ativas."
    runtime_extension: "Estado ou evidência produzida em execução; depende de fonte soberana prévia."

  conflict_resolution:
    precedence_order:
      - "enforcement_executable"
      - "active_schemas"
      - "source_authority_graph"
      - "concept_owner_source"
      - "bridge_docs"
      - "derived_artifacts"
      - "legacy_or_study"
    partial_update_policy: "blocked"
    prompt_override_policy: "forbidden"
    conflict_rule: >
      Em qualquer divergência, vence o nível mais alto da precedence_order.
      Se o owner_source do conceito não estiver alinhado com seus consumers críticos,
      a mudança deve bloquear até revalidação completa.

concepts:
  source_authority_governance:
    owner_source: "docs/_canon/SOURCE_AUTHORITY_GRAPH.yaml"
    classification: sovereign
    artifacts:
      - "docs/_canon/SOURCE_AUTHORITY_GRAPH.yaml"
    consumers:
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "docs/_canon/CONTRACT_PIPELINE.md"
