    blocking_codes:
      [
        READINESS_HUMAN_CONFIRMATION_REQUIRED,
        READINESS_CONFIRMATION_INVALID,
        READINESS_CONFIRMATION_INCOHERENT,
      ]
    skip_allowed_in_ci: true
    status: active
    implemented_in: scripts/contracts/validate/validate_contracts.py
    skip_allowed_in_ci: true

  - gate_id: FEATURE_COVERAGE_GATE
    order: "20H"
    name: "Feature Coverage Gate"
    blocking: true
    active_stage: registry_coherence
    severity: HIGH
    parallelizable: false
    applies_when: always
    depends_on: [ MODULE_REGISTRY_GATE, FEATURE_READINESS_GATE ]
    description: >
      FASE 6 — Garante rastreabilidade completa: todo módulo com status
      `implemented` no MODULE_REGISTRY deve ter ao menos uma feature com status
      `implemented` no FEATURE_REGISTRY. Implementa a regra incondicional
      definida em MODULE_REGISTRY.yaml status_semantics.implemented. Bloqueia se
