  - gate_id: CODEGEN_REPRODUCIBILITY_GATE
    order: "15R"
    name: "Codegen Reproducibility Gate"
    blocking: true
    active_stage: pre_generate
    severity: CRITICAL
    parallelizable: true
    applies_when: always
    depends_on: [ DERIVED_DRIFT_GATE ]
    description: >
      Fase C3: Verifica que geradores produzem outputs deterministicamente
      reproduzíveis.

      Mecanismo: cada gerador emite `.lock.json` ao lado dos artefatos com: -
      input_hash (SHA-256 dos inputs) - output_hash (SHA-256 dos outputs) -
      generator_version - timestamp_utc

      Gate recalcula input_hash e compara com .lock.json. Se bate, output é
      confiável (opcional: skip regeneração em CI se não houver mudança de
      inputs — otimização). Se não bate, roda gerador e compara hashes;
      divergência é FAIL.

      Cobertura: compile_source_graph.py, backend_codegen.py,
      frontend_contract_codegen.py, db_projection_codegen.py, test_codegen.py.
    blocking_codes: [ CODEGEN_NOT_REPRODUCIBLE ]
    status: active
    integrated_in_validate_contracts: false
    enhancement_notes: "Implementar lock.json em cada gerador (todos v0.1+). Gate será integrado no executor quando .lock.json for emitido pelos geradores (v0.2+)."
