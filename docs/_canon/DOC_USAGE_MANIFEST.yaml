    consumers:
      - "scripts/audit/check_architecture_docs.py"
      - "scripts/contracts/validate/validate_contracts.py"
      - "docs/_canon/ARCHITECTURE.md"
    freshness_mode: runtime_audited
    update_triggers:
      - "scripts/audit/"
      - "config/"
      - "infra/"
      - "src/"

  - rule_id: CANON_ADR_BACKED_POLICIES
    class: canon_policy
    paths:
      - "docs/_canon/CODE_ARCHITECTURE.md"
      - "docs/_canon/DATA_MIGRATION_POLICY.md"
      - "docs/_canon/FRONTEND_CONTRACT.md"
