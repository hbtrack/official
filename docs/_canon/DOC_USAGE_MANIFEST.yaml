version: "1.0.0"
last_reviewed: "2026-04-01"

scope:
  include:
    - "docs/_canon/**/*.md"
    - "docs/_canon/**/*.yaml"
    - "docs/hbtrack/modulos/**/*.md"
    - "docs/hbtrack/modulos/**/*.yaml"
  exclude: []

entries:
  - rule_id: CANON_TEMPLATE_GLOBALS
    class: canon_global
    paths:
      - "docs/_canon/README.md"
      - "docs/_canon/SYSTEM_SCOPE.md"
      - "docs/_canon/ARCHITECTURE.md"
      - "docs/_canon/C4_CONTEXT.md"
      - "docs/_canon/C4_CONTAINERS.md"
      - "docs/_canon/MODULE_MAP.md"
      - "docs/_canon/GLOBAL_INVARIANTS.md"
      - "docs/_canon/SECURITY_RULES.md"
      - "docs/_canon/DATA_CONVENTIONS.md"
      - "docs/_canon/CI_CONTRACT_GATES.md"
      - "docs/_canon/TEST_STRATEGY.md"
      - "docs/_canon/CHANGE_POLICY.md"
      - "docs/_canon/DOMAIN_GLOSSARY.md"
      - "docs/_canon/HANDBALL_RULES_DOMAIN.md"
    owner_source: ".contract_driven/templates/globais/"
    consumers:
      - ".contract_driven/BOOT_PROFILES.yaml"
      - ".contract_driven/CONTRACT_SYSTEM_RULES.md"
      - "scripts/contracts/validate/validate_contracts.py"
    freshness_mode: template_parity
    update_triggers:
      - ".contract_driven/templates/globais/"
      - ".contract_driven/GLOBAL_TEMPLATES.md"

  - rule_id: CANON_CONTRACT_DRIVEN_GOVERNANCE
    class: canon_governance
    paths:
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "docs/_canon/CONTRACT_PIPELINE.md"
      - "docs/_canon/DECISION_POLICY.md"
      - "docs/_canon/ARCHITECTURE_DECISION_BACKLOG.md"
      - "docs/_canon/TOOLCHAIN_HEALTH_POLICY.md"
      - "docs/_canon/OPERATIONS.md"
      - "docs/_canon/SCOPE_BOUNDARY_POLICY.md"
      - "docs/_canon/SURVIVAL_SUITE_POLICY.md"
    owner_source: ".contract_driven/"
    consumers:
      - ".contract_driven/BOOT_PROFILES.yaml"
      - ".contract_driven/TASK_CATALOG.yaml"
      - "scripts/hb"
      - "scripts/contracts/validate/validate_contracts.py"
    freshness_mode: contract_driven_parity
    update_triggers:
      - ".contract_driven/BOOT_PROFILES.yaml"
      - ".contract_driven/TASK_CATALOG.yaml"
      - ".contract_driven/CONTRACT_SYSTEM_RULES.md"
      - "scripts/hb"
      - "docs/_canon/graph/ops/"

  - rule_id: CANON_RUNTIME_AUDITED_DOCS
    class: canon_runtime
    paths:
      - "docs/_canon/C4_COMPONENTS_BACKEND.md"
      - "docs/_canon/INTEGRATION_FLOWS.md"
      - "docs/_canon/RUNTIME_CURRENT_STATE.md"
