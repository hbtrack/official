    consumers:
      - "scripts/contracts/validate/validate_contracts.py"
      - "docs/_canon/ADR_INDEX.md"
      - "docs/_canon/ARCHITECTURE.md"
    freshness_mode: adr_bound
    update_triggers:
      - "docs/_canon/decisions/ADR-026-*.md"
      - "docs/_canon/decisions/ADR-027-*.md"
      - "docs/_canon/decisions/ADR-028-*.md"
      - "docs/_canon/decisions/ADR-029-*.md"
      - "docs/_canon/decisions/ADR-030-*.md"

