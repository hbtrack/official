    endpoints:
      - GET /ingestion/jobs
      - POST /ingestion/jobs
      - GET /ingestion/jobs/{jobId}
      - POST /ingestion/jobs/{jobId}/retry
    status: implemented
    contracts:
      - contracts/openapi/paths/ai_ingestion.yaml

