# -------------------------------------------------------------------------
# FEATURE_REGISTRY.yaml
# Registro intermediário de funcionalidades: entre módulo (alto nível) e
# endpoint (técnico). Cada feature representa valor entregue ao usuário.
#
# Status possíveis:
#   planned      — feature identificada, sem contrato ainda
#   in_contract  — contrato OpenAPI escrito, aguardando validação
#   validated    — contrato validado, pronto para implementação
#   implemented  — código implementado
#   released     — em produção
#
# Autoridade: docs/_canon/CI_CONTRACT_GATES.md
# Gate: FEATURE_READINESS_GATE
# -------------------------------------------------------------------------

version: "1.0.0"
last_updated: "2026-03-17"

features:
  # ------------------------------------------------------------------
  # MÓDULO: training
  # Status do módulo: implementation_ready
  # ------------------------------------------------------------------

  - id: FT-001
    name: "Criar e Listar Sessões de Treino"
    module: training
    description: >
      Treinador cria uma nova sessão de treino e consulta sessões existentes
      por data, time ou status.
    endpoints:
      - POST /training-sessions
      - GET /training-sessions
      - GET /training-sessions/{id}
      - PATCH /training-sessions/{id}
      - DELETE /training-sessions/{id}
    status: validated
    contracts:
      - contracts/openapi/paths/training.yaml

  - id: FT-002
    name: "Controlar Estado da Sessão de Treino"
    module: training
    description: >
      Treinador gerencia o ciclo de vida da sessão: publica para os atletas
      verem, inicia quando começa o treino, conclui ao terminar,
      cancela se necessário, e arquiva sessões antigas.
    endpoints:
      - POST /training-sessions/{id}/publish
      - POST /training-sessions/{id}/unpublish
      - POST /training-sessions/{id}/start
      - POST /training-sessions/{id}/complete
      - POST /training-sessions/{id}/cancel
      - POST /training-sessions/{id}/archive
    status: validated
    contracts:
      - contracts/openapi/paths/training.yaml

  - id: FT-003
    name: "Organizar Exercícios em Blocos na Sessão"
    module: training
    description: >
      Treinador divide a sessão em blocos (aquecimento, parte principal,
      volta à calma) e organiza exercícios dentro de cada bloco,
      podendo reordenar conforme necessário.
    endpoints:
      - GET /training-sessions/{id}/blocks
      - POST /training-sessions/{id}/blocks
      - GET /training-sessions/{id}/blocks/{blockId}
      - PATCH /training-sessions/{id}/blocks/{blockId}
      - DELETE /training-sessions/{id}/blocks/{blockId}
      - POST /training-sessions/{id}/blocks/reorder
    status: validated
    contracts:
      - contracts/openapi/paths/training.yaml

  - id: FT-004
    name: "Marcar Presença dos Atletas no Treino"
    module: training
    description: >
      Registrar quais atletas participaram de uma sessão de treino.
      Presença é um fato imutável registrado uma vez por atleta por sessão.
    endpoints:
      - GET /training-sessions/{id}/attendance
      - POST /training-sessions/{id}/attendance
    status: validated
    contracts:
      - contracts/openapi/paths/training.yaml

  - id: FT-005
    name: "Registrar Bem-estar do Atleta Antes e Depois do Treino"
    module: training
    description: >
      Atleta informa como se sente antes de treinar (bem-estar pré) e
      como se sentiu depois (bem-estar pós). Treinador consulta essas
      informações para ajustar a carga de treino.
    endpoints:
      - POST /training-sessions/{id}/wellness-pre
      - GET /training-sessions/{id}/wellness-pre/{athleteId}
      - PATCH /training-sessions/{id}/wellness-pre/{athleteId}
      - POST /training-sessions/{id}/wellness-post
      - GET /training-sessions/{id}/wellness-post/{athleteId}
      - PATCH /training-sessions/{id}/wellness-post/{athleteId}
    status: validated
    contracts:
      - contracts/openapi/paths/training.yaml

  - id: FT-006
    name: "Planejar Mesociclos e Microciclos de Treinamento"
    module: training
    description: >
      Treinador organiza o planejamento de longo prazo em mesociclos
      (blocos de semanas) e microciclos (semanas individuais), estruturando
      a periodização do treinamento.
    endpoints:
      - GET /mesocycles
      - POST /mesocycles
      - GET /mesocycles/{id}
      - PATCH /mesocycles/{id}
      - GET /microcycles
      - POST /microcycles
      - GET /microcycles/{id}
      - PATCH /microcycles/{id}
    status: validated
    contracts:
      - contracts/openapi/paths/training.yaml

  - id: FT-007
    name: "Registrar o que Foi Executado no Treino"
    module: training
    description: >
      Durante ou após a sessão, treinador registra o que foi efetivamente
      executado (cargas, séries, repetições) para comparar com o planejado.
    endpoints:
      - GET /training-sessions/{id}/execution-records
      - POST /training-sessions/{id}/execution-records
      - GET /training-sessions/{id}/execution-records/{recordId}
    status: validated
    contracts:
      - contracts/openapi/paths/training.yaml

  - id: FT-008
    name: "Feedback Técnico na Sessão de Treino"
    module: training
    description: >
      Treinador e atletas trocam feedback técnico sobre a sessão
      em threads de comentários vinculados diretamente ao treino.
    endpoints:
      - GET /training-sessions/{id}/feedback-threads
      - POST /training-sessions/{id}/feedback-threads
    status: validated
    contracts:
      - contracts/openapi/paths/training.yaml

  - id: FT-009
    name: "Definir e Acompanhar Objetivos da Sessão"
    module: training
    description: >
      Treinador define objetivos específicos para cada sessão de treino
      e acompanha se foram alcançados.
    endpoints:
      - GET /training-sessions/{id}/objectives
      - POST /training-sessions/{id}/objectives
    status: validated
    contracts:
      - contracts/openapi/paths/training.yaml

  - id: FT-010
    name: "Fila de Atenção do Treinador"
    module: training
    description: >
      Treinador visualiza uma fila priorizada de atletas ou itens que
      precisam de atenção especial durante ou após uma sessão.
    endpoints:
      - GET /training-sessions/{id}/attention-queue
    status: validated
    contracts:
      - contracts/openapi/paths/training.yaml

  # ------------------------------------------------------------------
  # MÓDULO: identity_access
  # Status do módulo: implementation_ready
  # ------------------------------------------------------------------

  - id: FT-011
    name: "Autenticação e Gerenciamento de Tokens"
    module: identity_access
    description: >
      Usuário autentica com email + senha, recebe JWT de acesso (RS256) e
      refresh token opaco. Pode renovar o par de tokens (rotação obrigatória
      OWASP API2:2023) e encerrar a própria sessão.
    endpoints:
      - POST /auth/login
      - POST /auth/logout
      - POST /auth/refresh
    status: implemented
    contracts:
      - contracts/openapi/paths/identity_access.yaml

  - id: FT-012
    name: "Gestão de Sessões Ativas"
    module: identity_access
    description: >
      Usuário consulta sua sessão ativa (claims técnicos, MFA, roles).
      Admin lista e revoga sessões de qualquer usuário — com controle BOLA
      e BFLA conforme OWASP API Security Top 10.
    endpoints:
      - GET /auth/me
      - GET /auth/sessions
      - DELETE /auth/sessions/{sessionId}
    status: implemented
    contracts:
      - contracts/openapi/paths/identity_access.yaml

  - id: FT-013
    name: "Gestão de Roles RBAC"
    module: identity_access
    description: >
      Admin gerencia o binding de roles RBAC canônicos (ADR-008):
      consulta, atribui e revoga roles de usuários. Proteção de invariante:
      o último admin da plataforma não pode ter o role revogado.
    endpoints:
      - GET /auth/users/{userId}/roles
      - POST /auth/users/{userId}/roles
      - DELETE /auth/users/{userId}/roles/{roleLabel}
    status: implemented
    contracts:
      - contracts/openapi/paths/identity_access.yaml

  # ------------------------------------------------------------------
  # MÓDULO: users
  # Status do módulo: implementation_ready
  # ------------------------------------------------------------------

  - id: FT-014
    name: "Listar Perfis de Usuário"
    module: users
    description: >
      Usuários autenticados (exceto member) consultam perfis cadastrados
      com paginação cursor-based. Coach filtra apenas membros do próprio
      time. Resultado filtrado por organizationId do JWT (BOLA / OWASP API4).
    endpoints:
      - GET /users
    status: implemented
    contracts:
      - contracts/openapi/paths/users.yaml

  - id: FT-015
    name: "Criar Perfil de Usuário"
    module: users
    description: >
      Admin e coordinator cadastram novos perfis de usuário na plataforma.
      Perfil criado com statusLabel=PENDING_ACTIVATION (DEC-USERS-002).
      Campos de autenticação nunca aceitos no payload (INV-USR-003).
    endpoints:
      - POST /users
    status: implemented
    contracts:
      - contracts/openapi/paths/users.yaml

  - id: FT-016
    name: "Consultar Perfil de Usuário"
    module: users
    description: >
      Owner sempre vê o próprio perfil; coach vê membros do seu time;
      admin e coordinator vêem qualquer perfil (BOLA — OWASP API1:2023).
      Sem exposição de campos de autenticação (INV-USR-003).
    endpoints:
      - GET /users/{userId}
    status: implemented
    contracts:
      - contracts/openapi/paths/users.yaml

  - id: FT-017
    name: "Atualizar Perfil de Usuário"
    module: users
    description: >
      Owner atualiza o próprio perfil (exceto roleLabel); admin e coordinator
      editam qualquer perfil e podem alterar roleLabel (PERM-USR-004).
      Alteração de roleLabel emite evento user.role_changed (DEC-USERS-001).
    endpoints:
      - PATCH /users/{userId}
    status: implemented
    contracts:
      - contracts/openapi/paths/users.yaml

  - id: FT-018
    name: "Listar Temporadas"
    module: seasons
    description: >
      Lista paginada de temporadas com filtro opcional por statusLabel.
      Dados públicos do contexto esportivo — todos os roles podem listar (PERM-SEA-003).
      OWASP API4:2023: pageSize máximo 100.
    endpoints:
      - GET /seasons
    status: implemented
    contracts:
      - contracts/openapi/paths/seasons.yaml

  - id: FT-019
    name: "Criar Temporada"
    module: seasons
    description: >
      Cria nova temporada com status inicial DRAFT.
      phaseLabels devem ser explícitos — não deduzidos de resultados (DR-SEAS-002).
      startDate <= endDate (INV-SEAS-002). Restrito a admin e coordinator.
    endpoints:
      - POST /seasons
    status: implemented
    contracts:
      - contracts/openapi/paths/seasons.yaml

  - id: FT-020
    name: "Obter Temporada"
    module: seasons
    description: >
      Retorna dados completos da temporada incluindo phaseLabels, teamIds e competitionIds.
      Dados públicos — todos os roles podem consultar (PERM-SEA-003).
    endpoints:
      - GET /seasons/{seasonId}
    status: implemented
    contracts:
      - contracts/openapi/paths/seasons.yaml

  - id: FT-021
    name: "Atualizar Temporada"
    module: seasons
    description: >
      Atualização parcial dos dados da temporada. Transição de status DRAFT→ACTIVE→ARCHIVED.
      Patches em temporadas ARCHIVED somente por admin (PERM-SEA-002).
      patchSeason: admin e coordinator.
    endpoints:
      - PATCH /seasons/{seasonId}
    status: implemented
    contracts:
      - contracts/openapi/paths/seasons.yaml

  - id: FT-022
    name: "Associar Equipe à Temporada"
    module: seasons
    description: >
      Registra vínculo explícito entre equipe e temporada (DR-SEAS-003).
      Duplicatas rejeitadas (INV-SEAS-003). Restrito a admin e coordinator.
    endpoints:
      - POST /seasons/{seasonId}/teams/{teamId}
    status: implemented
    contracts:
      - contracts/openapi/paths/seasons.yaml

  - id: FT-023
    name: "Remover Equipe da Temporada"
    module: seasons
    description: >
      Remove vínculo explícito entre equipe e temporada.
      Temporadas ACTIVE: somente admin pode remover (PERM-SEA-001).
      Restrito a admin e coordinator.
    endpoints:
      - DELETE /seasons/{seasonId}/teams/{teamId}
    status: implemented
    contracts:
      - contracts/openapi/paths/seasons.yaml
