  - id: FT-042
    name: "Gerenciar Intenções e Entregas de Notificação"
    module: notifications
    description: >
      Sistema registra intenções de notificação (push, email, in-app)
      e rastreia entregas. Usuário consulta o histórico de entregas
      recebidas.
    endpoints:
      - POST /notifications/intents
      - GET /notifications/deliveries
