  # Status do módulo: implemented
  # ------------------------------------------------------------------

  - id: FT-036
    name: "Registrar e Agregar Eventos de Scout"
    module: scout
    description: >
      Analista registra eventos técnico-táticos de partidas (gols,
      assistências, faltas, erros). Treinador consulta agregações
      estatísticas por atleta ou equipe.
    endpoints:
      - GET /scout/events
      - POST /scout/events
      - GET /scout/events/aggregations
    status: implemented
    contracts:
      - contracts/openapi/paths/scout.yaml

  # ------------------------------------------------------------------
  # MÓDULO: exercises
  # Status do módulo: implemented
  # ------------------------------------------------------------------

  - id: FT-037
    name: "Catalogar e Copiar Exercícios"
    module: exercises
    description: >
      Treinador cria e mantém catálogo de exercícios reutilizáveis,
      podendo copiar exercícios existentes para criar variações.
    endpoints:
      - GET /exercises
      - POST /exercises
      - GET /exercises/{id}
      - POST /exercises/{id}/copy
    status: implemented
    contracts:
      - contracts/openapi/paths/exercises.yaml

  # ------------------------------------------------------------------
  # MÓDULO: analytics
  # Status do módulo: implemented
  # ------------------------------------------------------------------

  - id: FT-038
    name: "Gerar e Consultar Snapshots Analíticos"
    module: analytics
    description: >
      Sistema gera e persiste snapshots de métricas de desempenho
      (carga, presença, bem-estar). Treinador consulta dashboards
      baseados nos snapshots.
    endpoints:
      - GET /analytics/snapshots
      - POST /analytics/snapshots
      - GET /analytics/dashboards
    status: implemented
    contracts:
      - contracts/openapi/paths/analytics.yaml

