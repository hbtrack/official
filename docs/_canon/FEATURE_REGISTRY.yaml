  - id: FT-043
    name: "Gerenciar Sessões e Segmentos de Vídeo"
    module: video
    description: >
      Analista e treinador criam sessões de vídeo vinculadas a partidas
      ou treinos, adicionando segmentos anotados para revisão técnica.
    endpoints:
      - GET /video/sessions
      - POST /video/sessions
      - GET /video/sessions/{sessionId}
