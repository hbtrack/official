  - id: FT-032
    name: "Registrar e Consultar Entradas de Bem-estar"
    module: wellness
    description: >
      Atleta registra entradas de bem-estar subjetivo (humor, carga
      percebida, qualidade do sono). Treinador e coordenador consultam
      entradas associadas aos atletas do time.
    endpoints:
      - GET /wellness/entries
      - POST /wellness/entries
      - GET /wellness/entries/{entryId}
    status: implemented
    contracts:
      - contracts/openapi/paths/wellness.yaml

  # ------------------------------------------------------------------
  # MÓDULO: medical
  # Status do módulo: implemented
  # ------------------------------------------------------------------

  - id: FT-033
    name: "Registrar e Consultar Prontuários Médicos"
    module: medical
    description: >
      Profissional de saúde registra e consulta prontuários médicos de
      atletas. Acesso restrito por RBAC (OWASP API1 + API5).
    endpoints:
      - GET /medical/records
      - POST /medical/records
      - GET /medical/records/{recordId}
    status: implemented
    contracts:
      - contracts/openapi/paths/medical.yaml

  # ------------------------------------------------------------------
  # MÓDULO: competitions
  # Status do módulo: implemented
  # ------------------------------------------------------------------

  - id: FT-034
    name: "Gerenciar Competições e Equipes Participantes"
    module: competitions
    description: >
      Admin e coordenador criam e gerenciam competições, registrando
      equipes participantes e seus dados de inscrição.
    endpoints:
      - GET /competitions
      - POST /competitions
      - GET /competitions/{competitionId}
      - POST /competitions/{competitionId}/teams/{teamId}
    status: implemented
    contracts:
      - contracts/openapi/paths/competitions.yaml

  # ------------------------------------------------------------------
  # MÓDULO: matches
  # Status do módulo: implemented
  # ------------------------------------------------------------------

  - id: FT-035
    name: "Agendar Partidas e Gerenciar Escalações"
    module: matches
    description: >
      Admin e coordenador agendam partidas entre equipes e registram
      as escalações (lineup) dos jogadores convocados.
    endpoints:
      - GET /matches
      - POST /matches
      - GET /matches/{matchId}
      - POST /matches/{matchId}/lineup/{userId}
    status: implemented
    contracts:
      - contracts/openapi/paths/matches.yaml

  # ------------------------------------------------------------------
