  - id: FT-041
    name: "Consultar e Exportar Trilha de Auditoria"
    module: audit
    description: >
      Admin consulta entradas da trilha de auditoria com filtros (ator,
      ação, módulo, intervalo de datas) e exporta para análise forense.
