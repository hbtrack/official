version: "1.0.0"
artifact: "MODULE_REGISTRY"
status: "active"
scope: "global"

policy:
  objective: >
    Declarar, de forma determinística, o status operacional de cada módulo canônico,
    suas superfícies contratuais esperadas e o owner responsável pela evolução.
  status_semantics:
    scaffold: "Estrutura mínima criada; ainda não pode ser tratada como base confiável para evolução contratual."
    draft_contract: "Artefatos mínimos existem, mas o módulo ainda admite lacunas contratuais ou ausência de superfícies reais."
    validated_contract: "Contratos e docs locais já passaram pelos gates aplicáveis e o módulo pode evoluir com evidência pré-contrato."
    implementation_ready: "Readiness máxima para materialização; exige pré-contrato e Decision IR conformante quando aplicável."
  surface_catalog:
    - module_docs_minimum
    - openapi_sync
    - json_schema
    - test_matrix
    - state_model
    - permissions
    - errors
    - sport_science
    - ui_contract
    - arazzo
    - asyncapi
    - decision_ir

modules:
  users:
    status: "draft_contract"
    owner: "platform-core"
    expected_surfaces: ["module_docs_minimum", "openapi_sync", "json_schema", "test_matrix"]
