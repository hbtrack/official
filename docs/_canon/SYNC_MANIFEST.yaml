      - "_reports/session_start.json"
      - "SESSION_HANDOFF.md"
      - "generated/contracts/schemas/shared/session_start.schema.json"
    validation_commands:
      - "python3 scripts/repair_manifests.py"
      - "python3 scripts/validate_contracts.py --profile ci"

