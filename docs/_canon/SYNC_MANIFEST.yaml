version: "1.0.0"
artifact: "SYNC_MANIFEST"
status: "active"
scope: "global"

policy:
  objective: >
    Declarar, por source_master soberano ativo, quais consumers obrigatórios
    devem ser atualizados em conjunto quando houver mudança normativa,
    estrutural ou de geração derivada.
  update_mode: "all_required_consumers_must_change_together"
  partial_update_policy: "blocked"
  missing_consumer_status: "FAIL"
  consumer_reference_modes:
    - "path"
    - "directory"
    - "glob"
  enforcement_targets:
    - "B6-002::IMPACT_ANALYSIS_GATE"
    - "B6-002::PARTIAL_UPDATE_GATE"

rules:
  - rule_id: SOURCE_AUTHORITY_GRAPH_SYNC
    source_master: "docs/_canon/SOURCE_AUTHORITY_GRAPH.yaml"
    source_kind: "canon_governance"
    change_types:
      - "precedence_change"
      - "authority_conflict_policy_change"
      - "consumer_topology_change"
    required_consumers:
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "docs/_canon/CONTRACT_PIPELINE.md"
      - ".contract_driven/CONTRACT_SYSTEM_RULES.md"
      - "docs/_canon/DOC_USAGE_MANIFEST.yaml"
      - "docs/_canon/SYNC_MANIFEST.yaml"
      - "docs/_canon/graph/global_rules.yaml"
      - "docs/_canon/graph/global_policies.yaml"
      - "docs/_canon/graph/lifecycle.yaml"
      - "docs/_canon/graph/source_map.yaml"
      - "scripts/contracts/validate/validate_contracts.py"
    blocking_consumers:
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "docs/_canon/CONTRACT_PIPELINE.md"
      - ".contract_driven/CONTRACT_SYSTEM_RULES.md"
      - "docs/_canon/DOC_USAGE_MANIFEST.yaml"
      - "docs/_canon/SYNC_MANIFEST.yaml"
      - "docs/_canon/graph/global_rules.yaml"
      - "docs/_canon/graph/global_policies.yaml"
      - "docs/_canon/graph/lifecycle.yaml"
      - "docs/_canon/graph/source_map.yaml"
      - "scripts/contracts/validate/validate_contracts.py"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/pipeline_gates/test_source_authority_graph.py -q"
      - "python3 -m pytest tests/pipeline_gates/test_source_graph_global_integrity.py -q"

  - rule_id: OPS_SOURCE_GRAPH_SYNC
