  - rule_id: MODULE_TEMPLATES_SYNC
    source_master: ".contract_driven/templates/modulos/"
    source_kind: "module_templates"
    change_types:
      - "module_doc_template_change"
      - "module_state_template_change"
      - "module_ui_template_change"
    required_consumers:
      - "docs/hbtrack/modulos/"
      - ".contract_driven/agent_prompts/create_module_docs.prompt.md"
      - ".contract_driven/agent_prompts/create_state_model.prompt.md"
      - ".contract_driven/agent_prompts/create_ui_contract.prompt.md"
    blocking_consumers:
      - "docs/hbtrack/modulos/"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/contracts/test_module_doc_governance.py -q"

  - rule_id: VALIDATOR_REPORTING_SYNC
    source_master: "scripts/contracts/validate/validate_contracts.py"
    source_kind: "validator_runtime"
    change_types:
      - "gate_execution_change"
      - "report_shape_change"
      - "validator_summary_change"
    required_consumers:
      - "_reports/"
      - ".CEPRAEA/"
      - "SESSION_HANDOFF.md"
      - "docs/_canon/OPERATIONS.md"
      - "docs/_canon/RUNTIME_CURRENT_STATE.md"
      - "docs/_canon/gates/GATES_REGISTRY.yaml"
      - "tests/pipeline_gates/test_gate_registry_parity.py"
    blocking_consumers:
      - "_reports/"
      - "SESSION_HANDOFF.md"
      - "docs/_canon/RUNTIME_CURRENT_STATE.md"
      - "docs/_canon/gates/GATES_REGISTRY.yaml"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/pipeline_gates/test_gate_registry_parity.py -q"

  - rule_id: SESSION_START_SCHEMA_SYNC
    source_master: "contracts/schemas/shared/session_start.schema.json"
    source_kind: "session_schema"
    change_types:
      - "task_type_enum_change"
      - "session_contract_change"
      - "runtime_state_schema_change"
    required_consumers:
      - "_reports/session_start.json"
      - "SESSION_HANDOFF.md"
