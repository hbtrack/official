version: "1.0.0"
artifact: "SYNC_MANIFEST"
status: "active"
scope: "global"

policy:
  objective: >
    Declarar, por source_master soberano ativo, quais consumers obrigatórios
    devem ser atualizados em conjunto quando houver mudança normativa,
    estrutural ou de geração derivada.
  update_mode: "all_required_consumers_must_change_together"
  partial_update_policy: "blocked"
  missing_consumer_status: "FAIL"
  consumer_reference_modes:
    - "path"
    - "directory"
    - "glob"
  enforcement_targets:
    - "B6-002::IMPACT_ANALYSIS_GATE"
    - "B6-002::PARTIAL_UPDATE_GATE"

rules:
  - rule_id: SOURCE_AUTHORITY_GRAPH_SYNC
    source_master: "docs/_canon/SOURCE_AUTHORITY_GRAPH.yaml"
    source_kind: "canon_governance"
    change_types:
      - "precedence_change"
      - "authority_conflict_policy_change"
      - "consumer_topology_change"
    required_consumers:
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "docs/_canon/CONTRACT_PIPELINE.md"
      - ".contract_driven/CONTRACT_SYSTEM_RULES.md"
      - "docs/_canon/DOC_USAGE_MANIFEST.yaml"
      - "docs/_canon/SYNC_MANIFEST.yaml"
      - "docs/_canon/graph/global_rules.yaml"
      - "docs/_canon/graph/global_policies.yaml"
      - "docs/_canon/graph/lifecycle.yaml"
      - "docs/_canon/graph/source_map.yaml"
      - "scripts/contracts/validate/validate_contracts.py"
    blocking_consumers:
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "docs/_canon/CONTRACT_PIPELINE.md"
      - ".contract_driven/CONTRACT_SYSTEM_RULES.md"
      - "docs/_canon/DOC_USAGE_MANIFEST.yaml"
      - "docs/_canon/SYNC_MANIFEST.yaml"
      - "docs/_canon/graph/global_rules.yaml"
      - "docs/_canon/graph/global_policies.yaml"
      - "docs/_canon/graph/lifecycle.yaml"
      - "docs/_canon/graph/source_map.yaml"
      - "scripts/contracts/validate/validate_contracts.py"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/pipeline_gates/test_source_authority_graph.py -q"
      - "python3 -m pytest tests/pipeline_gates/test_source_graph_global_integrity.py -q"

  - rule_id: OPS_SOURCE_GRAPH_SYNC
    source_master: "docs/_canon/graph/ops/"
    source_inputs:
      - ".github/workflows/deploy.yml"
      - "infra/env/.env.staging.template"
      - "infra/env/.env.production.template"
      - "infra/docker-compose.prod.yml"
      - "infra/nginx/nginx.conf"
      - "infra/nginx/nginx.staging.conf"
      - "infra/scripts/rollback.sh"
      - "config/settings.py"
      - "config/urls.py"
    source_kind: "ops_source_graph"
    change_types:
      - "environment_contract_change"
      - "secrets_contract_change"
      - "service_topology_change"
      - "deploy_contract_change"
      - "runtime_endpoint_change"
    required_consumers:
      - "docs/_canon/graph/ops/"
      - ".github/workflows/deploy.yml"
      - "docs/_canon/DEPLOY_PIPELINE.md"
      - "docs/_canon/VPS_SETUP.md"
      - "docs/_canon/OPERATIONS.md"
      - "docs/_canon/decisions/ADR-012-secrets-policy.md"
      - "scripts/deploy/render_env_from_contract.py"
      - "scripts/deploy/inject_env.sh"
      - "scripts/ops/rotate_keys.sh"
      - "infra/env/.env.staging.template"
      - "infra/env/.env.production.template"
      - "compiled_ops/deploy/staging.env.fragment"
      - "compiled_ops/deploy/production.env.fragment"
      - "compiled_ops/deploy/secrets_catalog.json"
      - "compiled_ops/deploy/runtime_topology.json"
      - "compiled_ops/deploy/impact_report.json"
      - "tests/pipeline_gates/test_ops_source_graph_integrity.py"
      - "tests/pipeline_gates/test_ops_contract_compiler.py"
      - "tests/pipeline_gates/test_deploy_env_rendering_flow.py"
      - "tests/pipeline_gates/test_secret_rotation_contract.py"
    blocking_consumers:
      - "docs/_canon/graph/ops/"
      - ".github/workflows/deploy.yml"
      - "docs/_canon/DEPLOY_PIPELINE.md"
      - "docs/_canon/VPS_SETUP.md"
      - "docs/_canon/OPERATIONS.md"
      - "docs/_canon/decisions/ADR-012-secrets-policy.md"
      - "scripts/deploy/render_env_from_contract.py"
      - "scripts/deploy/inject_env.sh"
      - "scripts/ops/rotate_keys.sh"
      - "infra/env/.env.staging.template"
      - "infra/env/.env.production.template"
      - "compiled_ops/deploy/staging.env.fragment"
      - "compiled_ops/deploy/production.env.fragment"
      - "compiled_ops/deploy/secrets_catalog.json"
      - "compiled_ops/deploy/runtime_topology.json"
      - "compiled_ops/deploy/impact_report.json"
      - "tests/pipeline_gates/test_ops_source_graph_integrity.py"
      - "tests/pipeline_gates/test_ops_contract_compiler.py"
      - "tests/pipeline_gates/test_deploy_env_rendering_flow.py"
      - "tests/pipeline_gates/test_secret_rotation_contract.py"
    validation_commands:
      - "python3 scripts/compile/compile_ops_contracts.py --check"
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/pipeline_gates/test_ops_source_graph_integrity.py -q"
      - "python3 -m pytest tests/pipeline_gates/test_ops_contract_compiler.py -q"
      - "python3 -m pytest tests/pipeline_gates/test_deploy_env_rendering_flow.py -q"
      - "python3 -m pytest tests/pipeline_gates/test_secret_rotation_contract.py -q"

  - rule_id: CONTRACT_SYSTEM_RULES_SYNC
    source_master: ".contract_driven/CONTRACT_SYSTEM_RULES.md"
    source_kind: "contract_driven_governance"
    change_types:
      - "precedence_change"
      - "bridge_policy_change"
      - "task_policy_change"
    required_consumers:
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "docs/_canon/CONTRACT_PIPELINE.md"
      - ".contract_driven/BOOT_PROFILES.yaml"
      - "scripts/contracts/validate/validate_contracts.py"
      - ".github/copilot-instructions.md"
      - "CLAUDE.md"
      - ".github/agents/"
      - ".github/skills/"
      - ".github/instructions/"
      - ".codex"
      - "tests/pipeline_gates/test_agent_compliance_phase0.py"
    blocking_consumers:
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "docs/_canon/CONTRACT_PIPELINE.md"
      - ".contract_driven/BOOT_PROFILES.yaml"
      - "scripts/contracts/validate/validate_contracts.py"
      - ".github/instructions/"
      - ".codex"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/pipeline_gates/test_agent_compliance_phase0.py -q"

  - rule_id: CONTRACT_SYSTEM_LAYOUT_SYNC
    source_master: ".contract_driven/CONTRACT_SYSTEM_LAYOUT.md"
    source_kind: "contract_driven_layout"
    change_types:
      - "layout_change"
      - "filesystem_contract_change"
    required_consumers:
      - ".contract_driven/BOOT_PROFILES.yaml"
      - ".contract_driven/CONTRACT_SYSTEM_RULES.md"
      - "scripts/contracts/validate/validate_contracts.py"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"

  - rule_id: AGENT_INSTRUCTIONS_SYNC
    source_master: "docs/_canon/AGENT_INSTRUCTIONS.md"
    source_kind: "canon_agent_boot"
    change_types:
      - "boot_sequence_change"
      - "precedence_change"
      - "agent_behavior_change"
    required_consumers:
      - ".contract_driven/BOOT_PROFILES.yaml"
      - ".github/copilot-instructions.md"
      - "CLAUDE.md"
      - ".github/skills/"
    blocking_consumers:
      - ".contract_driven/BOOT_PROFILES.yaml"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/pipeline_gates/test_agent_compliance_phase0.py -q"

  - rule_id: TASK_CATALOG_SYNC
    source_master: ".contract_driven/TASK_CATALOG.yaml"
    source_inputs:
      - ".contract_driven/BOOT_PROFILES.yaml"
    source_kind: "task_catalog"
    change_types:
      - "task_type_change"
      - "worker_route_change"
      - "stage_policy_change"
    required_consumers:
      - ".contract_driven/BOOT_PROFILES.yaml"
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "scripts/hb"
      - ".contract_driven/agent_prompts/pre_contract_orchestrator.prompt.md"
      - "contracts/schemas/shared/session_start.schema.json"
      - "generated/contracts/schemas/shared/session_start.schema.json"
    blocking_consumers:
      - ".contract_driven/BOOT_PROFILES.yaml"
      - "scripts/hb"
      - "contracts/schemas/shared/session_start.schema.json"
      - "generated/contracts/schemas/shared/session_start.schema.json"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/pipeline_gates/test_runtime_promotions.py -q"

  - rule_id: CONTRACT_PIPELINE_SYNC
    source_master: "docs/_canon/CONTRACT_PIPELINE.md"
    source_kind: "canon_pipeline"
    change_types:
      - "lifecycle_change"
      - "promotion_route_change"
      - "blocking_rule_change"
    required_consumers:
      - "scripts/hb"
      - "scripts/contracts/validate/validate_contracts.py"
      - ".contract_driven/TASK_CATALOG.yaml"
      - "docs/_canon/MODULE_REGISTRY.yaml"
    blocking_consumers:
      - "scripts/hb"
      - "scripts/contracts/validate/validate_contracts.py"
      - ".contract_driven/TASK_CATALOG.yaml"
      - "docs/_canon/MODULE_REGISTRY.yaml"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/pipeline_gates/test_implementation_promotion.py -q"
      - "python3 -m pytest tests/pipeline_gates/test_runtime_promotions.py -q"

  - rule_id: GATES_REGISTRY_SYNC
    source_master: "docs/_canon/gates/GATES_REGISTRY.yaml"
    source_kind: "gate_registry"
    change_types:
      - "gate_addition"
      - "gate_removal"
      - "gate_metadata_change"
    required_consumers:
      - "scripts/contracts/validate/validate_contracts.py"
      - "tests/pipeline_gates/test_gate_registry_parity.py"
      - "docs/_canon/CI_CONTRACT_GATES.md"
      - "docs/_canon/gates/README.md"
    blocking_consumers:
      - "scripts/contracts/validate/validate_contracts.py"
      - "docs/_canon/CI_CONTRACT_GATES.md"
      - "docs/_canon/gates/README.md"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/pipeline_gates/test_gate_registry_parity.py -q"

  - rule_id: MODULE_REGISTRY_SYNC
    source_master: "docs/_canon/MODULE_REGISTRY.yaml"
    source_inputs:
      - "docs/_canon/FEATURE_REGISTRY.yaml"
    source_kind: "module_registry"
    change_types:
      - "module_status_change"
      - "expected_surface_change"
      - "feature_state_change"
    required_consumers:
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "docs/_canon/CONTRACT_PIPELINE.md"
      - "scripts/contracts/validate/validate_contracts.py"
      - "docs/hbtrack/modulos/"
    blocking_consumers:
      - "docs/_canon/AGENT_INSTRUCTIONS.md"
      - "docs/_canon/CONTRACT_PIPELINE.md"
      - "scripts/contracts/validate/validate_contracts.py"
      - "docs/hbtrack/modulos/"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/contracts/test_module_doc_governance.py -q"

  - rule_id: MODULE_SOURCE_AUTHORITY_MATRIX_SYNC
    source_master: "docs/_canon/MODULE_SOURCE_AUTHORITY_MATRIX.yaml"
    source_kind: "module_authority_matrix"
    change_types:
      - "module_source_limit_change"
      - "allowed_source_change"
      - "forbidden_source_change"
    required_consumers:
      - ".contract_driven/CONTRACT_SYSTEM_RULES.md"
      - "docs/hbtrack/modulos/"
      - "scripts/contracts/validate/validate_contracts.py"
    blocking_consumers:
      - ".contract_driven/CONTRACT_SYSTEM_RULES.md"
      - "docs/hbtrack/modulos/"
      - "scripts/contracts/validate/validate_contracts.py"
    validation_commands:
      - "python3 scripts/validate_contracts.py --profile ci"
      - "python3 -m pytest tests/pipeline_gates/test_hbtrack_canon_parity_gate.py -q"

  - rule_id: API_RULES_SYNC
    source_master: ".contract_driven/templates/api/api_rules.yaml"
    source_kind: "http_api_contract_policy"
    change_types:
      - "http_contract_rule_change"
      - "api_validation_policy_change"
      - "http_error_model_change"
    required_consumers:
      - "contracts/openapi/openapi.yaml"
      - ".contract_driven/agent_prompts/create_openapi_contract.prompt.md"
      - "scripts/contracts/validate/api/policy_compiler.py"
      - "scripts/contracts/validate/validate_contracts.py"
    blocking_consumers:
      - "contracts/openapi/openapi.yaml"
      - "scripts/contracts/validate/api/policy_compiler.py"
      - "scripts/contracts/validate/validate_contracts.py"
    validation_commands:
      - "python3 scripts/contracts/validate/api/compile_api_policy.py --all --check --format json"
