known_gaps:
  - "AsyncAPI/Arazzo do módulo seguem governança separada e não estão incluídos nesta fase do source graph."
  - "principalUserId em AuthSession referencia o módulo users — identity_access não é dono de perfil esportivo (DR-IAM-002)."
  - "Consentimentos OAuth/OIDC provider externos não são modelados aqui — boundary explicitado em DR-IAM-005."
  - "MFA provider externo (TOTP, WebAuthn) é infraestrutura — não modelado como entidade soberana nesta fase."
  - "JWT signing key management é infraestrutura — fora do escopo do source graph de domínio."
  - "BOUNDARY_USERS_IDENTITY_ACCESS_GATE valida que birth_date, height, position não aparecem neste módulo (INV-IAM-004)."
