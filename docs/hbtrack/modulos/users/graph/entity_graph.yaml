version: "1.0.0"
status: active
module: users

entities:
  UserProfile:
    schema_ref: "../../../../../contracts/schemas/users/user_profile.schema.json"
    runtime_entity_ref: "../../../../../src/users/domain/entities.py#UserProfile"
    docs_refs:
      - "../DOMAIN_RULES_USERS.md"
      - "../INVARIANTS_USERS.md"
      - "../PERMISSIONS_USERS.md"
    sovereign_fields:
      - name: id
        runtime_name: id
        required: true
        type: uuid_v4
      - name: organizationId
        runtime_name: organization_id
        required: false
        type: uuid_v4
        constraints:
          - "boundary: reference to identity_access module (DR-USR-001)"
          - "nullable: true"
      - name: firstName
        runtime_name: first_name
        required: false
        type: string
        constraints:
          - "nullable: true"
      - name: lastName
        runtime_name: last_name
        required: false
        type: string
        constraints:
          - "nullable: true"
      - name: displayName
        runtime_name: display_name
        required: true
        type: string
        constraints:
          - "minLength: 1"
          - "INV-USR-001: obrigatório no perfil estável"
      - name: roleLabel
        runtime_name: role_label
        required: true
        type: enum
        values:
          - admin
          - coordinator
          - coach
          - athlete
          - member
        constraints:
          - "ADR-008: 5 atores canônicos do sistema"
          - "DR-USR-002: papel funcional/esportivo, não autoriza acesso técnico"
          - "INV-USR-001: obrigatório no perfil estável"
      - name: statusLabel
        runtime_name: status_label
        required: false
        type: enum
        values:
          - ACTIVE
          - PENDING_ACTIVATION
          - SUSPENDED
        constraints:
          - "DEC-USERS-002: lifecycle status"
          - "default: PENDING_ACTIVATION na criação"
      - name: positionLabel
        runtime_name: position_label
        required: false
        type: string
        constraints:
          - "nullable: true"
          - "DR-USR-004: contexto esportivo, não autorização"
      - name: preferredLanguage
        runtime_name: preferred_language
        required: false
        type: string
        constraints:
          - "nullable: true"
          - "DR-USR-005: preferência operacional, não estado de segurança"
      - name: preferenceTags
        runtime_name: preference_tags
        required: false
        type: array_of_string
        constraints:
          - "uniqueItems: true"
          - "items.maxLength: 40"
          - "INV-USR-002: sem duplicatas"
          - "DR-USR-005: preferência operacional, não credencial"
      - name: teamIds
        runtime_name: team_ids
        required: false
        type: array_of_uuid
        constraints:
          - "uniqueItems: true"
          - "INV-USR-002: sem duplicatas"
          - "DR-USR-003: vínculo contratual, não inferido"
          - "boundary: reference to teams module"
      - name: seasonIds
        runtime_name: season_ids
        required: false
        type: array_of_uuid
        constraints:
          - "uniqueItems: true"
          - "INV-USR-002: sem duplicatas"
          - "DR-USR-003: vínculo contratual, não inferido"
          - "boundary: reference to seasons module"

    domain_enums:
      - name: RoleLabel
        values: [admin, coordinator, coach, athlete, member]
        source: "ADR-008 / SYSTEM_SCOPE.md"
      - name: UserStatus
        values: [ACTIVE, PENDING_ACTIVATION, SUSPENDED]
        source: "DEC-USERS-002"

    invariants:
      - id: INV-USR-001
        rule: "id, displayName e roleLabel são obrigatórios no perfil estável."
      - id: INV-USR-002
        rule: "teamIds, seasonIds e preferenceTags devem ter uniqueItems."
      - id: INV-USR-003
        rule: "Campos de authn/authz (password_hash, jwt, mfa, etc.) nunca pertencem a UserProfile."
      - id: INV-USR-004
        rule: "Boundary: credenciais e sessão pertencem exclusivamente a identity_access."
