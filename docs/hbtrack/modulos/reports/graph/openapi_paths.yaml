/reports/jobs/{jobId}/download:
  get:
    operationId: downloadReportArtifact
    summary: Download generated report artifact
    description: >
      Downloads the generated report file (PDF, Excel, CSV, JSON).
      Only available for completed jobs. Returns binary content with appropriate Content-Type header.
      IMPORTANT: does not transfer storage ownership; generatedArtifactRef is adapter to external storage (DR-RPT-004).
    security:
      - HTTPBearer: []
    tags:
      - reports
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          x-semantic-id: core.resource.id.v1
    responses:
      "200":
        description: Report artifact downloaded successfully.
        content:
          application/pdf:
            schema:
              type: string
              format: binary
          application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
            schema:
              type: string
              format: binary
          text/csv:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
              additionalProperties: true
      "401":
        description: Unauthorized
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "403":
        description: Forbidden (insufficient access to download).
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "404":
        description: Job not found or artifact not yet generated
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas/shared/problem.yaml"
      "410":
