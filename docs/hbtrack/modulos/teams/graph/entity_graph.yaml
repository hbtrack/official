version: "1.0.0"
status: active
module: teams

entities:
  Team:
    schema_ref: "../../../../../contracts/schemas/teams/team.schema.json"
    runtime_entity_ref: "../../../../../src/teams/domain/entities.py#Team"
    docs_refs:
      - "../DOMAIN_RULES_TEAMS.md"
      - "../INVARIANTS_TEAMS.md"
      - "../PERMISSIONS_TEAMS.md"
    sovereign_fields:
      - name: id
        runtime_name: id
        required: true
        type: uuid_v4
      - name: organizationId
        runtime_name: organization_id
        required: true
        type: uuid_v4
        constraints:
          - "boundary: reference to identity_access module"
      - name: seasonId
        runtime_name: season_id
        required: false
        type: uuid_v4
        constraints:
          - "boundary: reference to seasons module (DR-TEAM-004)"
      - name: name
        runtime_name: name
        required: true
        type: string
        constraints:
          - "minLength: 1"
          - "maxLength: 120"
      - name: shortName
        runtime_name: short_name
        required: false
        type: string
      - name: categoryLabel
        runtime_name: category_label
        required: true
        type: string
        constraints:
          - "minLength: 1"
          - "maxLength: 80"
          - "DR-TEAM-003: identifies competitive level"
      - name: athleteIds
        runtime_name: athlete_ids
        required: false
        type: array_of_uuid
        constraints:
          - "INV-TEAM-002: uniqueItems"
          - "boundary: reference to users module"
      - name: staffUserIds
        runtime_name: staff_user_ids
        required: false
        type: array_of_uuid
        constraints:
          - "INV-TEAM-002: uniqueItems"
          - "boundary: reference to users module"
      - name: rosterNotes
        runtime_name: roster_notes
        required: false
        type: string
    runtime_extension_fields:
      - name: statusLabel
        runtime_name: status_label
        type: enum
        values:
          - DRAFT
          - ACTIVE
          - ARCHIVED
      - name: createdAt
        runtime_name: created_at
        type: datetime_iso8601
      - name: updatedAt
        runtime_name: updated_at
        type: datetime_iso8601
