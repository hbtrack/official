  post:
    operationId: createAnalyticsSnapshot
    summary: Create a new analytics snapshot
    description: >
      Creates a new derived metric snapshot.
      Snapshot must declare: metricKey, sourceModuleLabels, timeWindowLabel, granularityLabel, refreshModeLabel.
      IMPORTANT: All KPIs must have canonical definition before becoming contract (DR-ANL-002).
      Only admin, coordinator and coach can create staff-level snapshots.
    security:
      - HTTPBearer: []
    tags:
      - analytics
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
              [
                metricKey,
                sourceModuleLabels,
                timeWindowLabel,
                granularityLabel,
                refreshModeLabel,
              ]
            additionalProperties: false
            properties:
              metricKey:
                $ref: "../components/schemas/analytics/analytics_metric_key.yaml"
              sourceModuleLabels:
                type: array
                items:
                  type: string
                  enum: [TRAINING, WELLNESS]
                uniqueItems: true
                minItems: 1
                description: List of source modules (e.g., ["TRAINING", "WELLNESS"]).
              timeWindowLabel:
                type: string
                enum:
                  [
                    LAST_7_DAYS,
                    LAST_14_DAYS,
                    LAST_28_DAYS,
                    LAST_90_DAYS,
                    LAST_YEAR,
                    CUSTOM,
                  ]
                description: Time window label used to compute this snapshot.
              granularityLabel:
                type: string
                enum: [DAILY, WEEKLY, MONTHLY]
                description: Granularity label used to compute this snapshot.
              filterSummary:
                type: string
                maxLength: 500
                description: Summary of filters applied (e.g., "team=senior-male, minTrainingSessions=5").
              projectionKey:
                type: string
                maxLength: 80
                description: Projection/dashboard key for grouping (e.g., "team-load-overview").
              refreshModeLabel:
                type: string
                maxLength: 40
                enum: [scheduled, on_demand, streaming]
                description: How snapshot is refreshed (scheduled daily, on-demand query, streaming).
    responses:
