/analytics/snapshots:
  get:
    operationId: listAnalyticsSnapshots
    summary: List analytics snapshots (derived metrics)
    description: >
      Returns a paginated list of analytics snapshots (derived metrics).
      Snapshots are computed extracts with explicit time windows, granularity, and source module provenance.
      IMPORTANT: analytics does not own raw data; all snapshots declare sourceModuleLabels.
      Filters: sourceModule, metricKey, timeWindow, granularity, dateFrom, dateTo.
    security:
      - HTTPBearer: []
    tags:
      - analytics
    parameters:
      - name: sourceModule
        in: query
        required: false
        schema:
          type: string
          enum: [TRAINING, WELLNESS]
        description: Filter by source module for the canonical derived signals currently supported.
      - name: metricKey
        in: query
        required: false
        schema:
          $ref: "../components/schemas/analytics/analytics_metric_key.yaml"
        description: Filter by canonical metric key.
      - name: timeWindow
        in: query
        required: false
        schema:
          type: string
          enum:
            [
              LAST_7_DAYS,
              LAST_14_DAYS,
              LAST_28_DAYS,
              LAST_90_DAYS,
              LAST_YEAR,
              CUSTOM,
            ]
        description: Filter by time window label.
      - name: granularity
        in: query
        required: false
        schema:
          type: string
          enum: [DAILY, WEEKLY, MONTHLY]
        description: Filter by granularity label.
      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter snapshots computed from this date (ISO 8601).
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Filter snapshots computed until this date (ISO 8601).
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: pageToken
        in: query
        required: false
        schema:
          type: string
        description: Pagination token from previous response.
    responses:
      "200":
        description: Paginated list of analytics snapshots.
        content:
          application/json:
            schema:
              type: object
              required: [data, nextPageToken]
              additionalProperties: false
              properties:
                data:
